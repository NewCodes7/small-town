# Blue-Green 배포 대상 upstream
# 전환 시: server 주소를 newcodes-backend-green:8080 으로 변경 후 nginx -s reload
upstream backend {
    zone backend 64k;
    server newcodes-backend-blue:8080 resolve;
}

# Rate limiting 설정
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=autocomplete:10m rate=10r/s;  # 자동완성 전용 (초당 10회)
limit_req_zone $binary_remote_addr zone=static:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=ai_summary:10m rate=5r/m;  # AI 요약 전용 (분당 5회)

# HTTP to HTTPS 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name newcodes.net www.newcodes.net;

    # Let's Encrypt 인증서 갱신을 위한 설정
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 나머지 모든 요청을 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# 프록시 캐시 설정
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=newcodes_cache:10m max_size=1g inactive=60m;

# HTTPS 서버
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name newcodes.net www.newcodes.net;

    # SSL 인증서 설정
    ssl_certificate /etc/letsencrypt/live/newcodes.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newcodes.net/privkey.pem;

    # Let's Encrypt 추가 설정 포함
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    # 보안 헤더 추가
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 클라이언트 업로드 크기 제한
    client_max_body_size 10M;


    # 해당 엔드포인트는 캐시하지 않음
    location ^~ /admin/monitor/ {
        proxy_pass http://grafana:3000/;

        # 버퍼링 설정 (큰 대시보드용)
        proxy_buffering off;
        proxy_buffer_size 4k;

        # WebSocket 지원
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 기존 헤더들
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # 캐시 비활성화
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # 타임아웃
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # AI 요약 SSE API - 분당 5회 rate limit, 버퍼링 비활성화 필수
    location = /api/search/ai-summary {
        limit_req zone=ai_summary burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # SSE 스트리밍을 위해 버퍼링 비활성화
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering "no";

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # SSE 연결 유지 (SseEmitter 30s + 여유)
        proxy_connect_timeout 10s;
        proxy_send_timeout 40s;
        proxy_read_timeout 40s;
    }

    # 자동완성 API - 별도 rate limit (연속 호출 허용)
    location = /api/autocomplete {
        limit_req zone=autocomplete burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # 해당 엔드포인트는 캐시하지 않음
    location ^~ /api/ {
        # Rate limiting
        limit_req zone=api burst=10 nodelay;
        limit_req_status 444;

        proxy_pass http://backend;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # keepalive 연결 활성화 (HTTP/2 연속 요청 시 필수)
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Actuator는 Admin 서버에서만 접근 가능
    location ^~ /actuator/ {
        # Rate limiting
        limit_req zone=general burst=5 nodelay;
        limit_req_status 444;

        allow 127.0.0.1;
        deny all;

        proxy_pass http://backend;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # keepalive 연결 활성화
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 정적 리소스 캐싱 (CSS, JS, 이미지 등)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        # Rate limiting
        limit_req zone=static burst=20 nodelay;
        limit_req_status 444;

        proxy_pass http://backend;
        proxy_cache newcodes_cache;
        proxy_cache_valid 200 1d;
        expires 1d;

        # keepalive 연결 활성화
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 위에서 명시한 경로 빼고는 모두 캐시
    location / {
        # Rate limiting
        limit_req zone=general burst=5 nodelay;
        limit_req_status 444;

        proxy_pass http://backend;
        proxy_cache newcodes_cache;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_valid 500 502 503 504 1m;
        proxy_cache_bypass $http_cache_control;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating;

        # keepalive 연결 활성화 (HTTP/2 연속 요청 시 필수)
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 프록시 헤더 설정
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # 타임아웃 설정
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 버퍼링 설정
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
}
