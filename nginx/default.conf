# Blue-Green 배포 대상 upstream
# 전환 시: server 주소를 newcodes-backend-green:8080 으로 변경 후 nginx -s reload
upstream backend {
    zone backend 64k;
    server newcodes-backend-blue:8080 resolve;
}

# 부하테스트(Fargate) 전용 IP 예외 — 이 IP들로 들어온 요청만 rate limit 미적용, 나머지는 기존 제한 그대로 적용됨.
# $remote_addr 기준(스푸핑 불가, TCP 핸드셰이크 필요) — NAT Gateway 등으로 고정된 EIP만 등록해 범위를 좁힐 것.
# 부하테스트 종료 후에는 이 블록 자체를 제거하거나 최소 IP들을 무효화해 상시 우회 경로로 남기지 않는다.
# RagChatController.rateLimitExemptIps 프로퍼티(rag.chat.rate-limit-exempt-ips)에도 같은 IP들을 넣어야 앱 레벨(시간당 30회) 제한도 같이 예외 처리됨.
geo $loadtest_bypass {
    default 0;
    # TODO: 아래는 예시 — 실제 Fargate 부하테스트 NAT Gateway EIP(들)로 교체. 필요한 만큼 줄 추가.
    203.0.113.10/32 1;
    203.0.113.11/32 1;
    198.51.100.0/24 1;  # AZ별 NAT Gateway가 여러 개면 대역으로 한 번에 등록 가능
}

map $loadtest_bypass $limit_key {
    0 $binary_remote_addr;
    1 "";  # 빈 문자열 키 → nginx가 해당 요청은 rate limit 카운트에서 제외
}

# Rate limiting 설정
limit_req_zone $limit_key zone=general:10m rate=10r/s;
limit_req_zone $limit_key zone=api:10m rate=120r/m;
limit_req_zone $limit_key zone=autocomplete:10m rate=10r/s;  # 자동완성 전용 (초당 10회)
limit_req_zone $limit_key zone=static:10m rate=50r/s;
limit_req_zone $limit_key zone=ai_summary:10m rate=5r/m;  # AI 요약 전용 (분당 5회)
limit_req_zone $limit_key zone=rag_answer_min:10m rate=10r/m;  # RAG 챗봇 - 분당 10회
# 시간당 30회 제한은 nginx limit_req(정수 r/s·r/m만 지원, 소수점 rate 불가)로 표현 불가 →
# 애플리케이션에서 rag_query_log.ip_address/created_at 기준 카운트 쿼리로 처리 (RagChatController 참고)

# HTTP to HTTPS 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name newcodes.net www.newcodes.net;

    # Let's Encrypt 인증서 갱신을 위한 설정
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 나머지 모든 요청을 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# 프록시 캐시 설정
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=newcodes_cache:10m max_size=1g inactive=60m;

# HTTPS 서버
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name newcodes.net www.newcodes.net;

    # SSL 인증서 설정
    ssl_certificate /etc/letsencrypt/live/newcodes.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newcodes.net/privkey.pem;

    # Let's Encrypt 추가 설정 포함
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    # 보안 헤더 추가
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 클라이언트 업로드 크기 제한
    client_max_body_size 10M;


    # /admin/monitor → /admin/monitor/ (trailing slash 없이 접속 시 백엔드로 새지 않도록)
    location = /admin/monitor {
        return 301 /admin/monitor/;
    }

    # 해당 엔드포인트는 캐시하지 않음
    # Grafana 9.2+ 는 serve_from_sub_path=true일 때 prefix 없는 요청을 root_url로 리다이렉트하므로
    # prefix를 벗기지 말고 그대로 전달해야 함 (proxy_pass 끝에 / 금지 — 리다이렉트 루프 원인)
    location ^~ /admin/monitor/ {
        proxy_pass http://grafana:3000;

        # 버퍼링 설정 (큰 대시보드용)
        proxy_buffering off;
        proxy_buffer_size 4k;

        # WebSocket 지원
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 기존 헤더들
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # 캐시 비활성화
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # 타임아웃
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # AI 요약 SSE API - 분당 5회 rate limit, 버퍼링 비활성화 필수
    location = /api/search/ai-summary {
        limit_req zone=ai_summary burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # SSE 스트리밍을 위해 버퍼링 비활성화
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering "no";

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # SSE 연결 유지 (SseEmitter 30s + 여유)
        proxy_connect_timeout 10s;
        proxy_send_timeout 40s;
        proxy_read_timeout 40s;
    }

    # RAG 챗봇 SSE API (실사용자용) - 분당 10회 rate limit(nginx), 시간당 30회는 app에서 처리
    location = /api/rag/answer {
        limit_req zone=rag_answer_min burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # SSE 스트리밍을 위해 버퍼링 비활성화
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering "no";

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # SSE 연결 유지 (SseEmitter 150s + 여유)
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # RAG 부하테스트 SSE API (LLM mock 경유) - $loadtest_bypass geo에 등록된 IP만 통과, 그 외 403.
    # 앱에서도 rag.chat.loadtest.enabled(기본 false)로 게이트 — 비활성 시 404 (load-test/README.md)
    location = /api/rag/answer/loadtest {
        if ($loadtest_bypass = 0) {
            return 403;
        }

        proxy_pass http://backend;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # SSE 스트리밍을 위해 버퍼링 비활성화
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering "no";

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # SSE 연결 유지 (SseEmitter 150s + 여유, 실사용자 경로와 동일)
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # 관리자 RAG SSE API - Gemini 호출(최대 5분) 동안 이벤트가 없어도 연결 유지
    # TODO: 임시 조치 (2026-07-09) — Gemini 타임아웃 원인 규명 후 타임아웃 재조정 필요
    location = /api/admin/rag/answer {
        proxy_pass http://backend;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # SSE 스트리밍을 위해 버퍼링 비활성화
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering "no";

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # SSE 연결 유지 (SseEmitter 660s + 여유)
        proxy_connect_timeout 10s;
        proxy_send_timeout 700s;
        proxy_read_timeout 700s;
    }

    # 자동완성 API - 별도 rate limit (연속 호출 허용)
    location = /api/autocomplete {
        limit_req zone=autocomplete burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # 해당 엔드포인트는 캐시하지 않음
    location ^~ /api/ {
        # Rate limiting
        limit_req zone=api burst=10 nodelay;
        limit_req_status 444;

        proxy_pass http://backend;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # keepalive 연결 활성화 (HTTP/2 연속 요청 시 필수)
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Actuator는 Admin 서버에서만 접근 가능
    location ^~ /actuator/ {
        # Rate limiting
        limit_req zone=general burst=5 nodelay;
        limit_req_status 444;

        allow 127.0.0.1;
        deny all;

        proxy_pass http://backend;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # keepalive 연결 활성화
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 정적 리소스 캐싱 (CSS, JS, 이미지 등)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        # Rate limiting
        limit_req zone=static burst=20 nodelay;
        limit_req_status 444;

        proxy_pass http://backend;
        proxy_cache newcodes_cache;
        proxy_cache_valid 200 1d;
        expires 1d;

        # keepalive 연결 활성화
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 위에서 명시한 경로 빼고는 모두 캐시
    location / {
        # Rate limiting
        limit_req zone=general burst=5 nodelay;
        limit_req_status 444;

        proxy_pass http://backend;
        proxy_cache newcodes_cache;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_valid 500 502 503 504 1m;
        proxy_cache_bypass $http_cache_control;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating;

        # keepalive 연결 활성화 (HTTP/2 연속 요청 시 필수)
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 프록시 헤더 설정
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # 타임아웃 설정
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 버퍼링 설정
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
}
