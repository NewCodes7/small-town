org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
# 개발 환경(4코어)에서 컴파일 워커가 코어를 전부 점유하지 않도록 제한
org.gradle.workers.max=2
# 빌드 캐시: CI에서 test job이 컴파일한 결과물을 build-and-deploy job(bootJar)이 재사용해
# 동일 소스 재컴파일을 스킵 (gradle/actions/setup-gradle이 job 간 캐시 복원을 처리)
org.gradle.caching=true
# 데몬/워커를 낮은 프로세스 우선순위로 실행 — 테스트 중에도 셸·IDE 응답성 유지
org.gradle.priority=low
