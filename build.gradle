plugins {
	id 'java'
 	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'com.diffplug.spotless' version '8.7.0'
	id 'com.github.spotbugs' version '6.5.8'
}

group = 'com.newcodes7'
version = '1.0.0-SNAPSHOT'

ext['selenium.version'] = '4.44.0'
// opentelemetry-jdbc 2.29.0-alpha가 요구하는 API 1.63과 Boot BOM(1.62) 정합
ext['opentelemetry.version'] = '1.63.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(26)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'org.postgresql:postgresql:42.7.11'
    implementation 'com.pgvector:pgvector:0.1.6'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// Boot 4 모듈 분리: RestTemplateBuilder 가 starter-web 에서 빠져 별도 스타터 필요
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'jakarta.validation:jakarta.validation-api:3.1.1'
    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine'

	// 모니터링
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	// 분산 트레이싱: OTel SDK + OTLP export 자동설정 (Tempo로 전송)
	implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
	// @Observed(ObservedAspect) 프록시용 — Boot 4에서 starter-aop 제거, aspectjweaver 직접 선언
	implementation 'org.aspectj:aspectjweaver'
	// JDBC 쿼리별 span — datasource-micrometer가 Boot 4 미지원(v2.0.0 미출시)이라 OTel 계측 사용
	implementation 'io.opentelemetry.instrumentation:opentelemetry-jdbc:2.29.0-alpha'
	
	// Spring Security & JWT
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    // Selenium 관련 의존성
    implementation 'org.seleniumhq.selenium:selenium-java'
    implementation 'io.github.bonigarcia:webdrivermanager:6.3.3'
    
    // 스케줄링
    implementation 'org.springframework.boot:spring-boot-starter-quartz'
    
    // JSON 파싱
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.jsoup:jsoup:1.17.2'

    // Content extraction (깨끗한 본문 추출)
    implementation 'net.dankito.readability4j:readability4j:1.0.8'

    // HTML 엔티티 디코딩
    implementation 'org.apache.commons:commons-text:1.15.0'
    
    // RSS/Atom Feed 파싱
    implementation 'com.rometools:rome:2.1.0'

    // YouTube Data API
    implementation 'com.google.api-client:google-api-client:2.2.0'
    implementation 'com.google.apis:google-api-services-youtube:v3-rev20240916-2.0.0'
    implementation 'com.google.http-client:google-http-client-jackson2:2.1.0'

    // AWS S3 and CloudFront
    implementation 'org.springframework.cloud:spring-cloud-starter-aws:2.2.6.RELEASE'
    implementation 'com.amazonaws:aws-java-sdk-s3:1.12.261'
    implementation 'com.amazonaws:aws-java-sdk-core:1.12.261'

    // AWS Bedrock (RAG 관리자 테스트용 LLM — SDK v2, 위 S3의 v1과 공존)
    implementation platform('software.amazon.awssdk:bom:2.33.5')
    implementation 'software.amazon.awssdk:bedrockruntime'
    implementation 'software.amazon.awssdk:apache-client'
    implementation 'software.amazon.awssdk:netty-nio-client'

    // WebP 이미지 변환 (scrimage - 더 간단하고 강력한 이미지 처리 라이브러리)
    implementation 'com.sksamuel.scrimage:scrimage-core:4.6.5'
    implementation 'com.sksamuel.scrimage:scrimage-webp:4.6.5'

    // 한국어 형태소 분석기 (Lucene Nori - MeCab-Ko 사전 기반)
    implementation 'org.apache.lucene:lucene-analysis-nori:9.12.3'

    // 영어 형태소 분석기 (Apache Lucene)
    implementation 'org.apache.lucene:lucene-core:9.12.3'
    implementation 'org.apache.lucene:lucene-analysis-common:9.12.3'

    // OpenAI 토큰 카운터 (jtokkit)
    implementation 'com.knuddels:jtokkit:1.0.0'

    // Apache HttpClient 5 (Spring Boot 관리 버전 사용)
    implementation 'org.apache.httpcomponents.client5:httpclient5'

	// DB 마이그레이션
	// Boot 4 모듈 분리: Flyway 자동설정이 spring-boot-flyway 모듈로 이동 (없으면 마이그레이션 미실행)
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Boot 4 모듈 분리: MockMvc 테스트 지원(@AutoConfigureMockMvc)이 별도 스타터로 이동
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.assertj:assertj-core'

	// SAST 보안 규칙 (SpotBugs 플러그인)
	spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.13.0'
}

// 병렬 테스트 포크 수: 기본 CPU/2, -PtestForks=N 으로 오버라이드
def hostCpus = Runtime.runtime.availableProcessors()
def testForks = (findProperty('testForks') ?: Math.max(1, hostCpus.intdiv(2))) as int
// 포크별 CPU 배정: 전체 코어에서 1개(OS·Postgres·Gradle 데몬 몫)를 뺀 나머지를 포크 수로 분배.
// JVM이 이 값 기준으로 GC/JIT/커먼풀 스레드를 만들어 전체 CPU 점유가 코어 수를 넘지 않게 한다.
// -PtestCpusPerFork=N 으로 오버라이드
def testCpusPerFork = (findProperty('testCpusPerFork')
		?: Math.max(1, (hostCpus - 1).intdiv(testForks))) as int

tasks.named('test') {
	useJUnitPlatform()
	maxHeapSize = '1g'
	maxParallelForks = testForks
	// C2 JIT 생략(레벨1까지만 컴파일) — 통합테스트는 컨텍스트 부팅+DB I/O 위주라
	// 실행 손해보다 부팅 시 JIT CPU 절감이 훨씬 큼
	jvmArgs "-XX:ActiveProcessorCount=${testCpusPerFork}", '-XX:TieredStopAtLevel=1'
	systemProperty 'spring.profiles.active', 'test'
	// 포크별 독립 DB 슬롯 수 — TestDatabaseInitializer가 worker id % slots로 DB 이름 분리
	systemProperty 'test.db.slots', testForks
	// 커버리지 리포트는 CI 또는 -Pcoverage 지정 시에만 생성 (로컬 반복 실행 시간 절약)
	if (System.getenv('CI') != null || project.hasProperty('coverage')) {
		finalizedBy jacocoTestReport
	}
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

jar {
    enabled = false
}

// ---------------------------------------------------------------------------
// 검증 파이프라인 — 포맷/린트(Spotless) + SAST(SpotBugs + find-sec-bugs)
// 자세한 설계: .claude/hooks/ 및 plans 문서 참고
// ---------------------------------------------------------------------------

spotless {
	// 작업 트리에서 변경된(커밋 전) 파일만 검사 → 레거시/기존 커밋에 막히지 않음.
	// (로컬 main 이 origin/main 보다 많이 앞서 있어 origin/main 기준은 부적합)
	ratchetFrom 'HEAD'
	java {
		target 'src/**/*.java'
		// 세션 시작 시점에 이미 더럽던 파일(기존 WIP)은 게이트 대상에서 제외
		def gateBaseline = file('.claude/.cache/baseline-files')
		if (gateBaseline.exists()) {
			def excl = gateBaseline.readLines().findAll { it.endsWith('.java') }
			if (excl) { targetExclude(excl as String[]) }
		}
		// 라이트터치: 재정렬/재들여쓰기 없이 진단 위주.
		// (googleJavaFormat 기본은 2-space 라 프로젝트 4-space 컨벤션과 충돌하므로 미사용)
		importOrder()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

// Spring 의존성 관리 BOM이 spotbugs 도구 클래스패스의 의존성(commons-lang3, gson, log4j 등)을
// 구버전으로 강등시켜 SpotBugs 4.10+ 이 NoClassDefFoundError 로 죽는다.
// → 도구 configuration 에서는 BOM 관리를 무시하고 SpotBugs 가 요청한 버전을 그대로 복원.
//   (force 는 dependency-management 플러그인의 rule 에 지므로 eachDependency 로 덮어쓴다)
configurations.matching { it.name.startsWith('spotbugs') }.all {
	resolutionStrategy.eachDependency { details ->
		if (details.requested.version) {
			details.useVersion details.requested.version
		}
	}
}

def spotbugsExclude = file('config/spotbugs/exclude.xml')

spotbugs {
	// 게이트 판정은 훅(.claude/hooks/sast-filter.py)이 "변경된 라인"만 대상으로 수행한다.
	// → SpotBugs 자체는 항상 리포트만 남기고 성공으로 끝낸다(레거시 결함/분석 경고로 막히지 않음).
	ignoreFailures = true
	// NOTE: Confidence 는 constant 별 본문 enum 이라 `Confidence.MEDIUM` 이
	// 중첩 클래스로 해석됨 → valueOf 로 enum 상수를 명시적으로 가져온다.
	effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
	reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
	if (spotbugsExclude.exists()) {
		excludeFilter = spotbugsExclude
	}
}

// 테스트 코드는 SAST 대상에서 제외 (메인 소스만 검사)
tasks.named('spotbugsTest') { enabled = false }

tasks.named('spotbugsMain') {
	reports {
		xml.required = true   // baseline 생성/대조용
		text.required = true  // 훅에서 파싱하기 쉬운 형식
		html.required = false
	}
}
