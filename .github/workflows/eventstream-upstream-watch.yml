name: EventStream upstream watch

on:
  schedule:
    - cron: '17 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check EventStream and AWS SDK upstream
        id: upstream
        continue-on-error: true
        run: scripts/check-eventstream-upstream.sh 2>&1 | tee /tmp/eventstream-upstream-check.txt

      - name: Open or update maintenance issue
        if: steps.upstream.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const title = 'chore: AWS EventStream 포크 upstream 변경 확인';
            const details = fs.readFileSync('/tmp/eventstream-upstream-check.txt', 'utf8');
            const body = [
              '주간 점검에서 EventStream 포크의 upstream 변화가 감지됐습니다.',
              '',
              '```text',
              details.trim(),
              '```',
              '',
              '- `./gradlew verifyEventstreamFork bootJarShadowingTest`를 실행합니다.',
              '- 새 원본과 로컬 `MessageDecoder`의 디코딩 로직을 대조합니다.',
              '- 공식 buffer-size 설정 또는 lazy allocation 경로가 생겼으면 섀도잉을 제거합니다.',
              '- 유지할 경우 버전·원본 SHA-256·AWS 제출 이슈를 갱신합니다.'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Fail after reporting
        if: steps.upstream.outcome == 'failure'
        run: exit 1
