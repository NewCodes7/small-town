name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      db_pool_size:
        description: 'HikariCP maximum-pool-size 실험값 (비우면 운영 .env 기존값 사용, load-test/results 참고)'
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip tests]')"

    services:
      postgres:
        image: paradedb/paradedb:latest
        env:
          POSTGRES_USER: newcodes
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew test --no-daemon -x jacocoTestReport
        env:
          POSTGRES_HOST: localhost
          TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build bootJar
        run: ./gradlew bootJar --no-daemon

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to server via SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # workflow_dispatch로 db_pool_size를 넘기면 이번 배포 1회에 한해 운영 .env를 덮어쓰지 않고
          # docker compose 프로세스 환경변수로만 주입(셸 env가 .env보다 우선순위 높음) — 풀 크기 실험용.
          # push 트리거(코드 변경으로 인한 일반 배포)는 빈 문자열이라 기존 .env 값(=5) 그대로 사용.
          DB_POOL_SIZE_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.db_pool_size || '' }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          POOL_ENV_PREFIX=""
          if [ -n "$DB_POOL_SIZE_OVERRIDE" ]; then
            POOL_ENV_PREFIX="DB_POOL_SIZE=$DB_POOL_SIZE_OVERRIDE "
          fi
          ssh -i /tmp/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=60 \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "cd ~/small-town && sudo git restore nginx/default.conf && git pull origin main && ${POOL_ENV_PREFIX}./deploy.sh deploy"
          rm -f /tmp/deploy_key
