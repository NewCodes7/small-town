version: 2
updates:
  # Gradle 의존성 (Selenium 등) — 매주 업데이트 PR 생성
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"

  # GitHub Actions 워크플로 (deploy.yml 등) 액션 버전도 함께 관리
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
