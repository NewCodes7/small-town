services:
  # # 1. 메인 개발 환경 서비스 (예: small-town-backend)
  app:
    build:
      context: . # 프로젝트 루트를 빌드 컨텍스트로 사용
      dockerfile: Dockerfile # Codespaces의 Dockerfile 경로
    volumes:
      - ..:/workspaces/small-town # 프로젝트 폴더 마운트
    ports:
      - "8080:8080" # 애플리케이션이 사용하는 포트
    depends_on:
      mysql:
        condition: service_healthy # MySQL이 준비될 때까지 기다림
      postgres:
        condition: service_healthy # PostgreSQL이 준비될 때까지 기다림
    command: sleep infinity # 컨테이너가 계속 실행되도록 유지 (필요 시)
    env_file:
      - ../.env # .env 파일에서 환경변수 로드
    environment:
      # Database Configuration
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET}

      # AWS Configuration
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN}
      S3_UPLOAD_ENABLED: ${S3_UPLOAD_ENABLED}

      # Spring Configuration
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

      # OpenAI Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_ORG_ID: ${OPENAI_ORG_ID}
      OPENAI_MY_PROJECT_ID: ${OPENAI_MY_PROJECT_ID}
      OPENAI_WEBHOOK_SECRET: ${OPENAI_WEBHOOK_SECRET}

      # DeepL API Configuration
      DEEPL_API_KEY: ${DEEPL_API_KEY}

      # YouTube API Configuration
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}

  # 2. MySQL 서비스
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_DATABASE: small_town
      MYSQL_USER: newcodes
      MYSQL_PASSWORD: dev
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdev"]
      timeout: 5s
      retries: 5
      start_period: 30s

  # 3. PostgreSQL 서비스
  postgres:
    image: paradedb/paradedb:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_USER: newcodes
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: small_town
    volumes:
      - ./postgres_backup_data:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newcodes -d small_town"]
      timeout: 5s
      retries: 5
      start_period: 30s # PostgreSQL이 시작될 때까지 기다리는 시간

volumes:
  mysql_data:
  postgres_data: