app.base-url=https://newcodes.net
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:5432/small_town_test
spring.datasource.username=newcodes
spring.datasource.password=${TEST_DB_PASSWORD:test_db_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.test.context.initializer.classes=com.newcodes7.small_town.config.TestDatabaseInitializer
spring.test.database.replace=none
spring.datasource.admin-db=postgres
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.cache.type=none
spring.quartz.auto-startup=false

# 테스트 로그 노이즈/성능 최적화
logging.level.root=INFO
logging.level.com.newcodes7.small_town=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF

# AWS S3 개발환경 설정
cloud.aws.credentials.access-key=
cloud.aws.credentials.secret-key=
cloud.aws.region.static=
cloud.aws.stack.auto=false
s3.bucket.name=
cloudfront.domain=
s3.upload.enabled=false

# robots.txt 요청 비활성화 (테스트 환경)
crawler.robots.enabled=false

# JWT 설정
app.jwt.secret=test-jwt-secret-for-testing-only-not-for-production-use
app.jwt.access-token-expiration=86400000
app.jwt.refresh-token-expiration=604800000

# OAuth2 테스트 더미 설정 (SecurityConfig 빈 초기화용)
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.github.client-id=test-github-client-id
spring.security.oauth2.client.registration.github.client-secret=test-github-client-secret
spring.security.oauth2.client.registration.github.scope=user:email

# openai 관련 설정 
openai.api-key=
openai.org-id=
openai.project-id=
openai.webhook-secret=

# DeepL API 설정
deepl.api-key=
google.translate.api-key=

# Voyage AI API 설정
voyage.api-key=

# Embedding API 설정
embedding.api-key=
clova.api-key=${embedding.api-key}

# YouTube Data API 설정
youtube.api.key=
youtube.api.max-results=50
youtube.api.application-name=small-town

# Term 추출 설정
term.extraction.max-terms=10
term.extraction.min-frequency=2

# Content 및 Term 추출 스케줄링 설정
content.extraction.scheduled.enabled=false
content.extraction.schedule.cron=0 30 * * * ?

# 블로그 크롤링: 매일 새벽 4시 (AI 분석은 크롤링 시 자동 실행)
crawler.schedule.blog.cron=0 0 4 * * ?
# YouTube 크롤링: 매일 새벽 4시 30분 (AI 분석은 크롤링 시 자동 실행)
crawler.schedule.youtube.cron=0 30 4 * * ?

# 트레이싱: 테스트에서는 span 생성/export 하지 않음 (sampling 0이면 exporter가 전송 시도 안 함)
management.tracing.sampling.probability=0.0
# application-test.properties는 테스트 컨텍스트에서 application.properties(공통)를 사실상 상속하지 않으므로 명시적으로 중복 선언
# (spring.config.import가 있는 application.properties는 테스트 부트스트랩 시 spring.profiles.active 외 프로퍼티가 반영되지 않음 — 실측 확인됨)
management.otlp.metrics.export.enabled=false
