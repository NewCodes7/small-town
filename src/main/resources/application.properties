# Import .env file
spring.config.import=optional:file:.env[.properties]

# ==== 공통 설정 ====
spring.application.name=small-town

# 프로파일은 환경변수로 설정 (기본값: dev)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# 시간대 설정 (한국 시간)
spring.jackson.time-zone=Asia/Seoul
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# Spring Security 공통 설정
spring.main.allow-bean-definition-overriding=true

# 에러 페이지 공통 설정
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration

# AWS S3 and CloudFront 설정 (개발 환경에서는 비활성화)
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY:dummy}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY:dummy}
cloud.aws.region.static=${AWS_REGION:ap-northeast-2}
cloud.aws.stack.auto=false
s3.bucket.name=small-town-newcodes
cloudfront.domain=https://d2hvvzc0qmpllo.cloudfront.net

# openai 관련 설정
openai.api-key=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
openai.org-id=${OPENAI_ORG_ID}
openai.project-id=${OPENAI_MY_PROJECT_ID}
openai.webhook-secret=${OPENAI_WEBHOOK_SECRET}

# DeepL API 설정
deepl.api-key=${DEEPL_API_KEY:}

# Voyage AI API 설정
voyage.api-key=pa-hbUq7tfrZ0mu6_txGfumDDRDporFLrajiu4px5fCIL3

# Naver Clova Embedding API 설정
clova.api-key=nv-8180894513bf4f829f1a2e4d4883a210Pr6F

# YouTube Data API 설정
youtube.api.key=${YOUTUBE_API_KEY}
youtube.api.max-results=50
youtube.api.application-name=small-town

# Google Analytics Data API 설정
google.analytics.property-id=${GA_PROPERTY_ID}
google.analytics.credentials-path=${GA_CREDENTIALS_PATH}
# GA 조회수 동기화 스케줄 (매일 새벽 3시)
crawler.schedule.ga-sync.cron=0 0 3 * * ?

# Term 추출 설정
# 검색을 위해 Article당 저장할 최대 Term 개수
term.extraction.max-terms=10
# Term으로 저장할 최소 빈도수 (2회 이상 등장한 단어만 저장)
term.extraction.min-frequency=2

# Content 및 Term 추출 스케줄링 설정
# 스케줄 활성화 여부
content.extraction.scheduled.enabled=true
# 스케줄 실행 시간 (매시간 30분, 예: 00:30, 01:30, 02:30, ...)
content.extraction.schedule.cron=0 30 * * * ?

# http connection 시간 더 늘리기
server.tomcat.keep-alive-timeout=60000