# Import .env file
spring.config.import=optional:file:.env[.properties]

# ==== 공통 설정 ====
spring.application.name=small-town

# spring-boot-starter-opentelemetry가 트레이싱과 별개로 OTLP 메트릭 push도 기본 활성화함.
# 수신자를 둔 적이 없어 localhost:4318로 계속 실패만 함 (메트릭은 Prometheus 스크레이핑 사용) — 명시적으로 끔
management.otlp.metrics.export.enabled=false

# ==== Flyway 마이그레이션 ====
spring.flyway.locations=classpath:db/migration
# 기존 DB에 flyway_schema_history가 없을 때 baseline 자동 생성
# (V1_1~V1_19는 수동 적용 완료 상태이므로 1.19 이후부터만 실행)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1.19
app.base-url=https://newcodes.net

# 프로파일은 환경변수로 설정 (기본값: dev)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# 시간대 설정 (한국 시간)
spring.jackson.time-zone=Asia/Seoul
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# OSIV는 Boot 기본 등록(전 경로)을 끄고 WebMvcConfig에서 뷰 경로에만 직접 등록한다.
# OSIV가 켜져 있으면 트랜잭션이 닫혀도 요청이 끝날 때까지 커넥션이 반납되지 않아
# (실측: 트랜잭션 사이 대기 구간에도 활성 커넥션 1), 검색 API가 요청당 커넥션을 430ms 잡는데
# 그중 실제 SQL은 193ms뿐이었다 — 풀(5)이 DB가 아니라 유휴 점유로 포화됐다.
# 근거: load-test/results/2026-08-16-search-db-cost-3commits-ab.md 4장
spring.jpa.open-in-view=false

# Spring Security 공통 설정
spring.main.allow-bean-definition-overriding=true

# 에러 페이지 공통 설정
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always
server.error.path=/error

# AWS S3 and CloudFront 설정 (개발 환경에서는 비활성화)
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY:dummy}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY:dummy}
cloud.aws.region.static=${AWS_REGION:ap-northeast-2}
cloud.aws.stack.auto=false
s3.bucket.name=${S3_BUCKET_NAME}
cloudfront.domain=${CLOUDFRONT_DOMAIN}

# openai 관련 설정
openai.api-key=${OPENAI_API_KEY}
openai.org-id=${OPENAI_ORG_ID}
openai.project-id=${OPENAI_MY_PROJECT_ID}
openai.webhook-secret=${OPENAI_WEBHOOK_SECRET}

# DeepL API 설정
deepl.api-key=${DEEPL_API_KEY:}

# Gmail SMTP 설정 (피드백 알림 메일 발송용)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 새 피드백 접수 알림을 받을 관리자 이메일
feedback.notification.email=${FEEDBACK_NOTIFICATION_EMAIL:}

# 메일은 피드백 알림용 부가 기능일 뿐이므로 SMTP 연결 상태가 전체 health(actuator)를
# DOWN으로 끌어내리지 않도록 제외 (Docker healthcheck / blue-green 배포 게이팅에 영향 주지 않게)
management.health.mail.enabled=false

# Naver Clova Embedding API 설정
clova.api-key=nv-${CLOVA_API_KEY}

# YouTube Data API 설정
youtube.api.key=${YOUTUBE_API_KEY}
youtube.api.max-results=50
youtube.api.application-name=small-town

# Term 추출 설정
# 검색을 위해 Article당 저장할 최대 Term 개수
term.extraction.max-terms=10
# Term으로 저장할 최소 빈도수 (2회 이상 등장한 단어만 저장)
term.extraction.min-frequency=2

# Content 및 Term 추출 스케줄링 설정
# 스케줄 활성화 여부
content.extraction.scheduled.enabled=true
# 스케줄 실행 시간 (매시간 30분, 예: 00:30, 01:30, 02:30, ...)
content.extraction.schedule.cron=0 30 * * * ?

# http connection 시간 더 늘리기
server.tomcat.keep-alive-timeout=60000

# Virtual Threads (JDK 26) - Tomcat 요청 처리, @Async, @Scheduled에 가상 스레드 사용
spring.threads.virtual.enabled=true

# Gemini API 설정
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.1-flash-lite
gemini.summary.model=gemini-3.5-flash

# AWS Bedrock 설정 (admin RAG 테스트용 LLM)
bedrock.region=${BEDROCK_REGION:ap-northeast-2}
bedrock.access-key=${AWS_ACCESS_KEY:dummy}
bedrock.secret-key=${AWS_SECRET_KEY:dummy}
# ConverseStream(RAG 답변 생성) async 클라이언트의 동시 요청 상한. 기본 50 — 올리지 말 것.
# 2026-08-27에 300(=tomcat max-connections)으로 올려 재측정했다가 VU90부터 붕괴,
# 백엔드가 12분간 세 번 OOM 재기동했다(힙 506/512MB). DB CPU는 오히려 떨어졌다(congestion collapse).
# SDK 기본값 50이 우연히 벌크헤드였던 것이고, 진짜 다음 한계는 DB가 아니라 JVM 힙 512MB다.
# 선행조건 두 가지는 이후 충족됐다: (1) 스트림당 힙 3.60 -> 1.87MB (eventstream 버퍼 축소, 10장)로
# OOM 임계가 동시 90 -> 약 180이 됐고, (2) RagConcurrencyLimiter(상한 45, 초과 시 429)가 생겼다(11장).
# 그래도 이 값은 여전히 50이다 — 올리는 것 자체가 새 사다리를 요구하고, 무엇보다 리미터 상한(45)이
# 이 값보다 낮아야 초과분이 "조용한 풀 대기"가 아니라 429로 나간다. 올릴 거면 리미터 상한을 함께 올릴 것.
# 근거: load-test/results/2026-08-27-rag-ladder.md 3.3 · 5 · 10 · 11장
#
# 2026-09-03에 250으로 잠시 올렸다가 원복했다(현재 값은 아래대로 50이다). 그때 확인된 것:
# 리미터를 200으로 함께 올리면 처리량이 2.01 → 8.04 RPS(4배)까지 선형으로 늘고,
# TTFT는 p50 +5% · p95 +9%였다(단 p99는 +57%).
# 즉 이 값 50과 리미터 45는 "안전한 운영점"이지 하드웨어 한계가 아니다. 올리려면 넷을 같이 봐야 한다:
# 힙(동시 약 246), DB CPU(10.3 RPS ≈ 동시 216), 호스트 메모리, 그리고 p99 SLA(동시 180에서 이미 초과).
# 가상 스레드는 동시 180을 스레드 65개로 처리했다(플랫폼 스레드였다면 약 400개).
# 근거: load-test/results/2026-08-29-rag-virtual-thread-ab.md 9장
#
# ⚠️⚠️ 임시 변경 (상한 재산정 사다리, 2026-09-05): 50 → 250. **측정 후 아래 줄로 되돌릴 것.**
#   bedrock.async-max-concurrency=${BEDROCK_ASYNC_MAX_CONCURRENCY:50}
# 위 문단이 요구하는 "리미터 상한을 함께 올릴 것"은 충족한다 — 측정 중에는 RagConcurrencyLimiter를
# admin에서 200으로 올려 둔다(DB, 재배포 불필요). 둘 다 원복 대상이다.
#
# 왜 또 여는가: 상한 45의 근거가 순환이었다. "실측 무릎 VU45"를 잰 사다리(rag-ladder 런 2)는
# 리미터가 없던 상태에서 돌았고 동시성을 막던 건 이 값 50뿐이었다 — 스트림 21.4초·풀 50에서
# VU70이면 20건이 대기하므로 예상 추가 대기 21.4×20/50 ≈ 8.6초인데 실측 TTFT p95 증가가 8.1초로
# 거의 일치한다. 즉 45는 우리가 정한 값이 아니라 AWS SDK 기본값 50의 그림자였다.
# 이번 사다리는 이 값을 비구속(250)으로 두고 VU만 움직여 무릎을 이 값에서 분리해 귀속시킨다.
# 근거: load-test/results/2026-08-29-rag-virtual-thread-ab.md 13장
#
# ⚠️ 측정 후 최종 구성은 "상한 L / 이 값 L+30"이다. 이 값이 리미터 상한보다 커야 초과분이
# 429로 나가고 SDK 풀 앞의 조용한 대기로 새지 않는다 — 되돌릴 때 50으로 두면 상한 90과 뒤집힌다.
bedrock.async-max-concurrency=250

# OpenAI 호환 모델 Bedrock 경유 설정 (bedrock-mantle의 OpenAI 호환 Responses 엔드포인트)
# GPT-5.5/5.4·Gemma 4·Grok 4.3은 미국 리전에만 있음 (us-east-1/2 공통 → us-east-2 사용, 서울 bedrock.region과 무관)
# 키는 Bedrock long-term API key (콘솔 > API keys에서 발급). OpenAI 직접 호출로 되돌리려면
# base-url=https://api.openai.com/v1, api-key=${OPENAI_API_KEY:} 로 변경
rag.openai.base-url=https://bedrock-mantle.us-east-2.api.aws/openai/v1
rag.openai.api-key=${BEDROCK_API_KEY:}

# admin RAG 테스트 모델 목록 (0번이 기본값)
# Bedrock 모델 ID는 리전 종속 — 서울(ap-northeast-2)은 In-Region/Geo 미지원, global. 프로파일만 사용 가능
# (Claude 4.5 계열은 apac. 프로파일이 존재하지 않음 — us./eu./jp./au./global. 뿐)
# 확인: aws bedrock list-inference-profiles --region ap-northeast-2
# temperature-supported=false: Claude Opus 4.7+/5세대는 샘플링 파라미터 전달 시 ValidationException
# region: global. 프로파일이 없는 모델의 소스 리전 지정 (BedrockClientFactory가 해당 리전 클라이언트 생성)
# Gemini는 Bedrock 미제공 (Google은 Bedrock에 Gemma 오픈 모델만 올림) → 기본값은 직접 API 유지, Gemma 4로 대체 제공
rag.models[0].id=gemini-3.5-flash
rag.models[0].label=Gemini 3.5 Flash
rag.models[0].provider=GEMINI
rag.models[1].id=global.anthropic.claude-sonnet-5
rag.models[1].label=Claude Sonnet 5 (Bedrock)
rag.models[1].provider=BEDROCK
rag.models[1].temperature-supported=false
rag.models[2].id=global.anthropic.claude-opus-4-8
rag.models[2].label=Claude Opus 4.8 (Bedrock)
rag.models[2].provider=BEDROCK
rag.models[2].temperature-supported=false
# Fable 5는 계정에서 데이터 보존 모드 provider_data_share 옵트인 필요 (Data Retention API, 콘솔 UI 없음)
rag.models[3].id=global.anthropic.claude-fable-5
rag.models[3].label=Claude Fable 5 (Bedrock)
rag.models[3].provider=BEDROCK
rag.models[3].temperature-supported=false
rag.models[4].id=global.anthropic.claude-sonnet-4-5-20250929-v1:0
rag.models[4].label=Claude Sonnet 4.5 (Bedrock)
rag.models[4].provider=BEDROCK
rag.models[5].id=global.anthropic.claude-haiku-4-5-20251001-v1:0
rag.models[5].label=Claude Haiku 4.5 (Bedrock)
rag.models[5].provider=BEDROCK
rag.models[6].id=global.amazon.nova-2-lite-v1:0
rag.models[6].label=Amazon Nova 2 Lite (Bedrock)
rag.models[6].provider=BEDROCK
rag.models[7].id=apac.amazon.nova-pro-v1:0
rag.models[7].label=Amazon Nova Pro (Bedrock)
rag.models[7].provider=BEDROCK
rag.models[8].id=apac.amazon.nova-lite-v1:0
rag.models[8].label=Amazon Nova Lite (Bedrock)
rag.models[8].provider=BEDROCK
# OpenAI 프론티어 모델 — Bedrock 경유 (rag.openai.* 설정 사용, GPT-5 계열은 원래 temperature 미지원)
rag.models[9].id=openai.gpt-5.5
rag.models[9].label=GPT-5.5 (OpenAI on Bedrock)
rag.models[9].provider=OPENAI
rag.models[10].id=openai.gpt-5.4
rag.models[10].label=GPT-5.4 (OpenAI on Bedrock)
rag.models[10].provider=OPENAI
# Gemma·Grok도 bedrock-mantle OpenAI 호환 엔드포인트 사용 (provider=OPENAI, rag.openai.* 설정 공유)
rag.models[11].id=google.gemma-4-31b
rag.models[11].label=Gemma 4 31B (Google on Bedrock)
rag.models[11].provider=OPENAI
rag.models[12].id=xai.grok-4.3
rag.models[12].label=Grok 4.3 (xAI on Bedrock)
rag.models[12].provider=OPENAI
# Llama 4는 global./apac. 프로파일이 없어 US geo 프로파일 사용 — 소스 리전을 us-east-1로 지정
rag.models[13].id=us.meta.llama4-maverick-17b-instruct-v1:0
rag.models[13].label=Llama 4 Maverick (Meta on Bedrock)
rag.models[13].provider=BEDROCK
rag.models[13].region=us-east-1
# Mistral Large 3·DeepSeek V3.2는 In-Region 전용 — 가장 가까운 도쿄(ap-northeast-1)에서 호출
rag.models[14].id=mistral.mistral-large-3-675b-instruct
rag.models[14].label=Mistral Large 3 (Bedrock)
rag.models[14].provider=BEDROCK
rag.models[14].region=ap-northeast-1
rag.models[15].id=deepseek.v3.2
rag.models[15].label=DeepSeek V3.2 (Bedrock)
rag.models[15].provider=BEDROCK
rag.models[15].region=ap-northeast-1
# 부하테스트 mock 모델 — endpoint 설정 시 BedrockClientFactory가 endpointOverride(HTTP/1.1)로 호출.
# hidden=true라 admin 드롭다운에 노출 안 됨. /api/rag/answer/loadtest 전용 (load-test/README.md 참고)
rag.models[16].id=mock.anthropic.claude-sonnet-4-5
rag.models[16].label=Mock Sonnet (loadtest)
rag.models[16].provider=BEDROCK
rag.models[16].endpoint=${RAG_LOADTEST_BEDROCK_ENDPOINT:}
rag.models[16].hidden=true
rag.models[17].id=mock.anthropic.claude-haiku-4-5
rag.models[17].label=Mock Haiku (loadtest)
rag.models[17].provider=BEDROCK
rag.models[17].endpoint=${RAG_LOADTEST_BEDROCK_ENDPOINT:}
rag.models[17].hidden=true

# 공개 챗봇(/api/rag/answer) 전처리 전용 모델 — 전처리는 temperature 0.0 JSON 추출이라 경량 모델로 충분.
# 답변 모델(Sonnet 4.5)과 분리해 첫 토큰 지연(TTFT)을 줄인다. rag.models에 등록된 ID여야 하며, 미설정/미등록 시 답변 모델로 fallback.
rag.chat.preprocess-model-id=global.anthropic.claude-haiku-4-5-20251001-v1:0

# RAG 부하테스트 엔드포인트(/api/rag/answer/loadtest) — 기본 비활성(404). 테스트 창에서만 env로 켠다.
# 활성 시 mock 모델로 LLM 경로를 대체하고 임베딩은 clova.loadtest-endpoint(mock)로 호출한다.
rag.chat.loadtest.enabled=${RAG_CHAT_LOADTEST_ENABLED:false}
rag.chat.loadtest.answer-model-id=mock.anthropic.claude-sonnet-4-5
rag.chat.loadtest.preprocess-model-id=mock.anthropic.claude-haiku-4-5

# 실사용자 경로(/api/rag/answer)의 시간당 rate limit(rag.chat.hourly-limit-per-ip, 기본 30) 부하테스트 예외 —
# nginx의 X-LoadTest-Token(nginx/loadtest_token.conf)과 같은 값이어야 함. 비어 있으면 예외 없음(기본).
rag.chat.loadtest-bypass-token=${RAG_CHAT_LOADTEST_BYPASS_TOKEN:}

# 부하테스트용 Clova 임베딩 mock 엔드포인트 — loadtest 요청만 이 URL로 임베딩 호출 (blank면 loadtest 요청 즉시 실패)
clova.loadtest-endpoint=${CLOVA_LOADTEST_ENDPOINT:}

# 하이브리드 검색 부하테스트 엔드포인트(/api/search/articles/loadtest).
# 활성 시 쿼리 임베딩을 clova.loadtest-endpoint(mock)로 호출하고 search_query_embedding/search_log에
# 쓰지 않는다 — 매 요청 고유 키워드로 하이브리드 코어 캐시 미스 경로를 측정하기 위한 전용 경로
# (load-test/README.md "검색 캐시 미스 모드" 참고).
# 여기 기본값은 false(compose 밖에서 앱을 직접 띄우는 경우 안전하게) — 운영 컨테이너는
# docker-compose.yml이 SEARCH_LOADTEST_ENABLED 기본값을 true로 주입한다(실질 게이트는 nginx 토큰).
search.loadtest.enabled=${SEARCH_LOADTEST_ENABLED:false}

# 부하테스트 경로 전용 벡터 유사도 임계값 (실사용자 경로는 코드 상수 0.52 그대로).
# mock 임베딩은 의사난수 벡터라 0.52로는 항상 0건이 나와 cross-scoring BM25 보충 분기가
# 실행되지 않는다 — 0.0으로 필터를 해제해 결과 개수를 실제와 비슷한 모양으로 맞춘다.
# 자세한 근거는 VectorSearchService.loadTestVectorThreshold 주석 참고.
search.loadtest.vector-threshold=${SEARCH_LOADTEST_VECTOR_THRESHOLD:0.0}

# 부하테스트 경로 벡터 결과 수 상한 (실사용자 경로는 코드 상수 100 그대로).
# 임계값 0.0이면 벡터가 항상 100건을 채우는데 운영은 임계값 0.52로 걸러져 중앙값 28건이다
# — 그대로 두면 cross-scoring BM25 보충 대상과 NSF 합집합이 실제보다 크게 부풀어 테스트가
# 필요 이상으로 무거워진다. 30은 운영 실측 중앙값 기준.
search.loadtest.max-vector-results=${SEARCH_LOADTEST_MAX_VECTOR_RESULTS:30}

# RAG 경로 부하테스트 전용 벡터 결과 수 상한. 검색용(30)과 분리한 이유는 임계값이 다르기 때문이다 —
# 검색 0.52 / RAG 0.6이라 운영 분포가 다르다. 30을 그대로 쓰면 벡터 팔이 운영보다 부풀어 오른다.
# 10은 운영 실측([RAG검색] 로그, mock=false)에서 왔으나 **표본 1건**이다.
# 트래픽이 쌓이면 같은 로그로 재보정할 것. 근거: VectorSearchService.ragLoadTestMaxVectorResults
rag.loadtest.max-vector-results=${RAG_LOADTEST_MAX_VECTOR_RESULTS:10}

# cross-scoring Vector 보충 시 2단계 검색의 Stage 1 후보 점수 재활용 (기본 true).
# 본검색이 threshold/limit로 버린 후보 점수를 그대로 쓰면 그만큼 computeSimilarityForArticleIds
# 왕복(검색 1건당 DB 예산의 33%)이 사라진다. false면 종전대로 전부 DB로 보충 —
# 같은 빌드에서 core-s/req A/B를 재기 위한 스위치다 (docs/operations/PGSS_SEARCH_COST.md 항목 A).
search.hybrid.reuse-stage1-candidates=${SEARCH_HYBRID_REUSE_STAGE1_CANDIDATES:true}

# cross-scoring 보충을 binary -> halfvec 2단계(퍼널)로 수행 (기본 true).
# 대상 아티클의 전 청크를 인라인 embedding_binary(128B)로 먼저 스코어링해 상위 N개 아티클만
# halfvec 정확 계산에 넣는다 — TOAST 간접 참조(현재 블록 접근의 64%)가 컷 크기에 비례해 줄어든다
# (docs/operations/PGSS_SEARCH_COST.md 항목 B').
# 항목 A와 달리 랭킹을 바꾸는데 하이브리드 정확도 측정 수단이 아직 없다 — 문서의
# "남은 검증 부채" 절 참고. 이상 징후는 [검색] 로그의 "보충통과" 수로 감시하고,
# 롤백은 이 값을 false로 두고 재배포하면 된다(코드 변경 없음).
# RAG 경로(getTopArticleIdsForRag)와 따옴표 검색에는 적용되지 않는다.
search.hybrid.cross-scoring-two-stage=${SEARCH_HYBRID_CROSS_SCORING_TWO_STAGE:true}

# Stage 2(halfvec 정확 계산)로 넘길 아티클 수 상한. 실제 비용을 결정하는 값이자 품질 리스크가
# 몰려 있는 값이다. Stage 1은 인라인이라 사실상 공짜지만 Stage 2는 여전히 TOAST를 읽는다.
search.hybrid.cross-scoring-stage2-limit=${SEARCH_HYBRID_CROSS_SCORING_STAGE2_LIMIT:20}

# Stage 1 추정 유사도 하한 = (임계값 - 이 여유). 이진 양자화 추정치의 분산(d=1024에서 sigma≈15비트)
# 때문에 임계값을 그대로 하한으로 쓰면 통과했을 아티클을 떨어뜨린다 — 참 유사도 0.52짜리 청크의
# 추정치가 3sigma에서 0.40까지 내려간다. 다만 무관한 문서쌍의 코사인도 0.3~0.4대라 이 하한으로
# 걸러지는 양은 적다: 비용을 줄이는 것은 위의 컷이고, 이 값은 Stage 2 폭주에 대한 안전망이다.
search.hybrid.cross-scoring-stage1-floor-margin=${SEARCH_HYBRID_CROSS_SCORING_STAGE1_FLOOR_MARGIN:0.25}

# 검색 추천 검색어 (콤마 구분)
search.recommended-queries=JPA N+1 문제 해결,Spring Security OAuth2,Redis 분산 캐시,쿠버네티스 무중단 배포,대용량 트래픽 처리,MSA 서비스 분리,Kafka 메시지 큐,코드 리뷰 문화

# Selenium CDP 버전 불일치 경고 숨김 (Chrome이 Selenium보다 앞서가며 반복 발생, 크롤러는 CDP 미사용)
logging.level.org.openqa.selenium.devtools.CdpVersionFinder=ERROR