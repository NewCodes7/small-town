spring.application.name=small-town
server.port=8080

# ==== DB 연결 설정 ====
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/small_town?socketTimeout=30&connectTimeout=10}
spring.datasource.username=${DB_USERNAME:newcodes}
spring.datasource.password=${DB_PASSWORD:test_db_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-init-sql=SET hnsw.ef_search=250

# JPA 설정
spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true

# Logging Levels
logging.level.root=INFO
logging.level.com.newcodes7.small_town=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Logging Patterns
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# 스케줄링 활성화
spring.task.scheduling.pool.size=5

# 크롤링 설정
crawler.enabled=true
# 블로그 크롤링: 매일 새벽 2시 (AI 분석은 크롤링 시 자동 실행)
crawler.schedule.blog.cron=0 0 2 * * ?
# YouTube 크롤링: 매일 새벽 2시 30분 (AI 분석은 크롤링 시 자동 실행)
crawler.schedule.youtube.cron=0 30 2 * * ?
crawler.timeout.seconds=30
crawler.retry.max-attempts=3
crawler.concurrent.max-threads=5

# 웹드라이버 설정
webdriver.chrome.headless=true
webdriver.chrome.window-size=1920,1080
webdriver.chrome.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
webdriver.chrome.timeout=30

# JWT 설정
app.jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-secret-for-local-dev-env-minimum-32chars}
app.jwt.access-token-expiration=86400000
app.jwt.refresh-token-expiration=604800000

# Spring Security 설정
spring.main.allow-bean-definition-overriding=true

# 에러 페이지 설정
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on-param
server.error.include-exception=false
# spring.mvc.throw-exception-if-no-handler-found=true

# AWS S3 개발환경 설정 (실제 자격증명 필요)
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY:dev-placeholder}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY:dev-placeholder}
cloud.aws.region.static=${AWS_REGION:ap-northeast-2}
cloud.aws.stack.auto=false
s3.bucket.name=${S3_BUCKET_NAME:dev-bucket}
cloudfront.domain=${CLOUDFRONT_DOMAIN:localhost}

# S3 업로드 기능 활성화/비활성화
s3.upload.enabled=${S3_UPLOAD_ENABLED:false}

# 모든 actuator 엔드포인트 노출
management.endpoints.web.exposure.include=*
management.metrics.enable.all=true

# health 엔드포인트 상세정보 표시
management.endpoint.health.show-details=always

# ==== 개발환경 정적 리소스 캐싱 비활성화 ====
# 정적 리소스 캐싱 완전 비활성화 (개발환경)
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.cache.period=0

# 브라우저 캐싱 방지를 위한 추가 설정
spring.web.resources.chain.cache=false
spring.web.resources.chain.compressed=false
spring.web.resources.chain.html-application-cache=false

# Thymeleaf 템플릿 캐싱 비활성화 (개발환경)
spring.thymeleaf.cache=false

# DevTools 설정 (개발환경)
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# OAuth2 설정 
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:dev-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:dev-github-client-secret}
spring.security.oauth2.client.registration.github.scope=user:email
spring.security.oauth2.client.registration.github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:8080/login/oauth2/code/github}

# SQL 출력
logging.level.org.hibernate.SQL=WARN

# 바인딩 파라미터 값 출력 (중요)
logging.level.org.hibernate.orm.jdbc.bind=WARN

# SQL 보기 좋게
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# 어떤 메서드에서 실행됐는지 주석 표시
spring.jpa.properties.hibernate.use_sql_comments=true

# 번역 API 설정
deepl.api-key=${DEEPL_API_KEY:}
google.translate.api-key=${GOOGLE_TRANSLATE_API_KEY:}

gemini.api-key=${GEMINI_API_KEY:}

# ==== 외부 API 개발환경 기본값 (실제 키가 없으면 해당 기능 비활성화됨) ====
openai.api-key=${OPENAI_API_KEY:dev-placeholder}
openai.org-id=${OPENAI_ORG_ID:dev-placeholder}
openai.project-id=${OPENAI_MY_PROJECT_ID:dev-placeholder}
openai.webhook-secret=${OPENAI_WEBHOOK_SECRET:dev-placeholder}
clova.api-key=nv-${CLOVA_API_KEY:dev-placeholder}
youtube.api.key=${YOUTUBE_API_KEY:dev-placeholder}