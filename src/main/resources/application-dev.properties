spring.application.name=small-town
server.port=8080

# ==== DB 연결 설정 ====
spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/small_town?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:newcodes}
spring.datasource.password=${DB_PASSWORD:@a09060328}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Thymeleaf 설정
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# 정적 리소스 설정
spring.web.resources.static-locations=classpath:/static/

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true

# Logging Levels
logging.level.root=INFO
logging.level.com.newcodes7.small_town=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Logging Patterns
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# 스케줄링 활성화
spring.task.scheduling.pool.size=5

# 크롤링 설정
crawler.enabled=true
crawler.schedule.cron=0 0 2 * * ?
crawler.timeout.seconds=30
crawler.retry.max-attempts=3
crawler.concurrent.max-threads=5

# 웹드라이버 설정
webdriver.chrome.headless=true
webdriver.chrome.window-size=1920,1080
webdriver.chrome.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
webdriver.chrome.timeout=30

# JWT 설정
app.jwt.secret=${JWT_SECRET:smalltown-jwt-secret-key-for-authentication-and-authorization-system-2025}
app.jwt.access-token-expiration=86400000
app.jwt.refresh-token-expiration=604800000

# Spring Security 설정
spring.main.allow-bean-definition-overriding=true

# 에러 페이지 설정
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on-param
server.error.include-exception=false
# spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# AWS S3 개발환경 설정 (실제 자격증명 필요)
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY:}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY:}
cloud.aws.region.static=${AWS_REGION:ap-northeast-2}
cloud.aws.stack.auto=false
s3.bucket.name=${S3_BUCKET_NAME:small-town-final}
cloudfront.domain=${CLOUDFRONT_DOMAIN:https://d3nauzilae1nt8.cloudfront.net}

# S3 업로드 기능 활성화/비활성화
s3.upload.enabled=${S3_UPLOAD_ENABLED:true}

