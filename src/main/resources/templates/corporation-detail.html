<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="${corporation.name + ' 기술 블로그'}">기술 블로그</title>
    <th:block layout:fragment="meta" th:remove="tag">
        <meta name="description" th:content="${corporation.name} + '의 최신 기술 블로그 소식을 NewCodes에서 확인하세요. 다양한 아티클과 정보를 제공합니다.'">
        <meta name="keywords" th:content="${corporation.name} + ', 기술 블로그, 채용, IT, 개발자, NewCodes'">
        <meta name="robots" content="index, follow">
    </th:block>
    <!-- OG 태그 -->
    <meta property="og:type" content="website">
    <meta property="og:title" th:content="${corporation.name} + ' 기술 블로그 | NewCodes'">
    <meta property="og:description" th:content="${corporation.name} + '의 최신 기술 블로그 아티클을 NewCodes에서 만나보세요.'">
    <meta th:if="${corporation.logoS3Url != null}" property="og:image" th:content="${corporation.logoS3Url}">
    <!-- 구조화 데이터 (JSON-LD) -->
    <script type="application/ld+json" th:inline="javascript">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": /*[[${corporation.name}]]*/ "",
      "url": /*[[${corporation.homeLink}]]*/ "",
      "sameAs": /*[[${corporation.blogLink}]]*/ ""
    }
    </script>
    <script type="application/ld+json" th:inline="javascript">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": /*[[${corporation.name + ' 기술 블로그'}]]*/ "",
      "description": /*[[${corporation.name + '의 최신 기술 블로그 아티클 모음'}]]*/ "",
      "url": /*[[${canonicalUrl}]]*/ "",
      "isPartOf": {
        "@type": "WebSite",
        "name": "NewCodes",
        "url": "https://newcodes.net"
      }
    }
    </script>
    <link rel="stylesheet" type="text/css" th:href="@{/css/corporation-detail.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/home.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/default-thumbnail.css}">
</head>
<body>
    <div layout:fragment="content">
        <!-- 회사 정보 섹션 -->
        <div class="card mb-5" style="border-radius: 20px; background: var(--white); border: 2px solid var(--border-light);">
            <div class="card-body p-5">
                <div class="row align-items-center">
                    <!-- 회사 로고 -->
                    <div class="col-md-2 text-center mb-3 mb-md-0">
                        <img th:if="${corporation.logoS3Url != null}"
                             th:src="${corporation.logoS3Url}" 
                             th:alt="${corporation.name}"
                             class="img-fluid" style="max-width: 80px; border-radius: 12px;">
                        <div th:unless="${corporation.logoS3Url != null}" 
                             class="d-flex align-items-center justify-content-center"
                             style="width: 80px; height: 80px; background: var(--secondary-green); border-radius: 12px;">
                            <i class="fas fa-building fa-2x" style="color: var(--primary-green);"></i>
                        </div>
                    </div>
                    
                    <!-- 회사 정보 -->
                    <div class="col-md-10">
                        <div class="row">
                            <div class="col-lg-8">
                                <h1 class="mb-3" style="color: var(--text-dark); font-weight: 700;" th:text="${corporation.name}">회사명</h1>
                                
                                <div class="d-flex flex-wrap gap-3 mb-3" style="margin-bottom:10px;">
                                    <span class="badge" 
                                          th:class="${corporation.isDomestic} ? 'badge bg-success' : 'badge bg-info'"
                                          th:text="${corporation.regionText}">지역</span>
                                </div>
                                
                                <div class="d-flex flex-wrap gap-3">
                                    <a th:if="${corporation.homeLink != null && !#strings.isEmpty(corporation.homeLink)}"
                                       th:href="${corporation.homeLink}"
                                       target="_blank"
                                       class="btn btn-outline-primary btn-sm">
                                        <i class="fas fa-home me-1"></i>홈페이지
                                    </a>
                                    <a th:if="${corporation.blogLink != null && !#strings.isEmpty(corporation.blogLink)}"
                                       th:href="${corporation.blogLink}"
                                       target="_blank"
                                       class="btn btn-outline-secondary btn-sm">
                                        <i class="fas fa-blog me-1"></i>기술 블로그
                                    </a>
                                    <a th:if="${corporation.youtubeUrl != null && !#strings.isEmpty(corporation.youtubeUrl)}"
                                       th:href="${corporation.youtubeUrl}"
                                       target="_blank"
                                       class="btn btn-outline-danger btn-sm">
                                        <i class="fab fa-youtube me-1"></i>YouTube
                                    </a>
                                    <a th:if="${corporation.crewLink != null && !#strings.isEmpty(corporation.crewLink)}"
                                       th:href="${corporation.crewLink}"
                                       target="_blank"
                                       class="btn btn-outline-info btn-sm">
                                        <i class="fas fa-users me-1"></i>채용정보
                                    </a>
                                </div>
                            </div>
                            
                            <!-- 통계 정보 -->
                            <div class="col-lg-4">
                                <div class="stats-card text-center" style="background: var(--secondary-green); border-radius: 15px; padding: 1.5rem;">
                                    <div class="stats-number" style="color: var(--primary-green-dark); font-size: 2rem; font-weight: 700;" th:text="${corporation.articleCount}">0</div>
                                    <div class="stats-label" style="color: var(--primary-green-dark); font-weight: 600;">총 블로그 글 수</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 관리자 전용 크롤링 버튼 (JavaScript로 표시 여부 제어) -->
        <button id="adminCrawlBtn" class="btn btn-success d-none" th:attr="data-corporation-id=${corporation.id}">
            <i class="fas fa-sync-alt me-2"></i>크롤링 시작
        </button>

        <!-- Navigation Buttons -->
        <div class="mb-4 d-flex justify-content-center">
            <div class="content-toggle-container">
                <a th:href="@{/corporations/{id}(id=${corporation.id})}"
                   class="content-toggle-btn active">
                    <i class="fas fa-blog me-1"></i>블로그
                </a>
                <a th:if="${corporation.youtubeChannelId != null && !corporation.youtubeChannelId.isEmpty()}"
                   th:href="@{/corporations/{id}/video(id=${corporation.id})}"
                   class="content-toggle-btn">
                    <i class="fab fa-youtube me-1"></i>유튜브
                </a>
            </div>
        </div>

        <!-- 블로그 글 섹션 -->
        <div class="mb-5" th:if="${articles != null && !articles.content.isEmpty()}">
            <!-- 블로그 글 목록 헤더 -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 style="color: var(--text-dark); font-weight: 700;">
                    <i class="fas fa-blog me-2" style="color: var(--primary-green);"></i>
                    <span th:text="${corporation.name}">회사명</span>의 블로그 글
                </h3>
                <span class="text-muted" th:text="'총 ' + ${totalElements} + '개의 글'">총 0개의 글</span>
            </div>

            <!-- 블로그 글 목록 -->
            <div class="articles-container">
                <div class="article-card" th:each="article : ${articles.content}"
                     th:attr="data-article-id=${article.id}, data-detail-url=${article.detailUrl}"
                     onclick="window.location.href=this.getAttribute('data-detail-url')"
                     style="cursor: pointer;">
                    <!-- Article Content (Left Side) -->
                    <div class="article-content">
                        <!-- Admin Buttons (only shown via JavaScript for admin users) -->
                        <div class="admin-buttons-container d-none" onclick="event.stopPropagation()">
                            <button class="admin-delete-btn" title="글 삭제" th:attr="data-article-id=${article.id}">
                                <i class="fas fa-trash"></i>
                            </button>
                            <button class="admin-edit-btn" title="글 수정"
                                    th:attr="data-article-id=${article.id},data-published-at=${article.publishedAt},data-thumbnail=${article.thumbnailImage}">
                                <i class="fas fa-edit"></i>
                            </button>
                        </div>

                        <!-- Title -->
                        <h5 class="mb-3 lh-base" style="color: var(--text-dark); font-weight: 700; font-size: 1.15rem;">
                            <span class="title-link" th:text="${article.translatedTitle != null && !article.translatedTitle.isEmpty() ? article.translatedTitle : article.title}">Article Title</span>
                        </h5>

                        <!-- Stats -->
                        <div class="d-flex align-items-center mb-3 flex-wrap">
                            <div class="d-flex align-items-center gap-3">
                                <small class="text-muted relative-time"
                                       th:attr="data-date=${article.publishedAt}"
                                       th:title="${article.publishedAt}"
                                       th:text="${article.publishedAt}">2024-01-01</small>
                                <button class="like-button" th:attr="data-article-id=${article.id}, data-liked=${article.isLiked != null and article.isLiked}" onclick="event.stopPropagation()">
                                    <i class="fas fa-heart like-icon"></i>
                                </button>
                            </div>
                        </div>

                    </div>

                    <!-- Thumbnail Container (Right Side) -->
                    <div class="article-thumbnail-container">
                        <!-- 일반 썸네일 -->
                        <img th:if="${article.thumbnailImage != null && article.thumbnailImage.length() > 2}"
                             th:src="${article.thumbnailImage}"
                             th:alt="${article.title}"
                             class="article-thumbnail">
                        <!-- 기본 썸네일 -->
                        <div th:unless="${article.thumbnailImage != null && article.thumbnailImage.length() > 2}"
                             class="article-thumbnail default-thumbnail">
                            <div class="default-thumbnail-content">
                                <i class="fas fa-code"></i>
                                <div class="thumbnail-pattern"></div>
                            </div>
                        </div>
                        <!-- Reading Time Badge -->
                        <div class="position-absolute top-0 end-0 m-3" th:if="${article.readingTime != null}">
                            <span class="badge" style="background: rgba(255,255,255,0.9); color: var(--text-dark); font-weight: 600;">
                                <i class="fas fa-clock me-1"></i><span th:text="${article.readingTime}">5</span>분
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Blog Pagination -->
            <nav th:if="${totalPages > 0}" class="mt-4">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:class="${currentPage == 0} ? 'page-item disabled' : 'page-item'">
                        <a class="page-link"
                           th:href="@{/corporations/{corporationId}(corporationId=${corporation.id}, page=${currentPage - 1})}">
                            <i class="fas fa-chevron-left me-1"></i>이전
                        </a>
                    </li>
                    <th:block th:with="maxPagesToShow=5, halfRange=2,
                        startPage=${totalPages <= maxPagesToShow ? 0 : (currentPage <= halfRange ? 0 : (currentPage >= totalPages - halfRange - 1 ? totalPages - maxPagesToShow : currentPage - halfRange))},
                        endPage=${totalPages <= 1 ? 0 : (totalPages <= maxPagesToShow ? totalPages - 1 : (currentPage <= halfRange ? maxPagesToShow - 1 : (currentPage >= totalPages - halfRange - 1 ? totalPages - 1 : currentPage + halfRange)))}">
                        <li class="page-item" th:each="pageNum : ${#numbers.sequence(startPage, endPage)}"
                            th:class="${pageNum == currentPage} ? 'page-item active' : 'page-item'">
                            <a class="page-link"
                               th:href="@{/corporations/{corporationId}(corporationId=${corporation.id}, page=${pageNum})}"
                               th:text="${pageNum + 1}">1</a>
                        </li>
                    </th:block>
                    <li class="page-item" th:class="${currentPage >= totalPages - 1} ? 'page-item disabled' : 'page-item'">
                        <a class="page-link"
                           th:href="@{/corporations/{corporationId}(corporationId=${corporation.id}, page=${currentPage + 1})}">
                            다음<i class="fas fa-chevron-right ms-1"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <!-- Empty State -->
        <div th:if="${articles == null || articles.content.isEmpty()}" class="text-center py-5">
            <div class="hero-section">
                <i class="fas fa-blog fa-4x mb-4" style="color: var(--primary-green); opacity: 0.5;"></i>
                <h4 class="mb-3" style="color: var(--text-dark); font-weight: 700;">
                    아직 등록된 블로그 글이 없어요
                </h4>
                <p class="text-muted mb-4">
                    새로운 블로그 글이 곧 업데이트될 예정입니다.
                </p>
            </div>
        </div>
        
        <!-- 게시글 편집 모달 (관리자 전용) -->
        <div class="modal fade" id="editArticleModal" tabindex="-1" aria-labelledby="editArticleModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content" style="border-radius: 20px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
                    <div class="modal-header border-0 pb-0">
                        <h5 class="modal-title fw-bold" id="editArticleModalLabel" style="color: var(--primary-green);">
                            <i class="fas fa-edit me-2"></i>게시글 정보 수정
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body pt-3">
                        <div id="editMessage" class="alert d-none" role="alert"></div>

                        <form id="editArticleForm">
                            <input type="hidden" id="editArticleId">

                            <div class="mb-3">
                                <label for="editPublishedAt" class="form-label fw-bold">발행일</label>
                                <input type="datetime-local" class="form-control" id="editPublishedAt" required
                                       style="border-radius: 12px;">
                            </div>

                            <div class="mb-4">
                                <label for="editThumbnail" class="form-label fw-bold">썸네일 URL</label>
                                <input type="text" class="form-control" id="editThumbnail"
                                       placeholder="썸네일 이미지 URL을 입력하세요" style="border-radius: 12px;">
                                <small class="text-muted">비워두면 썸네일이 제거됩니다</small>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary" style="border-radius: 12px; padding: 12px;">
                                    <i class="fas fa-save me-2"></i>저장
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- 플로팅 로그인 모달 -->
        <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content" style="border-radius: 20px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
                    <div class="modal-header border-0 pb-0">
                        <h5 class="modal-title fw-bold" id="loginModalLabel" style="color: var(--primary-green);">
                            <i class="fas fa-heart me-2"></i>좋아요를 누르려면 로그인하세요
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body pt-0">
                        <div id="loginMessage" class="alert d-none" role="alert"></div>
                        
                        <div class="text-center mb-4">
                            <div class="company-avatar mx-auto mb-3" style="width: 60px; height: 60px;">
                                <i class="fas fa-seedling fa-2x" style="color: var(--primary-green);"></i>
                            </div>
                            <p class="text-muted">로그인하여 좋아요를 눌러보세요!</p>
                        </div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="modalEmail" class="form-label fw-bold">이메일</label>
                                <input type="email" class="form-control" id="modalEmail" name="email" required
                                       placeholder="이메일을 입력하세요" style="border-radius: 12px;">
                            </div>
                            <div class="mb-4">
                                <label for="modalPassword" class="form-label fw-bold">비밀번호</label>
                                <input type="password" class="form-control" id="modalPassword" name="password" required
                                       placeholder="비밀번호를 입력하세요" style="border-radius: 12px;">
                            </div>
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary" style="border-radius: 12px; padding: 12px;">
                                    <i class="fas fa-sign-in-alt me-2"></i>로그인
                                </button>
                            </div>
                        </form>

                        <hr class="my-4">

                        <div class="text-center">
                            <p class="mb-3 text-muted">간편 로그인</p>
                            <div class="d-grid gap-2">
                                <a href="/oauth2/authorization/google" class="btn btn-outline-danger" style="border-radius: 12px;">
                                    <i class="fab fa-google me-2"></i>Google로 로그인
                                </a>
                                <a href="/oauth2/authorization/github" class="btn btn-outline-dark" style="border-radius: 12px;">
                                    <i class="fab fa-github me-2"></i>GitHub로 로그인
                                </a>
                            </div>
                        </div>

                        <div class="text-center mt-4">
                            <small class="text-muted">
                                계정이 없으신가요? 
                                <a href="/auth/signup" class="text-decoration-none" style="color: var(--primary-green);">
                                    회원가입
                                </a>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div layout:fragment="scripts">
        <script th:src="@{/js/corporationDetail.js}"></script>
        <script th:src="@{/js/visitedHistory.js}"></script>
        <style>
            /* Article title hover styles */
            .title-link {
                transition: color 0.2s ease;
            }

            .article-card:hover .title-link {
                color: var(--primary-green) !important;
            }
        </style>
    </div>
</body>
</html>
