<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="${corporation.name + ' - 회사 정보'}">회사 정보</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/corporation-detail.css}">
</head>
<body>
    <div layout:fragment="content">
        <!-- 회사 정보 섹션 -->
        <div class="card mb-5" style="border-radius: 20px; background: var(--white); border: 2px solid var(--border-light);">
            <div class="card-body p-5">
                <div class="row align-items-center">
                    <!-- 회사 로고 -->
                    <div class="col-md-2 text-center mb-3 mb-md-0">
                        <img th:if="${corporation.logoS3Url != null}"
                             th:src="${corporation.logoS3Url}" 
                             th:alt="${corporation.name}"
                             class="img-fluid" style="max-width: 80px; border-radius: 12px;">
                        <div th:unless="${corporation.logoS3Url != null}" 
                             class="d-flex align-items-center justify-content-center"
                             style="width: 80px; height: 80px; background: var(--secondary-green); border-radius: 12px;">
                            <i class="fas fa-building fa-2x" style="color: var(--primary-green);"></i>
                        </div>
                    </div>
                    
                    <!-- 회사 정보 -->
                    <div class="col-md-10">
                        <div class="row">
                            <div class="col-lg-8">
                                <h1 class="mb-3" style="color: var(--text-dark); font-weight: 700;" th:text="${corporation.name}">회사명</h1>
                                
                                <div class="d-flex flex-wrap gap-3 mb-3" style="margin-bottom:10px;">
                                    <span class="badge" 
                                          th:class="${corporation.isDomestic} ? 'badge bg-success' : 'badge bg-info'"
                                          th:text="${corporation.regionText}">지역</span>
                                    <span class="text-muted">
                                        <i class="fas fa-calendar me-1"></i>
                                        등록일: <span th:text="${#temporals.format(corporation.createdAt, 'yyyy.MM.dd')}">2024.01.01</span>
                                    </span>
                                </div>
                                
                                <div class="d-flex flex-wrap gap-3">
                                    <a th:if="${corporation.homeLink != null}" 
                                       th:href="${corporation.homeLink}" 
                                       target="_blank" 
                                       class="btn btn-outline-primary btn-sm">
                                        <i class="fas fa-home me-1"></i>홈페이지
                                    </a>
                                    <a th:if="${corporation.blogLink != null}" 
                                       th:href="${corporation.blogLink}" 
                                       target="_blank" 
                                       class="btn btn-outline-secondary btn-sm">
                                        <i class="fas fa-blog me-1"></i>기술 블로그
                                    </a>
                                    <a th:if="${corporation.crewLink != null}" 
                                       th:href="${corporation.crewLink}" 
                                       target="_blank" 
                                       class="btn btn-outline-info btn-sm">
                                        <i class="fas fa-users me-1"></i>채용정보
                                    </a>
                                </div>
                            </div>
                            
                            <!-- 통계 정보 -->
                            <div class="col-lg-4">
                                <div class="stats-card text-center" style="background: var(--secondary-green); border-radius: 15px; padding: 1.5rem;">
                                    <div class="stats-number" style="color: var(--primary-green-dark); font-size: 2rem; font-weight: 700;" th:text="${corporation.articleCount}">0</div>
                                    <div class="stats-label" style="color: var(--primary-green-dark); font-weight: 600;">총 블로그 글 수</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 뒤로가기 버튼 -->
        <div class="mb-4">
            <div class="d-flex gap-2">
                <a th:href="@{/corporations}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left me-2"></i>구독 블로그 목록
                </a>
            </div>
        </div>
        
        <!-- 글 목록 헤더 -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 style="color: var(--text-dark); font-weight: 700;">
                <span th:text="${corporation.name}">회사명</span>의 블로그 글
            </h3>
            <span class="text-muted" th:text="'총 ' + ${totalElements} + '개의 글'">총 0개의 글</span>
        </div>
        
        <!-- 블로그 글 목록 -->
        <div class="articles-container" th:if="${!articles.content.isEmpty()}">
            <div class="article-card" th:each="article : ${articles.content}">
                <!-- Article Content (Left Side) -->
                <div class="article-content">
                    <!-- Title -->
                    <h5 class="mb-3 lh-base" style="color: var(--text-dark); font-weight: 700; font-size: 1.15rem;">
                        <a th:href="${article.link}" 
                           target="_blank" 
                           class="text-decoration-none"
                           style="color: inherit;"
                           th:text="${article.title}">
                           Article Title
                        </a>
                    </h5>
                    
                    <!-- Stats -->
                    <div class="d-flex align-items-center mb-3 flex-wrap">
                        <div class="d-flex align-items-center gap-3">
                            <small class="text-muted relative-time" 
                                   th:attr="data-date=${article.publishedAt}"
                                   th:title="${article.publishedAt}"
                                   th:text="${article.publishedAt}">2024-01-01</small>
                            <!-- <span class="text-muted d-flex align-items-center" style="font-size: 0.85rem;">
                                <i class="fas fa-eye me-1"></i> <span th:text="${article.viewCount}">0</span>
                            </span>
                            <button class="like-button" 
                                    th:attr="data-article-id=${article.id}">
                                <i class="fas fa-heart like-icon"></i> 
                                <span class="like-count" th:text="${article.likeCount}">0</span>
                            </button> -->
                        </div>
                    </div>
                    
                    <!-- Tags -->
                    <div class="mt-auto" th:if="${!article.tags.isEmpty()}">
                        <span class="badge tag-badge me-2" 
                              th:each="tag : ${article.tags}"
                              th:text="${tag.keyword}">Tag</span>
                    </div>
                </div>
                
                <!-- Thumbnail Container (Right Side) -->
                <div class="article-thumbnail-container">
                    <img th:if="${article.thumbnailImage.length > 2}" 
                         th:src="${article.thumbnailImage}" 
                         th:alt="${article.title}"
                         class="article-thumbnail">
                    <div th:unless="${article.thumbnailImage.length > 2}" 
                         class="article-thumbnail default-thumbnail">
                        <div class="article-thumbnail default-thumbnail">
                            <div class="default-thumbnail-content">
                                <i class="fas fa-code"></i>
                                <span class="thumbnail-text">NewCodes</span>
                                <div class="thumbnail-pattern"></div>
                            </div>
                        </div>
                    </div>
                    <!-- Reading Time Badge -->
                    <div class="position-absolute top-0 end-0 m-3" th:if="${article.readingTime != null}">
                        <span class="badge" style="background: rgba(255,255,255,0.9); color: var(--text-dark); font-weight: 600;">
                            <i class="fas fa-clock me-1"></i><span th:text="${article.readingTime}">5</span>분
                        </span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Empty State -->
        <div th:if="${articles.content.isEmpty()}" class="text-center py-5">
            <div class="hero-section">
                <i class="fas fa-newspaper fa-4x mb-4" style="color: var(--primary-green); opacity: 0.5;"></i>
                <h4 class="mb-3" style="color: var(--text-dark); font-weight: 700;">
                    아직 등록된 블로그 글이 없어요
                </h4>
                <p class="text-muted mb-4">
                    새로운 블로그 글이 곧 업데이트될 예정입니다.
                </p>
            </div>
        </div>
        
        <!-- Pagination -->
        <nav th:if="${totalPages > 1}" class="mt-5">
            <ul class="pagination justify-content-center">
                <!-- Previous Button -->
                <li class="page-item" th:class="${!hasPrevious} ? 'page-item disabled' : 'page-item'">
                    <a class="page-link" 
                       th:href="@{/corporations/{corporationId}(corporationId=${corporation.id}, page=${currentPage - 1})}">
                        <i class="fas fa-chevron-left me-1"></i>이전
                    </a>
                </li>
                
                <!-- Page Numbers (show max 5 pages: 1,2,3,4,5) -->
                <li class="page-item" 
                    th:each="pageNum : ${#numbers.sequence(0, T(java.lang.Math).min(totalPages - 1, 4))}"
                    th:class="${pageNum == currentPage} ? 'page-item active' : 'page-item'">
                    <a class="page-link" 
                       th:href="@{/corporations/{corporationId}(corporationId=${corporation.id}, page=${pageNum})}"
                       th:text="${pageNum + 1}">1</a>
                </li>
                
                <!-- Next Button -->
                <li class="page-item" th:class="${!hasNext} ? 'page-item disabled' : 'page-item'">
                    <a class="page-link" 
                       th:href="@{/corporations/{corporationId}(corporationId=${corporation.id}, page=${currentPage + 1})}">
                        다음<i class="fas fa-chevron-right ms-1"></i>
                    </a>
                </li>
            </ul>
        </nav>
        
        <!-- 플로팅 로그인 모달 -->
        <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content" style="border-radius: 20px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
                    <div class="modal-header border-0 pb-0">
                        <h5 class="modal-title fw-bold" id="loginModalLabel" style="color: var(--primary-green);">
                            <i class="fas fa-heart me-2"></i>좋아요를 누르려면 로그인하세요
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body pt-0">
                        <div id="loginMessage" class="alert d-none" role="alert"></div>
                        
                        <div class="text-center mb-4">
                            <div class="company-avatar mx-auto mb-3" style="width: 60px; height: 60px;">
                                <i class="fas fa-seedling fa-2x" style="color: var(--primary-green);"></i>
                            </div>
                            <p class="text-muted">로그인하여 좋아요를 눌러보세요!</p>
                        </div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="modalEmail" class="form-label fw-bold">이메일</label>
                                <input type="email" class="form-control" id="modalEmail" name="email" required
                                       placeholder="이메일을 입력하세요" style="border-radius: 12px;">
                            </div>
                            <div class="mb-4">
                                <label for="modalPassword" class="form-label fw-bold">비밀번호</label>
                                <input type="password" class="form-control" id="modalPassword" name="password" required
                                       placeholder="비밀번호를 입력하세요" style="border-radius: 12px;">
                            </div>
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary" style="border-radius: 12px; padding: 12px;">
                                    <i class="fas fa-sign-in-alt me-2"></i>로그인
                                </button>
                            </div>
                        </form>

                        <hr class="my-4">

                        <div class="text-center">
                            <p class="mb-3 text-muted">간편 로그인</p>
                            <div class="d-grid gap-2">
                                <a href="/oauth2/authorization/google" class="btn btn-outline-danger" style="border-radius: 12px;">
                                    <i class="fab fa-google me-2"></i>Google로 로그인
                                </a>
                                <a href="/oauth2/authorization/github" class="btn btn-outline-dark" style="border-radius: 12px;">
                                    <i class="fab fa-github me-2"></i>GitHub로 로그인
                                </a>
                            </div>
                        </div>

                        <div class="text-center mt-4">
                            <small class="text-muted">
                                계정이 없으신가요? 
                                <a href="/auth/signup" class="text-decoration-none" style="color: var(--primary-green);">
                                    회원가입
                                </a>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script layout:fragment="scripts">
        // 카드 클릭 시 외부 링크로 이동
        document.querySelectorAll('.article-card').forEach(card => {
            card.addEventListener('click', function(e) {
                // 태그나 다른 링크, 좋아요 버튼을 클릭한 경우가 아니라면
                if (e.target.tagName !== 'A' && !e.target.closest('a') && !e.target.closest('.badge') && !e.target.closest('.like-button')) {
                    const titleLink = this.querySelector('h5 a');
                    if (titleLink) {
                        window.open(titleLink.href, '_blank');
                    }
                }
            });
            
            // 카드에 커서 스타일 추가
            card.style.cursor = 'pointer';
        });
        
        // 로그인 모달 표시 함수
        function showLoginPopup() {
            console.log('showLoginPopup 함수 호출됨');
            const modalElement = document.getElementById('loginModal');
            console.log('모달 엘리먼트:', modalElement);
            
            if (modalElement) {
                // Bootstrap이 로드되었는지 확인
                if (typeof bootstrap !== 'undefined') {
                    console.log('Bootstrap 사용하여 모달 표시');
                    const loginModal = new bootstrap.Modal(modalElement);
                    loginModal.show();
                } else {
                    console.log('Bootstrap이 없어서 수동으로 모달 표시');
                    // Bootstrap이 없으면 수동으로 모달 표시
                    modalElement.style.display = 'block';
                    modalElement.classList.add('show');
                    document.body.classList.add('modal-open');
                    
                    // 백드롭 추가
                    const backdrop = document.createElement('div');
                    backdrop.className = 'modal-backdrop fade show';
                    backdrop.id = 'modalBackdrop';
                    document.body.appendChild(backdrop);
                    
                    // 닫기 버튼 이벤트
                    const closeBtn = modalElement.querySelector('.btn-close');
                    if (closeBtn) {
                        closeBtn.onclick = function() {
                            modalElement.style.display = 'none';
                            modalElement.classList.remove('show');
                            document.body.classList.remove('modal-open');
                            const backdrop = document.getElementById('modalBackdrop');
                            if (backdrop) backdrop.remove();
                        };
                    }
                }
            } else {
                console.error('loginModal 엘리먼트를 찾을 수 없습니다');
            }
        }

        
        // 좋아요 버튼 클릭 이벤트
        document.querySelectorAll('.like-button').forEach(btn => {
            btn.addEventListener('click', async function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                const articleId = this.getAttribute('data-article-id');
                const likeIcon = this.querySelector('.like-icon');
                const likeCount = this.querySelector('.like-count');
                
                try {
                    const response = await fetch(`/api/articles/${articleId}/like`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        credentials: 'same-origin',
                        redirect: 'manual'
                    });
                    
                    if (response.status === 401 || response.status === 0) {
                        // 인증되지 않은 사용자 (401) 또는 수동 리다이렉트로 인한 opaque response (0)
                        showLoginPopup();
                        return;
                    }
                    
                    if (response.ok) {
                        const data = await response.json();
                        
                        // 좋아요 수 업데이트
                        likeCount.textContent = data.likeCount;
                        
                        // 좋아요 상태에 따른 스타일 변경
                        if (data.isLiked) {
                            this.classList.add('liked');
                        } else {
                            this.classList.remove('liked');
                        }
                    }
                } catch (error) {
                    console.error('좋아요 처리 중 오류 발생:', error);
                }
            });
        });
        
        // 페이지 로드 시 좋아요 상태 확인
        async function loadLikeStatuses() {
            const likeButtons = document.querySelectorAll('.like-button');
            
            for (const btn of likeButtons) {
                const articleId = btn.getAttribute('data-article-id');
                
                try {
                    const response = await fetch(`/api/articles/${articleId}/like-status`, {
                        credentials: 'same-origin'
                    });
                    if (response.ok) {
                        const data = await response.json();
                        const likeIcon = btn.querySelector('.like-icon');
                        
                        if (data.hasLiked) {
                            btn.classList.add('liked');
                        }
                    }
                } catch (error) {
                    console.error('좋아요 상태 로드 중 오류 발생:', error);
                }
            }
        }
        
        // 상대 시간 계산 함수
        function getRelativeTime(dateString) {
            const now = new Date();
            const date = new Date(dateString);
            const diffInSeconds = Math.floor((now - date) / 1000);
            
            const minute = 60;
            const hour = minute * 60;
            const day = hour * 24;
            const week = day * 7;
            const month = day * 30;
            const year = day * 365;
            
            if (diffInSeconds < minute) {
                return '방금 전';
            } else if (diffInSeconds < hour) {
                const minutes = Math.floor(diffInSeconds / minute);
                return `${minutes}분 전`;
            } else if (diffInSeconds < day) {
                const hours = Math.floor(diffInSeconds / hour);
                return `${hours}시간 전`;
            } else if (diffInSeconds < week) {
                const days = Math.floor(diffInSeconds / day);
                return `${days}일 전`;
            } else if (diffInSeconds < month) {
                const weeks = Math.floor(diffInSeconds / week);
                return `${weeks}주일 전`;
            } else if (diffInSeconds < year) {
                const months = Math.floor(diffInSeconds / month);
                return `${months}달 전`;
            } else {
                const years = Math.floor(diffInSeconds / year);
                return `${years}년 전`;
            }
        }
        
        // 날짜 포맷팅 함수
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('ko-KR', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        // 기본 썸네일 아이콘 랜덤 설정
        function setupDefaultThumbnails() {
            document.querySelectorAll('.default-thumbnail').forEach((thumbnail, index) => {
                const iconElement = thumbnail.querySelector('i');
                const textElement = thumbnail.querySelector('.thumbnail-text');
                
                if (iconElement && textElement) {
                    iconElement.className = "fas fa-code";
                    textElement.textContent = "NewCodes";
                }
            });
        }
        
        // 페이지 로드 후 상대 시간 적용 및 좋아요 상태 로드
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.relative-time').forEach(element => {
                const dateString = element.getAttribute('data-date');
                if (dateString) {
                    // 상대 시간 표시
                    element.textContent = getRelativeTime(dateString);
                    // 툴팁에 포맷된 날짜 표시
                    element.title = formatDate(dateString);
                }
            });
            
            // 좋아요 상태 로드
            loadLikeStatuses();
            
            // 기본 썸네일 설정
            setupDefaultThumbnails();
            
            // 모달 로그인 처리
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    const email = document.getElementById('modalEmail').value;
                    const password = document.getElementById('modalPassword').value;
                    const messageDiv = document.getElementById('loginMessage');
                    
                    try {
                        const response = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            credentials: 'same-origin',
                            body: JSON.stringify({ email, password })
                        });
                        
                        if (response.ok) {
                            messageDiv.textContent = '로그인 성공! 페이지를 새로고침합니다.';
                            messageDiv.className = 'alert alert-success';
                            messageDiv.classList.remove('d-none');
                            
                            // 로그인 성공 후 페이지 새로고침하여 인증 상태 반영
                            setTimeout(() => {
                                window.location.reload();
                            }, 1000);
                        } else {
                            const data = await response.json();
                            messageDiv.textContent = data.message || '로그인에 실패했습니다.';
                            messageDiv.className = 'alert alert-danger';
                            messageDiv.classList.remove('d-none');
                        }
                    } catch (error) {
                        messageDiv.textContent = '로그인 중 오류가 발생했습니다.';
                        messageDiv.className = 'alert alert-danger';
                        messageDiv.classList.remove('d-none');
                    }
                });
            }
        });
    </script>
</body>
</html>
