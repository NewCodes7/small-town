<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>로그인 - NewCodes</title>
    <th:block layout:fragment="meta" th:remove="tag">
        <meta name="description" content="NewCodes에 로그인하여 모든 기술 블로그를 한 곳에서 만나보세요. 간편하게 로그인하고 맞춤형 서비스를 이용할 수 있습니다.">
        <meta name="keywords" content="로그인, NewCodes, 기술 블로그, 개발자, IT, 간편 로그인">
        <meta name="robots" content="noindex, nofollow">
    </th:block>
</head>

<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-lg border-0" style="border-radius: 20px;">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-dark mb-2">로그인</h2>
                        <p class="text-muted">NewCodes에 오신 것을 환영합니다</p>
                    </div>
                    
                    <div id="loginMessage" class="alert alert-danger d-none" role="alert"></div>
                    
                    <!-- OAuth2 오류 메시지 표시 -->
                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        <span th:text="${param.error}">소셜 로그인 중 오류가 발생했습니다.</span>
                    </div>
                    
                    <form id="loginForm">
                        <input type="hidden" id="redirectUrl" th:value="${redirectUrl}" />
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">이메일</label>
                            <input type="email" class="form-control form-control-lg" id="email" name="email"
                                   placeholder="이메일을 입력하세요" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">비밀번호</label>
                            <input type="password" class="form-control form-control-lg" id="password" name="password"
                                   placeholder="비밀번호를 입력하세요" required>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary btn-lg fw-semibold">
                                <i class="fas fa-sign-in-alt me-2"></i>로그인
                            </button>
                        </div>
                    </form>
                    
                    <div class="text-center mb-3">
                        <hr class="my-3">
                        
                        <div class="d-grid gap-2">
                            <a th:href="@{/oauth2/authorization/github}" class="btn btn-outline-dark btn-lg">
                                <i class="fab fa-github me-2"></i>GitHub로 로그인
                            </a>
                        </div>
                    </div>
                    
                    <div class="text-center">
                        <p class="text-muted mb-0">아직 계정이 없으신가요? 
                            <a th:href="@{/auth/signup}" class="text-decoration-none fw-semibold" 
                               style="color: var(--primary-green);">회원가입</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script layout:fragment="scripts">
// localStorage 좋아요 마이그레이션 (블로그)
async function migrateLikesFromLocalStorage() {
    try {
        const LIKED_ARTICLES_KEY = 'likedArticles';
        const stored = localStorage.getItem(LIKED_ARTICLES_KEY);

        if (!stored) {
            return null; // 저장된 좋아요가 없으면 null 반환
        }

        const likedIds = JSON.parse(stored);

        if (!likedIds || likedIds.length === 0) {
            return null; // 빈 배열이면 null 반환
        }

        // 마이그레이션 API 호출
        const response = await fetch('/api/articles/migrate-likes', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            credentials: 'include',
            body: JSON.stringify(likedIds)
        });

        if (response.ok) {
            const data = await response.json();
            console.log(`Successfully migrated ${data.totalCount} article likes`);
            // 마이그레이션 성공 후 localStorage 클리어
            localStorage.removeItem(LIKED_ARTICLES_KEY);
            return data;
        }
        return null;
    } catch (error) {
        console.error('Failed to migrate article likes:', error);
        // 마이그레이션 실패해도 로그인은 계속 진행
        return null;
    }
}

// localStorage 좋아요 마이그레이션 (유튜브)
async function migrateVideoLikesFromLocalStorage() {
    try {
        const LIKED_VIDEOS_KEY = 'likedVideos';
        const stored = localStorage.getItem(LIKED_VIDEOS_KEY);

        if (!stored) {
            return null; // 저장된 좋아요가 없으면 null 반환
        }

        const likedIds = JSON.parse(stored);

        if (!likedIds || likedIds.length === 0) {
            return null; // 빈 배열이면 null 반환
        }

        // 마이그레이션 API 호출
        const response = await fetch('/video/api/videos/migrate-likes', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            credentials: 'include',
            body: JSON.stringify(likedIds)
        });

        if (response.ok) {
            const data = await response.json();
            console.log(`Successfully migrated ${data.totalCount} video likes`);
            // 마이그레이션 성공 후 localStorage 클리어
            localStorage.removeItem(LIKED_VIDEOS_KEY);
            return data;
        }
        return null;
    } catch (error) {
        console.error('Failed to migrate video likes:', error);
        // 마이그레이션 실패해도 로그인은 계속 진행
        return null;
    }
}

document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const messageDiv = document.getElementById('loginMessage');
    const redirectUrl = document.getElementById('redirectUrl').value || '/';

    try {
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            credentials: 'include', // 쿠키 포함
            body: JSON.stringify({ email, password })
        });

        if (response.ok) {
            const data = await response.json();
            // 쿠키는 서버에서 자동으로 설정되므로 localStorage 사용하지 않음

            // localStorage에 저장된 좋아요 마이그레이션 (블로그 + 유튜브)
            const [articleResult, videoResult] = await Promise.all([
                migrateLikesFromLocalStorage(),
                migrateVideoLikesFromLocalStorage()
            ]);

            // 마이그레이션 결과 모달 표시
            if ((articleResult?.totalCount || 0) + (videoResult?.totalCount || 0) > 0) {
                showMigrationModal(articleResult, videoResult);
                // 모달 닫힐 때 페이지 이동
                const modal = document.getElementById('migrationModal');
                modal.addEventListener('hidden.bs.modal', function () {
                    window.location.href = redirectUrl;
                }, { once: true });
            } else {
                // 마이그레이션된 항목이 없으면 바로 리디렉션
                window.location.href = redirectUrl;
            }
        } else {
            messageDiv.textContent = '이메일 또는 비밀번호가 올바르지 않습니다.';
            messageDiv.classList.remove('d-none');
        }
    } catch (error) {
        messageDiv.textContent = '로그인 중 오류가 발생했습니다.';
        messageDiv.classList.remove('d-none');
    }
});
</script>
</html>
