<!DOCTYPE html>
<html lang="ko" 
        xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="'NewCodes - 기술 유튜브 모음'">기술 유튜브 모음</title>
    <th:block layout:fragment="meta" th:remove="tag">
        <meta name="description" content="NewCodes에서 최신 기술 유튜브를 한 곳에서 만나보세요. 개발자를 위한 다양한 기술 영상을 매일 업데이트합니다.">
        <meta name="keywords" content="유튜브, 최신 기술, IT 뉴스, 개발자 커뮤니티, 기술 영상, NewCodes">
        <meta name="robots" content="index, follow">
    </th:block>
    <link rel="stylesheet" type="text/css" th:href="@{/css/home.css}">
    <script th:src="@{/js/searchUtils.js}"></script>
</head>
<body>
    <div layout:fragment="content">
        <!-- Modern Search and Filter Section -->
        <div class="search-filter-container mb-5">
            <!-- Primary Search Bar -->
            <div class="primary-search-section">
                <div class="search-wrapper">
                    <form id="searchForm" class="search-form">
                        <div class="search-input-container">
                            <div class="search-icon">
                                <i class="fas fa-search"></i>
                            </div>
                            <input type="text"
                                   id="searchInput"
                                   name="keyword"
                                   class="search-input"
                                   placeholder="원하는 영상을 검색해보세요!"
                                   th:value="${keyword}"
                                   autocomplete="off">
                            <button type="submit" class="search-submit-btn">
                                <i class="fas fa-arrow-right"></i>
                            </button>
                            <!-- 자동완성 드롭다운 -->
                            <div id="autocompleteDropdown" class="autocomplete-dropdown" style="display: none;"></div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Filter Pills Section -->
            <div class="filter-pills-section">
                <div class="filter-pills-container">
                    <!-- Quick Filter Pills -->
                    <div class="quick-filters">
                        <!-- Region Filter Group -->
                        <div class="filter-group">
                            <div class="region-toggle-container">
                                <button type="button" id="regionAllBtn"
                                        th:class="'region-toggle-btn' + (${selectedRegions.isEmpty() or (selectedRegions.contains('domestic') and selectedRegions.contains('overseas'))} ? ' active' : '')">
                                    <i class="fas fa-earth-americas"></i>
                                    <span>전체</span>
                                </button>
                                <button type="button" id="regionDomesticBtn"
                                        th:class="'region-toggle-btn' + (${selectedRegions.size() == 1 and selectedRegions.contains('domestic')} ? ' active' : '')">
                                    <i class="fas fa-map-marker-alt"></i>
                                    <span>국내</span>
                                </button>
                                <button type="button" id="regionOverseasBtn"
                                        th:class="'region-toggle-btn' + (${selectedRegions.size() == 1 and selectedRegions.contains('overseas')} ? ' active' : '')">
                                    <i class="fas fa-globe"></i>
                                    <span>해외</span>
                                </button>
                            </div>
                        </div>

                        <!-- Content Type Filter Group (Removed - Videos only) -->

                        <!-- Category Filter -->
                        <div class="filter-group">
                            <div class="category-filter-dropdown">
                                <button class="filter-pill dropdown-pill" type="button" id="categoryDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                    <i class="fas fa-tags"></i>
                                    <span>카테고리</span>
                                    <i class="fas fa-chevron-down dropdown-arrow"></i>
                                </button>
                                <ul class="dropdown-menu modern-dropdown" aria-labelledby="categoryDropdown" id="categoryDropdownMenu">
                                    <!-- Thymeleaf로 카테고리 목록 렌더링 -->
                                    <th:block th:each="category, iterStat : ${categories}">
                                        <!-- 그룹 구분선 추가 -->
                                        <li th:if="${iterStat.index > 0 and
                                            (#strings.equalsIgnoreCase(category.name, 'Backend') or
                                             #strings.equalsIgnoreCase(category.name, 'AI') or
                                             #strings.equalsIgnoreCase(category.name, 'Culture'))}">
                                            <hr class="dropdown-divider">
                                        </li>
                                        <li>
                                            <a class="dropdown-item category-option" href="#"
                                               th:attr="data-category-id=${category.id},
                                                       data-category-name=${category.name}">
                                                <i class="me-2"></i>
                                                <span th:text="${category.name}">Category Name</span>
                                            </a>
                                        </li>
                                    </th:block>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <!-- Sort Control (검색할 때만 표시) -->
                    <div class="sort-controls" th:if="${keyword != null && !keyword.isEmpty()}">
                        <div class="sort-dropdown">
                            <button class="filter-pill dropdown-pill" type="button" id="sortDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fas fa-sort"></i>
                                <span id="sortLabel">최신순</span>
                                <i class="fas fa-chevron-down dropdown-arrow"></i>
                            </button>
                            <ul class="dropdown-menu modern-dropdown" aria-labelledby="sortDropdown">
                                <!-- <li th:if="${keyword != null && !keyword.isEmpty()}">
                                    <a class="dropdown-item sort-option" href="#" data-sort="relevance">
                                        <i class="fas fa-search me-2"></i>
                                        <span>적합도순</span>
                                    </a>
                                </li> -->
                                <li>
                                    <a class="dropdown-item sort-option" href="#" data-sort="latest">
                                        <i class="fas fa-clock me-2"></i>
                                        <span>최신순</span>
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item sort-option" href="#" data-sort="oldest">
                                        <i class="fas fa-history me-2"></i>
                                        <span>오래된순</span>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>

                    <!-- View Controls -->
                    <div class="view-controls">
                        <div class="view-toggle-container">
                            <button id="groupedViewBtn" type="button"
                                    th:class="'view-toggle-btn' + (${isGrouped} ? ' active' : '')">
                                <i class="fas fa-layer-group"></i>
                                <span class="view-text">기업별</span>
                            </button>
                            <button id="listViewBtn" type="button"
                                    th:class="'view-toggle-btn' + (${!isGrouped} ? ' active' : '')">
                                <i class="fas fa-list"></i>
                                <span class="view-text">리스트</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Selected Categories Row -->
                <div class="selected-categories-row" id="selectedCategoriesGroup" style="display: none;">
                    <div id="selectedCategoriesList" class="selected-categories-inline">
                        <!-- 선택된 카테고리 블록들이 여기에 추가됩니다 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Enhanced Search Filter Styles -->
        <style>
            /* Popular video banner styles - matching article banner */
            .popular-video-banner {
                width: 100%;
                height: 100%;
                background: linear-gradient(135deg, var(--secondary-green) 0%, #F0F8F0 100%);
                display: flex;
                align-items: center;
                justify-content: space-between;
                color: var(--text-dark);
                position: relative;
                padding: 40px;
                gap: 40px;
            }

            .popular-video-banner .video-thumbnail {
                flex: 0 0 300px;
                height: 155.22px;
                border-radius: 12px;
                overflow: hidden;
                box-shadow: 0 8px 24px rgba(0,0,0,0.15);
                display: flex;
                align-items: center;
                justify-content: center;
                background: #E8FFF2;
            }

            .popular-video-banner .video-content {
                flex: 1;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                padding: 30px;
            }

            .popular-video-banner .video-badge {
                display: inline-block;
                background: var(--primary-green);
                color: white;
                padding: 6px 16px;
                border-radius: 20px;
                font-size: 0.9rem;
                font-weight: 600;
                margin-bottom: 20px;
                align-self: flex-start;
            }

            .popular-video-banner .video-title {
                font-size: 1.8rem;
                font-weight: 700;
                margin-bottom: 0;
                line-height: 1.4;
                color: var(--text-dark);
            }

            .popular-video-banner .video-info {
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                gap: 20px;
                flex-wrap: wrap;
                margin-top: auto;
            }

            .popular-video-banner .video-company {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            @media (max-width: 768px) {
                .popular-video-banner {
                    flex-direction: column;
                    gap: 20px;
                    padding: 20px;
                    text-align: center;
                }
                .popular-video-banner .video-thumbnail {
                    flex: none;
                    width: 100%;
                    max-width: 300px;
                    margin: 0 auto;
                }
                .popular-video-banner .video-content {
                    padding: 20px;
                    text-align: center;
                    align-items: center;
                }
                .popular-video-banner .video-badge {
                    align-self: center;
                }
                .popular-video-banner .video-title {
                    font-size: 1.4rem;
                }
                .popular-video-banner .video-info {
                    flex-direction: column;
                    align-items: center;
                    gap: 12px;
                }
            }
        </style>

        <!-- Loading State -->
        <div id="loadingState" class="text-center py-4 d-none">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">글을 불러오는 중...</p>
        </div>

        <!-- 리스트 뷰 -->
        <div th:unless="${isGrouped}" th:fragment="articleWrapper" id="article-list-container">
            <!-- Videos Stack -->
            <div class="articles-list-container">
                <div class="video-card-wrapper" th:each="video : ${videos.content}">
                    <div class="video-card" th:attr="data-article-id=${video.id}">
                        <!-- Video Content (Left Side) -->
                    <div class="video-content">
                        <!-- Title -->
                        <h5 class="mb-3 lh-base" style="color: var(--text-dark); font-weight: 700; font-size: 1.15rem;">
                            <span class="text-decoration-none title-link video-title-clickable"
                                  th:attr="data-video-id=${video.videoId}, data-video-title=${video.translatedTitle != null && !video.translatedTitle.isEmpty() ? video.translatedTitle : video.title}, data-article-id=${video.id}"
                                  onclick="openVideoModal(this)"
                                  style="color: inherit; cursor: pointer;">
                                <span th:text="${video.translatedTitle != null && !video.translatedTitle.isEmpty() ? video.translatedTitle : video.title}">Video Title</span>
                            </span>
                        </h5>
                        
                        <!-- Company Info & Stats -->
                        <div class="d-flex align-items-center flex-wrap">
                            <div class="d-flex align-items-center me-4">
                                <a th:href="@{/corporations/{id}/video(id=${video.corporation.id})}"
                                class="d-flex align-items-center text-decoration-none company-link">
                                    <img width="20px;" th:if="${video.corporation.effectiveLogoUrl != null}"
                                        th:src="${video.corporation.effectiveLogoUrl}"
                                        th:alt="${video.corporation.name}"
                                        class="company-logo me-2" style="border-radius: 4px;">
                                    <span class="fw-bold me-2" style="color: var(--primary-green); font-size: 0.9rem;" th:text="${video.corporation.name}">Company</span>
                                </a>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <small class="text-muted relative-time"
                                    th:attr="data-date=${video.publishedAt}"
                                    th:title="${video.publishedAt}"
                                    th:text="${video.publishedAt}"
                                    style="white-space: nowrap;">2024-01-01</small>
                                <button class="like-button"
                                        th:attr="data-video-id=${video.id},
                                                data-liked=${video.isLiked != null and video.isLiked}">
                                    <i class="fas fa-heart like-icon"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Thumbnail Container (Right Side) -->
                    <div class="video-thumbnail-container"
                         th:attr="data-video-id=${video.videoId}, data-video-title=${video.translatedTitle != null && !video.translatedTitle.isEmpty() ? video.translatedTitle : video.title}, data-article-id=${video.id}"
                         onclick="openVideoModal(this)">
                        <img th:if="${video.thumbnailUrl != null && !video.thumbnailUrl.isEmpty()}"
                            th:src="${video.thumbnailUrl}"
                            th:alt="${video.title}"
                            class="video-thumbnail">
                        <div th:unless="${video.thumbnailUrl != null && !video.thumbnailUrl.isEmpty()}"
                            class="video-thumbnail-fallback">
                            <div class="default-thumbnail-content">
                                <i class="fas fa-code"></i>
                                <div class="thumbnail-pattern"></div>
                            </div>
                        </div>
                        <!-- Play Button Overlay -->
                        <div class="video-play-overlay"></div>
                    </div>
                    </div>

                    <!-- Admin Control Panel (separate from article) -->
                    <div class="admin-control-panel d-none">
                        <button class="admin-edit-btn" title="글 편집" th:attr="data-article-id=${video.id}">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="admin-summary-btn" title="요약 관리" th:attr="data-article-id=${video.id}">
                            <i class="fas fa-list"></i>
                        </button>
                        <button class="admin-delete-btn" title="글 삭제" th:attr="data-article-id=${video.id},data-article-title=${video.title}">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 그룹 뷰 -->
        <div th:if="${isGrouped}" th:fragment="articleWrapper" id="article-grouped-container" class="grouped-view">
            <!-- Grouped Videos Container -->
            <div th:if="${!videos.content.isEmpty()}" class="articles-container">
                <div class="video-card-wrapper" th:each="group : ${videos.content}" th:with="firstVideo=${group.videos[0]}, childVideos=${group.videos.size() > 1} ? ${group.videos.subList(1, group.videos.size())} : ${new java.util.ArrayList()}">
                    <div class="video-card" th:attr="data-article-id=${firstVideo.id}">

                        <!-- Video Content (Left Side) -->
                        <div class="video-content">
                            <!-- Title -->
                            <h5 class="mb-3 lh-base" style="color: var(--text-dark); font-weight: 700; font-size: 1.15rem;">
                                <span class="text-decoration-none title-link video-title-clickable"
                                      th:attr="data-video-id=${firstVideo.videoId}, data-video-title=${firstVideo.translatedTitle != null && !firstVideo.translatedTitle.isEmpty() ? firstVideo.translatedTitle : firstVideo.title}, data-article-id=${firstVideo.id}"
                                      onclick="openVideoModal(this)"
                                      style="color: inherit; cursor: pointer;">
                                    <span th:text="${firstVideo.translatedTitle != null && !firstVideo.translatedTitle.isEmpty() ? firstVideo.translatedTitle : firstVideo.title}"></span>
                                </span>
                            </h5>
                            
                            <!-- Company Info & Stats -->
                            <div class="d-flex align-items-center flex-wrap">
                                <div class="d-flex align-items-center me-4">
                                    <a th:href="@{/corporations/{id}/video(id=${group.corporation.id})}" class="d-flex align-items-center text-decoration-none company-link">
                                        <img width="20px;" th:if="${group.corporation.effectiveLogoUrl != null}" th:src="${group.corporation.effectiveLogoUrl}" th:alt="${group.corporation.name}" class="company-logo me-2" style="border-radius: 4px;">
                                        <span class="fw-bold me-2" style="color: var(--primary-green); font-size: 0.9rem;" th:text="${group.corporation.name}"></span>
                                    </a>
                                </div>
                                <div class="d-flex align-items-center gap-2">
                                    <small class="text-muted relative-time" th:attr="data-date=${firstVideo.publishedAt}" th:title="${firstVideo.publishedAt}" th:text="${firstVideo.publishedAt}" style="white-space: nowrap;"></small>
                                    <button class="like-button"
                                            th:attr="data-video-id=${firstVideo.id},
                                                    data-liked=${firstVideo.isLiked != null and firstVideo.isLiked}">
                                        <i class="fas fa-heart like-icon"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Thumbnail Container (Right Side) -->
                        <div class="video-thumbnail-container"
                             th:attr="data-video-id=${firstVideo.videoId}, data-video-title=${firstVideo.translatedTitle != null && !firstVideo.translatedTitle.isEmpty() ? firstVideo.translatedTitle : firstVideo.title}, data-article-id=${firstVideo.id}"
                             onclick="openVideoModal(this)">
                            <img th:if="${firstVideo.thumbnailUrl != null && !firstVideo.thumbnailUrl.isEmpty()}"
                                th:src="${firstVideo.thumbnailUrl}"
                                th:alt="${firstVideo.title}"
                                class="video-thumbnail">
                            <div th:unless="${firstVideo.thumbnailUrl != null && !firstVideo.thumbnailUrl.isEmpty()}"
                                class="video-thumbnail-fallback">
                                <div class="default-thumbnail-content">
                                    <i class="fas fa-code"></i>
                                    <div class="thumbnail-pattern"></div>
                                </div>
                            </div>
                            <!-- Play Button Overlay -->
                            <div class="video-play-overlay"></div>
                        </div>

                        <!-- Child Container (Bottom Side) -->
                        <div class="child-container" th:if="${!childVideos.isEmpty()}">
                            <div class="child"
                                 th:each="child : ${childVideos}"
                                 th:attr="data-article-id=${child.id}, data-video-id=${child.videoId}, data-video-title=${child.translatedTitle != null && !child.translatedTitle.isEmpty() ? child.translatedTitle : child.title}">
                                <h6 style="margin: 0;">
                                    <a th:if="${child.videoId == null || child.videoId.isEmpty()}"
                                       th:href="${child.link}" target="_blank"
                                       class="text-decoration-none title-link d-flex align-items-center" style="color: inherit;">
                                        <span th:text="${child.translatedTitle != null && !child.translatedTitle.isEmpty() ? child.translatedTitle : child.title}"></span>
                                    </a>
                                    <span th:unless="${child.videoId == null || child.videoId.isEmpty()}"
                                          class="text-decoration-none title-link video-title-clickable"
                                          th:attr="data-article-id=${child.id}, data-video-id=${child.videoId}, data-video-title=${child.translatedTitle != null && !child.translatedTitle.isEmpty() ? child.translatedTitle : child.title}"
                                          onclick="openVideoModal(this)"
                                          style="color: inherit; cursor: pointer;">
                                        <span th:text="${child.translatedTitle != null && !child.translatedTitle.isEmpty() ? child.translatedTitle : child.title}"></span>
                                    </span>
                                </h6>
                                <span class="child-date d-flex align-items-center flex-wrap">
                                    <span class="d-flex align-items-center gap-2">
                                        <small class="text-muted relative-time" th:attr="data-date=${child.publishedAt}" th:title="${child.publishedAt}" th:text="${child.publishedAt}" style="white-space: nowrap;"></small>
                                        <button class="like-button"
                                            th:attr="data-video-id=${child.id},
                                                    data-liked=${child.isLiked != null and child.isLiked}">
                                            <i class="fas fa-heart like-icon"></i>
                                        </button>
                                    </span>
                                </span>
                            </div>
                            <div class="child more-corporation-articles">
                                <a th:href="@{/corporations/{id}/video(id=${group.corporation.id})}" class="me-2 d-flex align-items-center text-decoration-none">
                                    <span class="fw-bold me-2" style="font-size: 1rem;">더보기</span>
                                </a>
                            </div>
                        </div>
                    </div>

                    <!-- Admin Control Panel (separate from article) -->
                    <div class="admin-control-panel d-none">
                        <button class="admin-edit-btn" title="글 편집" th:attr="data-article-id=${firstVideo.id}">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="admin-summary-btn" title="요약 관리" th:attr="data-article-id=${firstVideo.id}">
                            <i class="fas fa-list"></i>
                        </button>
                        <button class="admin-delete-btn" title="글 삭제" th:attr="data-article-id=${firstVideo.id},data-article-title=${firstVideo.title}">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${videos.content.isEmpty()}" class="text-center py-5">
                <div class="hero-section">
                    <i class="fas fa-search fa-4x mb-4" style="color: var(--primary-green); opacity: 0.5;" th:if="${keyword != null && !keyword.isEmpty()}"></i>
                    <i class="fas fa-seedling fa-4x mb-4" style="color: var(--primary-green); opacity: 0.5;" th:unless="${keyword != null && !keyword.isEmpty()}"></i>
                    
                    <h4 class="mb-3" style="color: var(--text-dark); font-weight: 700;" th:if="${keyword != null && !keyword.isEmpty()}">
                        '<span th:text="${keyword}"></span>' 검색 결과가 없어요
                    </h4>
                    <h4 class="mb-3" style="color: var(--text-dark); font-weight: 700;" th:unless="${keyword != null && !keyword.isEmpty()}">
                        아직 등록된 글이 없어요
                    </h4>
                    
                    <p class="text-muted mb-4" th:if="${keyword != null && !keyword.isEmpty()}">
                        다른 키워드로 검색하거나 <a th:href="@{/}" class="text-decoration-none">전체 글 목록</a>을 확인해보세요.
                    </p>
                    <p class="text-muted mb-4" th:unless="${keyword != null && !keyword.isEmpty()}">
                        새로운 기술 블로그 글이 곧 업데이트될 예정입니다.
                    </p>
                </div>
            </div>
        </div>

        <!-- Pagination Container -->
        <div id="paginationContainer" class="mt-5">
            <!-- 동적으로 생성되는 페이지네이션 -->
            <nav th:if="${totalPages > 0}">
                <ul class="pagination justify-content-center">
                    <!-- Previous Button -->
                    <li class="page-item" th:class="${currentPage == 0} ? 'page-item disabled' : 'page-item'">
                        <a class="page-link" href="#" th:attr="data-page=${currentPage - 1}">
                            <i class="fas fa-chevron-left me-1"></i><span class="pagination-text">이전</span>
                        </a>
                    </li>

                    <!-- Page Numbers - Responsive page count -->
                    <th:block th:with="
                        maxPagesToShow=5,
                        halfRange=2,
                        startPage=${totalPages <= maxPagesToShow ? 0 :
                                   (currentPage <= halfRange ? 0 :
                                       (currentPage >= totalPages - halfRange - 1 ? totalPages - maxPagesToShow :
                                           currentPage - halfRange))},
                        endPage=${totalPages <= 1 ? 0 :
                                 (totalPages <= maxPagesToShow ? totalPages - 1 :
                                     (currentPage <= halfRange ? maxPagesToShow - 1 :
                                         (currentPage >= totalPages - halfRange - 1 ? totalPages - 2 :
                                             currentPage + halfRange)))}
                    ">
                        <!-- Main page numbers -->
                        <li class="page-item page-number"
                            th:each="pageNum, iterStat : ${#numbers.sequence(startPage, endPage)}"
                            th:class="${pageNum == currentPage} ? 'page-item active page-number' : 'page-item page-number'"
                            th:attr="data-page-index=${iterStat.index}">
                            <a class="page-link" href="#" th:attr="data-page=${pageNum}" th:text="${pageNum + 1}">1</a>
                        </li>

                    </th:block>

                    <!-- Next Button -->
                    <li class="page-item" th:class="${currentPage >= totalPages - 1} ? 'page-item disabled' : 'page-item'">
                        <a class="page-link" href="#" th:attr="data-page=${currentPage + 1}">

        <script>
            // Open video modal
            function openVideoModal(element) {
                const videoId = element.getAttribute('data-video-id');
                const videoTitle = element.getAttribute('data-video-title');
                const articleId = element.getAttribute('data-article-id');
                const modal = document.getElementById('videoModal');
                const iframe = document.getElementById('modalVideoPlayer');

                // Increment view count
                if (articleId) {
                    fetch(`/video/api/videos/${articleId}/view`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        credentials: 'same-origin',
                        redirect: 'manual'
                    }).catch(error => {
                        console.log('조회수 증가 요청 실패:', error);
                    });
                }

                // Set iframe src with autoplay
                iframe.src = `https://www.youtube.com/embed/${videoId}?controls=1&modestbranding=1&rel=0&autoplay=1`;
                iframe.title = videoTitle;

                // Show modal
                modal.classList.add('active');
                document.body.style.overflow = 'hidden'; // Prevent background scrolling
            }

            // Close video modal
            function closeVideoModal(event) {
                const modal = document.getElementById('videoModal');
                const iframe = document.getElementById('modalVideoPlayer');

                // Only close if clicking on modal background or close button
                if (event.target === modal || event.target.classList.contains('video-modal-close')) {
                    modal.classList.remove('active');
                    iframe.src = ''; // Stop video playback
                    document.body.style.overflow = ''; // Restore scrolling
                }
            }

            // Close modal with Escape key
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape') {
                    const modal = document.getElementById('videoModal');
                    if (modal.classList.contains('active')) {
                        closeVideoModal({ target: modal });
                    }
                }
            });

            // ===== 좋아요 기능 =====
            const LIKED_VIDEOS_KEY = 'likedVideos';

            function getLikedVideoIds() {
                try {
                    const stored = localStorage.getItem(LIKED_VIDEOS_KEY);
                    return stored ? JSON.parse(stored) : [];
                } catch (error) {
                    console.error('Error reading liked videos:', error);
                    return [];
                }
            }

            function saveLikedVideoIds(ids) {
                try {
                    localStorage.setItem(LIKED_VIDEOS_KEY, JSON.stringify(ids));
                } catch (error) {
                    console.error('Error saving liked videos:', error);
                }
            }

            function addToLikedVideos(videoId) {
                const likedIds = getLikedVideoIds();
                const numericId = parseInt(videoId);
                if (!likedIds.includes(numericId)) {
                    likedIds.push(numericId);
                    saveLikedVideoIds(likedIds);
                }
            }

            function removeFromLikedVideos(videoId) {
                const likedIds = getLikedVideoIds();
                const numericId = parseInt(videoId);
                const filtered = likedIds.filter(id => id !== numericId);
                saveLikedVideoIds(filtered);
            }

            // localStorage 좋아요 마이그레이션
            async function migrateLikesFromLocalStorage() {
                try {
                    const stored = localStorage.getItem(LIKED_VIDEOS_KEY);

                    if (!stored) {
                        return null; // 저장된 좋아요가 없으면 null 반환
                    }

                    const likedIds = JSON.parse(stored);

                    if (!likedIds || likedIds.length === 0) {
                        return null; // 빈 배열이면 null 반환
                    }

                    // 마이그레이션 API 호출
                    const response = await fetch('/video/api/videos/migrate-likes', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        credentials: 'include',
                        body: JSON.stringify(likedIds)
                    });

                    if (response.ok) {
                        const data = await response.json();
                        console.log(`Successfully migrated ${data.totalCount} video likes`);
                        // 마이그레이션 성공 후 localStorage 클리어
                        localStorage.removeItem(LIKED_VIDEOS_KEY);
                        return data;
                    }
                    return null;
                } catch (error) {
                    console.error('Failed to migrate video likes:', error);
                    // 마이그레이션 실패해도 로그인은 계속 진행
                    return null;
                }
            }

            // Bind click events to video cards (similar to article cards)
            function bindVideoCardEvents() {
                document.querySelectorAll('.video-card').forEach(card => {
                    card.addEventListener('click', (e) => {
                        // 회사 링크, 배지, 관리자 버튼을 클릭한 경우는 기본 동작 허용
                        if (e.target.closest('.badge') ||
                            e.target.closest('.company-link') ||
                            e.target.closest('.admin-delete-btn') ||
                            e.target.closest('.admin-edit-btn') ||
                            e.target.closest('.admin-summary-btn') ||
                            e.target.closest('.more-corporation-articles') ||
                            e.target.closest('.like-button')) {
                            return; // 기본 동작 허용 (링크 이동 등)
                        }

                        // 이미 클릭 가능한 요소인 경우 중복 방지
                        if (e.target.closest('.video-thumbnail-container') ||
                            e.target.closest('.video-title-clickable') ||
                            e.target.closest('.child')) {
                            return; // 이미 자체 클릭 핸들러가 있음
                        }

                        e.preventDefault();

                        // 카드에서 video 정보 가져오기
                        const videoThumbnail = card.querySelector('.video-thumbnail-container');
                        if (videoThumbnail) {
                            openVideoModal(videoThumbnail);
                        }
                    });

                    card.style.cursor = 'pointer';
                });

                // Bind click events to child elements (grouped view의 하위 항목들)
                document.querySelectorAll('.child').forEach(child => {
                    // more-corporation-articles는 제외
                    if (child.classList.contains('more-corporation-articles')) {
                        return;
                    }

                    child.addEventListener('click', (e) => {
                        // 좋아요 버튼, 회사 링크를 클릭한 경우는 기본 동작 허용
                        if (e.target.closest('.like-button') ||
                            e.target.closest('.company-link') || e.target.closest('a')) {
                            return; // 기본 동작 허용 (링크 이동 등)
                        }

                        // 이미 클릭 가능한 요소인 경우 중복 방지
                        if (e.target.closest('.video-title-clickable')) {
                            return; // 이미 자체 클릭 핸들러가 있음
                        }

                        e.preventDefault();

                        // child 요소에서 video 정보 가져오기
                        const videoId = child.getAttribute('data-video-id');
                        const videoTitle = child.getAttribute('data-video-title');
                        const articleId = child.getAttribute('data-article-id');

                        // videoId가 있으면 모달 열기
                        if (videoId && articleId) {
                            const tempElement = {
                                getAttribute: (attr) => {
                                    if (attr === 'data-video-id') return videoId;
                                    if (attr === 'data-video-title') return videoTitle;
                                    if (attr === 'data-article-id') return articleId;
                                }
                            };
                            openVideoModal(tempElement);
                        } else {
                            // videoId가 없으면 외부 링크로 이동
                            const link = child.querySelector('a');
                            if (link) {
                                window.open(link.href, '_blank');
                            }
                        }
                    });

                    child.style.cursor = 'pointer';
                });
            }

            // 페이지 로드 시 이벤트 바인딩
            document.addEventListener('DOMContentLoaded', function() {
                bindVideoCardEvents();

                // ===== 검색 자동완성 초기화 (searchAutocomplete.js 모듈 사용) =====
                const videoAutocomplete = new SearchAutocomplete({
                    searchInputId: 'searchInput',
                    dropdownId: 'autocompleteDropdown',
                    formId: 'searchForm',
                    autocompleteApiUrl: '/video/api/autocomplete',
                    searchHistoryKey: 'small_town_video_search_history',
                    supportTheme: false,
                    corporationUrlPattern: '/corporations/{id}/video',
                    debounceDelay: 100
                });
                videoAutocomplete.init();
            });

</script>
