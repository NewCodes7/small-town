<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>구독 블로그</title>
    <style>
        .corp-hero {
            background: linear-gradient(135deg, var(--secondary-green) 0%, #F0F8F0 100%);
            border-radius: 24px;
            padding: 48px 32px;
            margin-bottom: 48px;
            text-align: center;
            border: 1px solid rgba(40, 199, 111, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .corp-hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(3, 199, 90, 0.05) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .corp-hero-content {
            position: relative;
            z-index: 2;
        }
        
        .corp-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 16px;
            letter-spacing: -1px;
        }
        
        .corp-subtitle {
            font-size: 1.25rem;
            color: var(--text-light);
            font-weight: 500;
            margin-bottom: 24px;
        }
        
        .corporation-card {
            background: var(--white);
            border-radius: 20px;
            border: 2px solid var(--border-light);
            transition: all 0.3s ease;
            overflow: hidden;
            height: 100%;
            position: relative;
        }
        
        .corporation-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(3, 199, 90, 0.15);
            border-color: var(--primary-green);
        }
        
        .corp-logo-container {
            position: relative;
            height: 120px;
            background: linear-gradient(135deg, var(--secondary-green) 0%, #F8FFF8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .corp-logo {
            max-width: 80px;
            max-height: 80px;
            object-fit: contain;
            border-radius: 12px;
            background: white;
            padding: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        
        .corporation-card:hover .corp-logo {
            transform: scale(1.05);
        }
        
        .default-corp-logo {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .corp-content {
            padding: 24px;
        }
        
        .corp-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 12px;
            line-height: 1.3;
        }
        
        .corp-info {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .corp-badge {
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
        
        .badge-domestic {
            background: var(--secondary-green);
            color: var(--primary-green-dark);
        }
        
        .badge-overseas {
            background: #E3F2FD;
            color: #1976D2;
        }
        
        
        .corp-stats {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .corp-articles-count {
            font-size: 0.9rem;
            color: var(--text-light);
            font-weight: 600;
        }
        
        .corp-date {
            font-size: 0.8rem;
            color: var(--text-light);
        }
        
        .corp-card-link {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
        }
        
        .corp-content > * {
            position: relative;
            z-index: 2;
        }
        
        .search-section {
            background: var(--white);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;
            border: 2px solid var(--border-light);
        }
        
        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .stat-card {
            background: var(--white);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
        }
        
        .stat-number {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary-green);
            display: block;
            margin-bottom: 4px;
        }
        
        .stat-label {
            color: var(--text-light);
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .corp-title {
                font-size: 2rem;
            }
            
            .corp-subtitle {
                font-size: 1.1rem;
            }
            
            .corp-hero {
                padding: 32px 20px;
            }
            
            .corporation-card {
                margin-bottom: 16px;
            }
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <!-- Hero Section -->
        <div class="corp-hero">
            <div class="corp-hero-content">
                <h1 class="corp-title">
                    <i class="fas fa-heart me-3" style="color: var(--primary-green);"></i>
                    구독 블로그
                </h1>
                <p class="corp-subtitle">
                    Small Town에서 큐레이션하는<br>
                    국내외 주요 기업들의 기술 블로그
                </p>
            </div>
        </div>

        <!-- Stats Section -->
        <div class="stats-section">
            <div class="stat-card">
                <span class="stat-number" th:text="${totalCorporations}">0</span>
                <div class="stat-label">구독 중인 기업</div>
            </div>
            <div class="stat-card">
                <span class="stat-number" th:text="${domesticCount}">0</span>
                <div class="stat-label">국내 기업</div>
            </div>
            <div class="stat-card">
                <span class="stat-number" th:text="${overseasCount}">0</span>
                <div class="stat-label">해외 기업</div>
            </div>
            <div class="stat-card">
                <span class="stat-number" th:text="${totalArticles}">0</span>
                <div class="stat-label">총 블로그 글</div>
            </div>
        </div>

        <!-- Search Section -->
        <div class="search-section">
            <form method="get" action="">
                <div class="row g-3 align-items-end">
                    <div class="col-md-8">
                        <label for="searchKeyword" class="form-label fw-bold">기업 검색</label>
                        <div class="input-group">
                            <span class="input-group-text" style="background: var(--secondary-green); border: 2px solid var(--border-light); color: var(--primary-green-dark);">
                                <i class="fas fa-search"></i>
                            </span>
                            <input type="text" name="search" class="form-control" id="searchKeyword" 
                                   placeholder="기업명으로 검색..." th:value="${currentSearch}" style="border-left: none;">
                        </div>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-search me-2"></i>검색
                        </button>
                    </div>
                    <div class="col-md-2">
                        <a th:href="@{/corporations}" class="btn btn-secondary w-100">
                            <i class="fas fa-refresh me-2"></i>전체
                        </a>
                    </div>
                </div>
            </form>
        </div>

        <!-- Corporations Grid -->
        <div class="row g-4" th:if="${!corporations.content.isEmpty()}">
            <div class="col-lg-4 col-md-6" th:each="corp : ${corporations.content}">
                <div class="corporation-card">
                    <a th:href="@{/corporations/{id}(id=${corp.id})}" class="corp-card-link"></a>
                    
                    <!-- Logo Section -->
                    <div class="corp-logo-container">
                        <img th:if="${corp.effectiveLogoUrl != null}" 
                             th:src="${corp.effectiveLogoUrl}" 
                             th:alt="${corp.name}"
                             class="corp-logo">
                        <div th:unless="${corp.effectiveLogoUrl != null}" class="default-corp-logo">
                            <i class="fas fa-building fa-2x" style="color: var(--primary-green);"></i>
                        </div>
                    </div>
                    
                    <!-- Content Section -->
                    <div class="corp-content">
                        <h3 class="corp-name" th:text="${corp.name}">Company Name</h3>
                        
                        <!-- Info Badges -->
                        <div class="corp-info">
                            <span class="corp-badge" 
                                  th:class="${corp.isDomestic != null && corp.isDomestic} ? 'corp-badge badge-domestic' : 'corp-badge badge-overseas'"
                                  th:text="${corp.regionText}">지역</span>
                            <span class="corp-badge" style="background: #F3E5F5; color: #7B1FA2;" 
                                  th:if="${corp.industries != null && !corp.industries.isEmpty()}"
                                  th:text="${corp.industries.size() == 1 ? corp.industries[0] : corp.industries[0] + ' 외 ' + (corp.industries.size() - 1) + '개'}">업종</span>
                        </div>
                        
                        
                        <!-- Stats -->
                        <div class="corp-stats">
                            <span class="corp-articles-count">
                                <i class="fas fa-newspaper me-1"></i>
                                블로그 글 <strong th:text="${corp.articleCount ?: 0}">0</strong>개
                            </span>
                            <span class="corp-date" th:text="'등록: ' + ${#temporals.format(corp.createdAt, 'MM.dd')}">등록: 01.01</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${corporations.content.isEmpty()}" class="text-center py-5">
            <div class="hero-section">
                <i class="fas fa-search fa-4x mb-4" style="color: var(--primary-green); opacity: 0.5;" th:if="${currentSearch != null && !currentSearch.isEmpty()}"></i>
                <i class="fas fa-building fa-4x mb-4" style="color: var(--primary-green); opacity: 0.5;" th:unless="${currentSearch != null && !currentSearch.isEmpty()}"></i>
                
                <h4 class="mb-3" style="color: var(--text-dark); font-weight: 700;" th:if="${currentSearch != null && !currentSearch.isEmpty()}">
                    '<span th:text="${currentSearch}"></span>' 검색 결과가 없어요
                </h4>
                <h4 class="mb-3" style="color: var(--text-dark); font-weight: 700;" th:unless="${currentSearch != null && !currentSearch.isEmpty()}">
                    등록된 기업이 없어요
                </h4>
                
                <p class="text-muted mb-4" th:if="${currentSearch != null && !currentSearch.isEmpty()}">
                    다른 키워드로 검색하거나 <a th:href="@{/corporations}" class="text-decoration-none">전체 기업 목록</a>을 확인해보세요.
                </p>
                <p class="text-muted mb-4" th:unless="${currentSearch != null && !currentSearch.isEmpty()}">
                    새로운 기업이 곧 추가될 예정입니다.
                </p>
            </div>
        </div>

        <!-- Pagination -->
        <nav th:if="${totalPages > 1}" class="mt-5">
            <ul class="pagination justify-content-center">
                <!-- Previous Button -->
                <li class="page-item" th:class="${!hasPrevious} ? 'page-item disabled' : 'page-item'">
                    <a class="page-link" 
                       th:href="@{/corporations(page=${currentPage - 1}, search=${currentSearch})}">
                        <i class="fas fa-chevron-left me-1"></i>이전
                    </a>
                </li>
                
                <!-- Page Numbers -->
                <li class="page-item" 
                    th:each="pageNum : ${#numbers.sequence(0, T(java.lang.Math).min(totalPages - 1, 4))}"
                    th:class="${pageNum == currentPage} ? 'page-item active' : 'page-item'">
                    <a class="page-link" 
                       th:href="@{/corporations(page=${pageNum}, search=${currentSearch})}"
                       th:text="${pageNum + 1}">1</a>
                </li>
                
                <!-- Next Button -->
                <li class="page-item" th:class="${!hasNext} ? 'page-item disabled' : 'page-item'">
                    <a class="page-link" 
                       th:href="@{/corporations(page=${currentPage + 1}, search=${currentSearch})}">
                        다음<i class="fas fa-chevron-right ms-1"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <script layout:fragment="scripts">
        // 카드 클릭 시 상세 페이지로 이동
        document.querySelectorAll('.corporation-card').forEach(card => {
            card.addEventListener('click', function(e) {
                const cardLink = this.querySelector('.corp-card-link');
                if (cardLink) {
                    window.location.href = cardLink.href;
                }
            });
            
            // 카드에 커서 스타일 추가
            card.style.cursor = 'pointer';
        });
        
        // 검색 폼 개선
        document.getElementById('searchKeyword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                this.form.submit();
            }
        });
    </script>
</body>
</html>
