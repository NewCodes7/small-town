<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="'NewCodes - 구독 기업'">구독 기업</title>
    <th:block layout:fragment="meta" th:remove="tag">
        <meta name="description" content="NewCodes에서 구독하는 국내외 주요 기술 기업 목록입니다. 관심 있는 기업의 최신 소식을 확인해보세요.">
        <meta name="keywords" content="구독 블로그, 기술 기업, IT 기업, 블로그 목록, NewCodes, 네이버, 카카오, 구글, 넷플릭스">
        <meta name="robots" content="index, follow">
    </th:block>
    <link rel="stylesheet" type="text/css" th:href="@{/css/corporations.css}">
</head>
<body>
    <div layout:fragment="content">
        <!-- Hero Section -->
        <div class="corp-hero">
            <div class="corp-hero-content">
                <h1 class="corp-title">
                    <i class="fas fa-heart me-3" style="color: var(--primary-green);"></i>
                    구독 기업
                </h1>
            </div>
        </div>

        <!-- Stats Section -->
        <div class="stats-section">
            <div class="stat-card">
                <span class="stat-number" th:text="${totalCorporations}">0</span>
                <div class="stat-label">구독 중인 기업</div>
            </div>
            <!-- <div class="stat-card">
                <span class="stat-number" th:text="${domesticCount}">0</span>
                <div class="stat-label">국내 기업</div>
            </div>
            <div class="stat-card">
                <span class="stat-number" th:text="${overseasCount}">0</span>
                <div class="stat-label">해외 기업</div>
            </div> -->
            <div class="stat-card">
                <span class="stat-number" th:text="${totalArticles}">0</span>
                <div class="stat-label">총 블로그 수</div>
            </div>
            <div class="stat-card">
                <span class="stat-number" th:text="${totalVideos}">0</span>
                <div class="stat-label">총 유튜브 수</div>
            </div>
        </div>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-row">
                <!-- Filter Toggle -->
                <div class="filter-toggle-container">
                    <a th:href="@{/corporations(search=${currentSearch}, filter='all', industries=${selectedIndustries})}"
                       th:class="${currentFilter == 'all' || currentFilter == null} ? 'filter-toggle-btn active' : 'filter-toggle-btn'">
                        <i class="fas fa-th-large me-1"></i>전체
                    </a>
                    <a th:href="@{/corporations(search=${currentSearch}, filter='blog', industries=${selectedIndustries})}"
                       th:class="${currentFilter == 'blog'} ? 'filter-toggle-btn active' : 'filter-toggle-btn'">
                        <i class="fas fa-blog me-1"></i>블로그
                    </a>
                    <a th:href="@{/corporations(search=${currentSearch}, filter='youtube', industries=${selectedIndustries})}"
                       th:class="${currentFilter == 'youtube'} ? 'filter-toggle-btn active' : 'filter-toggle-btn'">
                        <i class="fab fa-youtube me-1"></i>유튜브
                    </a>
                </div>

                <!-- Industry Filter Dropdown -->
                <div class="industry-filter-dropdown">
                    <button class="filter-toggle-btn industry-filter-btn" type="button" id="industryDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-industry me-1"></i>
                        <span>카테고리</span>
                        <i class="fas fa-chevron-down ms-1" style="font-size: 0.7rem;"></i>
                    </button>
                    <ul class="dropdown-menu modern-dropdown" aria-labelledby="industryDropdown" id="industryDropdownMenu">
                        <th:block th:each="industry : ${allIndustries}">
                            <li>
                                <div class="dropdown-item category-item">
                                    <input type="checkbox"
                                           class="category-checkbox"
                                           th:id="'industry-' + ${industry.id}"
                                           th:value="${industry.id}"
                                           th:checked="${selectedIndustries != null && selectedIndustries.contains(industry.id)}">
                                    <label th:for="'industry-' + ${industry.id}"
                                           class="category-label">
                                        <span class="category-name" th:text="${industry.name}">Industry Name</span>
                                    </label>
                                </div>
                            </li>
                        </th:block>
                    </ul>
                </div>

                <!-- Search Form -->
                <form method="get" action="" class="search-form-inline">
                    <input type="hidden" name="filter" th:value="${currentFilter}">
                    <th:block th:if="${selectedIndustries != null}" th:each="industryId : ${selectedIndustries}">
                        <input type="hidden" name="industries" th:value="${industryId}">
                    </th:block>
                    <div class="input-group">
                        <span class="input-group-text" style="background: var(--secondary-green); border: 2px solid var(--border-light); color: var(--primary-green-dark);">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="text" name="search" class="form-control" id="searchKeyword"
                               placeholder="기업명으로 검색..." th:value="${currentSearch}" style="border-left: none;">
                        <button type="submit" class="btn btn-primary">
                            검색
                        </button>
                    </div>
                </form>
            </div>

            <!-- Selected Industries Row -->
            <div class="selected-categories-row" id="selectedIndustriesGroup" th:style="${selectedIndustries != null && !selectedIndustries.isEmpty()} ? '' : 'display: none;'">
                <div id="selectedIndustriesList" class="selected-categories-inline">
                    <th:block th:if="${selectedIndustries != null}" th:each="industryId : ${selectedIndustries}">
                        <th:block th:each="industry : ${allIndustries}">
                            <span th:if="${industry.id == industryId}" class="selected-category-block" th:attr="data-industry-id=${industryId}">
                                <span th:text="${industry.name}">Industry</span>
                                <button type="button" class="remove-category-btn" th:onclick="'removeIndustry(' + ${industryId} + ')'">&times;</button>
                            </span>
                        </th:block>
                    </th:block>
                </div>
            </div>
        </div>

        <!-- Corporations Grid -->
        <div class="row g-4" th:if="${!corporations.content.isEmpty()}">
            <div class="col-lg-4 col-md-6" th:each="corp : ${corporations.content}">
                <div class="corporation-card">
                    <a th:href="@{/corporations/{id}(id=${corp.id})}" class="corp-card-link"></a>

                    <!-- Logo Section -->
                    <div class="corp-logo-container">
                        <img th:if="${corp.effectiveLogoUrl != null}"
                             th:src="${corp.effectiveLogoUrl}"
                             th:alt="${corp.name}"
                             class="corp-logo">
                        <div th:unless="${corp.effectiveLogoUrl != null}" class="default-corp-logo">
                            <i class="fas fa-building fa-2x" style="color: var(--primary-green);"></i>
                        </div>
                    </div>

                    <!-- Content Section -->
                    <div class="corp-content">
                        <h3 class="corp-name" th:text="${corp.name}">Company Name</h3>

                        <!-- Industry Tags -->
                        <div class="industry-tags" th:if="${corp.industries != null && !corp.industries.isEmpty()}">
                            <th:block th:each="industry, iterStat : ${corp.industries}">
                                <th:block th:if="${iterStat.index < 3}">
                                    <th:block th:each="allInd, allIterStat : ${allIndustries}">
                                        <span th:if="${allInd.name == industry}"
                                              class="industry-tag"
                                              th:text="${industry}"
                                              th:attr="data-industry=${industry}, data-color-index=${(allIterStat.index % 10) + 1}">Industry</span>
                                    </th:block>
                                </th:block>
                            </th:block>
                            <span class="industry-tag more-tag"
                                  th:if="${corp.industries.size() > 3}"
                                  th:text="'+' + ${corp.industries.size() - 3}">+2</span>
                        </div>

                        <!-- Admin Edit Button -->
                        <div class="admin-control-panel d-none mt-3">
                            <button class="btn btn-sm btn-outline-primary admin-edit-btn w-100"
                                    th:data-corp-id="${corp.id}"
                                    th:data-corp-name="${corp.name}"
                                    th:data-industries="${corp.industries != null ? #strings.listJoin(corp.industries, ','): ''}"
                                    onclick="openIndustryEditModalFromButton(this)">
                                <i class="fas fa-edit me-1"></i>Industry 수정
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Industry Edit Modal -->
        <div class="modal fade" id="industryEditModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">
                            <i class="fas fa-industry me-2"></i>
                            <span id="modalCorporationName"></span> - Industry 수정
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div id="industryCheckboxes" class="mb-3">
                            <!-- Industry 체크박스가 동적으로 생성됩니다 -->
                        </div>

                        <hr>

                        <div class="mt-3">
                            <label class="form-label fw-bold">
                                <i class="fas fa-plus-circle me-1"></i>새 Industry 추가
                            </label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="newIndustryName"
                                       placeholder="예: AI, 블록체인, 헬스케어...">
                                <button class="btn btn-success" type="button" onclick="addNewIndustry()">
                                    <i class="fas fa-plus me-1"></i>추가
                                </button>
                            </div>
                            <small class="text-muted">존재하지 않는 업종을 직접 추가할 수 있습니다.</small>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                        <button type="button" class="btn btn-primary" onclick="saveIndustries()">
                            <i class="fas fa-save me-1"></i>저장
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${corporations.content.isEmpty()}" class="text-center py-5">
            <div class="hero-section">
                <i class="fas fa-search fa-4x mb-4" style="color: var(--primary-green); opacity: 0.5;" th:if="${currentSearch != null && !currentSearch.isEmpty()}"></i>
                <i class="fas fa-building fa-4x mb-4" style="color: var(--primary-green); opacity: 0.5;" th:unless="${currentSearch != null && !currentSearch.isEmpty()}"></i>
                
                <h4 class="mb-3" style="color: var(--text-dark); font-weight: 700;" th:if="${currentSearch != null && !currentSearch.isEmpty()}">
                    '<span th:text="${currentSearch}"></span>' 검색 결과가 없어요
                </h4>
                <h4 class="mb-3" style="color: var(--text-dark); font-weight: 700;" th:unless="${currentSearch != null && !currentSearch.isEmpty()}">
                    등록된 기업이 없어요
                </h4>
                
                <p class="text-muted mb-4" th:if="${currentSearch != null && !currentSearch.isEmpty()}">
                    다른 키워드로 검색하거나 <a th:href="@{/corporations}" class="text-decoration-none">전체 기업 목록</a>을 확인해보세요.
                </p>
                <p class="text-muted mb-4" th:unless="${currentSearch != null && !currentSearch.isEmpty()}">
                    새로운 기업이 곧 추가될 예정입니다.
                </p>
            </div>
        </div>

        <!-- Pagination -->
        <nav th:if="${totalPages > 1}" class="mt-5">
            <ul class="pagination justify-content-center">
                <!-- Previous Button -->
                <li class="page-item" th:class="${!hasPrevious} ? 'page-item disabled' : 'page-item'">
                    <a class="page-link"
                       th:href="@{/corporations(page=${currentPage - 1}, search=${currentSearch}, filter=${currentFilter}, industries=${selectedIndustries})}">
                        <i class="fas fa-chevron-left me-1"></i>이전
                    </a>
                </li>

                <!-- Page Numbers -->
                <li class="page-item"
                    th:each="pageNum : ${#numbers.sequence(0, T(java.lang.Math).min(totalPages - 1, 4))}"
                    th:class="${pageNum == currentPage} ? 'page-item active' : 'page-item'">
                    <a class="page-link"
                       th:href="@{/corporations(page=${pageNum}, search=${currentSearch}, filter=${currentFilter}, industries=${selectedIndustries})}"
                       th:text="${pageNum + 1}">1</a>
                </li>

                <!-- Next Button -->
                <li class="page-item" th:class="${!hasNext} ? 'page-item disabled' : 'page-item'">
                    <a class="page-link"
                       th:href="@{/corporations(page=${currentPage + 1}, search=${currentSearch}, filter=${currentFilter}, industries=${selectedIndustries})}">
                        다음<i class="fas fa-chevron-right ms-1"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <div layout:fragment="scripts">
        <script th:src="@{/js/userAuth.js}"></script>
        <script th:src="@{/js/corporations.js}"></script>
    </div>
</body>
</html>
