<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">

<div layout:fragment="content">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 60vh;">
        <div class="text-center">
            <div class="error-icon mb-4">
                <i class="fas fa-hourglass-half" style="font-size: 6rem; color: var(--primary-green); opacity: 0.3;"></i>
            </div>
            
            <h1 class="display-4 fw-bold text-dark mb-3">429</h1>
            <h2 class="h4 mb-4" style="color: var(--text-light);">너무 많은 요청입니다</h2>
            
            <div class="mb-4">
                <p class="text-muted" th:text="${message ?: '요청이 너무 많습니다. 잠시 후 다시 시도해주세요.'}"></p>
                <p class="text-muted">잠시 기다린 후 다시 접속해주세요.</p>
            </div>
            
            <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
                <a th:href="@{/}" class="btn btn-primary">
                    <i class="fas fa-home me-2"></i>홈으로 돌아가기
                </a>
                <button onclick="location.reload()" class="btn btn-secondary">
                    <i class="fas fa-redo me-2"></i>다시 시도
                </button>
            </div>
            
            <div class="mt-5">
                <small class="text-muted">
                    <span th:if="${timestamp}">발생 시간: <span th:text="${#temporals.format(timestamp, 'yyyy-MM-dd HH:mm:ss')}"></span></span>
                </small>
            </div>
        </div>
    </div>
</div>

</html>
