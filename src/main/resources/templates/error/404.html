<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">

<div layout:fragment="content">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 60vh;">
        <div class="text-center">
            <div class="error-icon mb-4">
                <i class="fas fa-search" style="font-size: 6rem; color: var(--primary-green); opacity: 0.3;"></i>
            </div>
            
            <h1 class="display-4 fw-bold text-dark mb-3">404</h1>
            <h2 class="h4 mb-4" style="color: var(--text-light);">페이지를 찾을 수 없습니다</h2>
            
            <div class="mb-4">
                <p class="text-muted">요청하신 페이지가 존재하지 않거나 이동되었을 수 있습니다.</p>
                <p class="text-muted">URL을 다시 확인해주세요.</p>
            </div>
            
            <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
                <a th:href="@{/}" class="btn btn-primary">
                    <i class="fas fa-home me-2"></i>홈으로 돌아가기
                </a>
                <button onclick="history.back()" class="btn btn-secondary">
                    <i class="fas fa-arrow-left me-2"></i>이전 페이지
                </button>
            </div>
            
            <div class="mt-5">
                <small class="text-muted">
                    문제가 지속되면 관리자에게 문의해주세요.
                </small>
            </div>
        </div>
    </div>
</div>

</html>
