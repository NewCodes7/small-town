<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">

<div layout:fragment="content">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 60vh;">
        <div class="text-center">
            <div class="error-icon mb-4">
                <i class="fas fa-lock" style="font-size: 6rem; color: #ffc107; opacity: 0.3;"></i>
            </div>
            
            <h1 class="display-4 fw-bold text-dark mb-3">403</h1>
            <h2 class="h4 mb-4" style="color: var(--text-light);">접근 권한이 없습니다</h2>
            
            <div class="mb-4">
                <p class="text-muted">이 페이지에 접근할 권한이 없습니다.</p>
                <p class="text-muted">로그인이 필요하거나 관리자 권한이 필요할 수 있습니다.</p>
            </div>
            
            <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
                <a th:href="@{/}" class="btn btn-primary">
                    <i class="fas fa-home me-2"></i>홈으로 돌아가기
                </a>
                <a th:href="@{/auth/login}" class="btn btn-secondary">
                    <i class="fas fa-sign-in-alt me-2"></i>로그인
                </a>
            </div>
            
            <div class="mt-5">
                <small class="text-muted">
                    접근 권한이 필요한 경우 관리자에게 문의해주세요.
                </small>
            </div>
        </div>
    </div>
</div>

</html>
