<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">

<div layout:fragment="content">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 60vh;">
        <div class="text-center">
            <div class="error-icon mb-4">
                <i class="fas fa-bug" style="font-size: 6rem; color: var(--text-light); opacity: 0.3;"></i>
            </div>
            
            <h1 class="display-4 fw-bold text-dark mb-3" th:text="${status ?: '오류'}">오류</h1>
            <h2 class="h4 mb-4" style="color: var(--text-light);" th:text="${error ?: '문제가 발생했습니다'}">문제가 발생했습니다</h2>
            
            <div class="mb-4" th:if="${message}">
                <div class="alert alert-danger" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span th:text="${message}">오류 메시지</span>
                </div>
            </div>
            
            <div class="mb-4" th:unless="${message}">
                <p class="text-muted">예상치 못한 오류가 발생했습니다.</p>
                <p class="text-muted">잠시 후 다시 시도해주세요.</p>
            </div>
            
            <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
                <a th:href="@{/}" class="btn btn-primary">
                    <i class="fas fa-home me-2"></i>홈으로 돌아가기
                </a>
                <button onclick="history.back()" class="btn btn-secondary">
                    <i class="fas fa-arrow-left me-2"></i>이전 페이지
                </button>
            </div>
            
            <div class="mt-5" th:if="${timestamp}">
                <small class="text-muted">
                    오류 발생 시간: <span th:text="${#temporals.format(timestamp, 'yyyy-MM-dd HH:mm:ss')}"></span>
                </small>
            </div>
            
            <div class="mt-2">
                <small class="text-muted">
                    문제가 지속되면 관리자에게 문의해주세요.
                </small>
            </div>
        </div>
    </div>
</div>

</html>
