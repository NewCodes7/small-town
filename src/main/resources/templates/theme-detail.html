<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="${theme.name} + ' - NewCodes'">테마 상세</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/default-thumbnail.css}">
    <style>
        :root {
            --primary-green: #03C75A;
            --secondary-green: #E8F7EF;
            --text-dark: #1F2937;
            --text-light: #6B7280;
            --border-light: #E5E7EB;
            --bg-light: #F9FAFB;
        }

        .theme-detail-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        /* Theme Header */
        .theme-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .theme-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 16px;
        }

        .theme-description {
            font-size: 1.1rem;
            color: var(--text-light);
            max-width: 800px;
            margin: 0 auto 24px;
            line-height: 1.6;
        }

        .theme-stats {
            display: flex;
            gap: 24px;
            justify-content: center;
            align-items: center;
        }

        .theme-stat {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            color: var(--text-light);
        }

        .theme-stat i {
            color: var(--primary-green);
        }

        .theme-stat-value {
            font-weight: 700;
            color: var(--text-dark);
        }

        /* Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 300px));
            gap: 20px;
            justify-content: center;
        }

        .content-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--border-light);
            transition: all 0.3s ease;
            box-shadow: 0 2px 12px rgba(3, 199, 90, 0.08);
            display: flex;
            flex-direction: column;
        }

        .content-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(3, 199, 90, 0.15);
            border-color: var(--primary-green);
        }

        .content-thumbnail {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, var(--secondary-green) 0%, #F0F8F0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Default thumbnail styles moved to default-thumbnail.css */

        .content-type-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .badge-article {
            color: #2563EB;
        }

        .badge-video {
            color: #DC2626;
        }

        .content-body {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .content-company {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
        }

        .content-company-link {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: inherit;
            transition: opacity 0.2s ease;
        }

        .content-company-link:hover {
            opacity: 0.7;
        }

        .content-company-logo {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            object-fit: contain;
            background: white;
            border: 1px solid var(--border-light);
        }

        .content-company-name {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--primary-green);
        }

        .content-title-link {
            text-decoration: none;
            color: inherit;
        }

        .content-title-link:hover .content-title {
            color: var(--primary-green);
        }

        .content-title {
            font-size: 1.0rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 10px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 3.8rem;
            transition: color 0.2s ease;
        }

        .content-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid var(--border-light);
        }

        .content-date {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .content-date i {
            font-size: 0.75rem;
        }

        .like-button {
            display: flex;
            align-items: center;
            gap: 5px;
            background: transparent;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.2s ease;
            margin-left: auto;
        }

        .like-button:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .like-button.liked {
            color: #ef4444;
        }

        .like-button.liked .like-icon {
            color: #ef4444;
        }

        .like-icon {
            transition: all 0.2s ease;
        }

        .like-count {
            display: none;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--primary-green);
            opacity: 0.3;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            color: var(--text-dark);
            margin-bottom: 12px;
        }

        .empty-state p {
            color: var(--text-light);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .content-grid {
                grid-template-columns: repeat(3, minmax(0, 300px));
            }
        }

        @media (max-width: 768px) {
            .theme-title {
                font-size: 2rem;
            }

            .content-grid {
                grid-template-columns: repeat(2, minmax(0, 300px));
            }
        }

        @media (max-width: 480px) {
            .theme-title {
                font-size: 1.5rem;
            }

            .content-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div class="theme-detail-container" th:attr="data-theme-id=${theme.id}">
            <!-- Theme Header -->
            <div class="theme-header">
                <h1 class="theme-title" th:text="${theme.name}">테마 제목</h1>
                <p class="theme-description" th:text="${theme.description}">테마 설명</p>
            </div>

            <!-- Content Grid -->
            <div th:if="${theme.contents != null and !theme.contents.isEmpty()}" class="content-grid">
                <div th:each="content : ${theme.contents}" class="content-card"
                     th:attr="data-detail-url=${content.contentType == 'article' ? content.article.detailUrl : 'https://www.youtube.com/watch?v=' + content.video.videoId},
                              data-content-type=${content.contentType},
                              data-article-id=${content.contentType == 'article' ? content.article.id : null},
                              data-source=${content.contentType == 'article' ? 'THEME_ARTICLES' : null},
                              data-source-context-id=${content.contentType == 'article' ? theme.id : null}"
                     th:onclick="${content.contentType == 'article'} ? 'window.location.href=this.getAttribute(\'data-detail-url\')' : 'window.open(this.getAttribute(\'data-detail-url\'), \'_blank\')'"
                     style="cursor: pointer;">
                    <!-- Thumbnail -->
                    <div>
                        <!-- Article with thumbnail -->
                        <div th:if="${content.contentType == 'article' and content.article.thumbnailImage != null and !content.article.thumbnailImage.isEmpty()}"
                             class="content-thumbnail"
                             th:style="'background-image: url(' + ${content.article.thumbnailImage} + '); background-size: cover; background-position: center;'">
                        </div>
                        <!-- Article without thumbnail -->
                        <div th:if="${content.contentType == 'article' and (content.article.thumbnailImage == null or content.article.thumbnailImage.isEmpty())}"
                             class="content-thumbnail default-thumbnail">
                            <div class="default-thumbnail-content">
                                <i class="fas fa-code"></i>
                                <div class="thumbnail-pattern"></div>
                            </div>
                        </div>
                        <!-- Video with thumbnail -->
                        <div th:if="${content.contentType == 'video' and content.video.thumbnailUrl != null and !content.video.thumbnailUrl.isEmpty()}"
                             class="content-thumbnail"
                             th:style="'background-image: url(' + ${content.video.thumbnailUrl} + '); background-size: cover; background-position: center;'">
                        </div>
                        <!-- Video without thumbnail -->
                        <div th:if="${content.contentType == 'video' and (content.video.thumbnailUrl == null or content.video.thumbnailUrl.isEmpty())}"
                             class="content-thumbnail default-thumbnail">
                            <div class="default-thumbnail-content">
                                <i class="fab fa-youtube"></i>
                                <div class="thumbnail-pattern"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Content Body -->
                    <div class="content-body">
                        <!-- Company -->
                        <div class="content-company">
                            <a th:href="@{/corporations/{id}(id=${content.contentType == 'article' ? content.article.corporation.id : content.video.corporation.id})}"
                               class="content-company-link"
                               onclick="event.stopPropagation()">
                                <img th:if="${content.contentType == 'article' ? content.article.corporation.effectiveLogoUrl != null : content.video.corporation.effectiveLogoUrl != null}"
                                     th:src="${content.contentType == 'article' ? content.article.corporation.effectiveLogoUrl : content.video.corporation.effectiveLogoUrl}"
                                     th:alt="${content.contentType == 'article' ? content.article.corporation.name : content.video.corporation.name}"
                                     class="content-company-logo">
                                <span class="content-company-name"
                                      th:text="${content.contentType == 'article' ? content.article.corporation.name : content.video.corporation.name}">회사명</span>
                            </a>
                        </div>

                        <!-- Title -->
                        <h3 class="content-title"
                            th:text="${content.contentType == 'article'
                                      ? (content.article.translatedTitle != null ? content.article.translatedTitle : content.article.title)
                                      : (content.video.translatedTitle != null ? content.video.translatedTitle : content.video.title)}">
                            컨텐츠 제목
                        </h3>

                        <!-- Meta -->
                        <div class="content-meta">
                            <span class="content-date">
                                <i class="far fa-clock"></i>
                                <span th:text="${content.contentType == 'article'
                                              ? #strings.replace(#strings.substring(content.article.publishedAt, 0, 10), '-', '.')
                                              : #strings.replace(#strings.substring(content.video.publishedAt, 0, 10), '-', '.')}">날짜</span>
                            </span>
                            <button class="like-button"
                                    th:attr="data-content-type=${content.contentType},
                                             data-article-id=${content.contentType == 'article' ? content.article.id : null},
                                             data-video-id=${content.contentType == 'video' ? content.video.id : null}"
                                    onclick="event.stopPropagation(); toggleLike(this, event)">
                                <i class="far fa-heart like-icon"></i>
                                <span class="like-count" th:text="${content.contentType == 'article' ? content.article.likeCount : content.video.likeCount}">0</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${theme.contents == null or theme.contents.isEmpty()}" class="empty-state">
                <i class="fas fa-inbox"></i>
                <h3>등록된 컨텐츠가 없습니다</h3>
                <p>이 테마에는 아직 추가된 글이나 영상이 없습니다.</p>
            </div>
        </div>
    </div>

    <!-- 테마 조회수 증가 스크립트 -->
    <div layout:fragment="scripts">
        <script th:src="@{/js/themeView.js}"></script>
    </div>

    <script th:inline="javascript">
        // 좋아요 토글 함수
        async function toggleLike(button, event) {
            event.preventDefault();
            event.stopPropagation();

            const contentType = button.getAttribute('data-content-type');
            const articleId = button.getAttribute('data-article-id');
            const videoId = button.getAttribute('data-video-id');

            const endpoint = contentType === 'article'
                ? `/api/articles/${articleId}/like`
                : `/api/videos/${videoId}/like`;

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    const likeCountSpan = button.querySelector('.like-count');
                    const likeIcon = button.querySelector('.like-icon');

                    likeCountSpan.textContent = data.likeCount;

                    if (data.isLiked) {
                        button.classList.add('liked');
                        likeIcon.classList.remove('far');
                        likeIcon.classList.add('fas');
                    } else {
                        button.classList.remove('liked');
                        likeIcon.classList.remove('fas');
                        likeIcon.classList.add('far');
                    }
                } else if (response.status === 401) {
                    alert('좋아요를 하려면 로그인이 필요합니다.');
                }
            } catch (error) {
                console.error('좋아요 처리 실패:', error);
            }
        }

        // 좋아요 상태 로드
        async function loadLikeStatuses() {
            const likeButtons = document.querySelectorAll('.like-button');

            for (const button of likeButtons) {
                const contentType = button.getAttribute('data-content-type');
                const articleId = button.getAttribute('data-article-id');
                const videoId = button.getAttribute('data-video-id');

                const endpoint = contentType === 'article'
                    ? `/api/articles/${articleId}/like-status`
                    : `/api/videos/${videoId}/like-status`;

                try {
                    const response = await fetch(endpoint);
                    if (response.ok) {
                        const data = await response.json();
                        const likeIcon = button.querySelector('.like-icon');

                        if (data.isLiked) {
                            button.classList.add('liked');
                            likeIcon.classList.remove('far');
                            likeIcon.classList.add('fas');
                        }
                    }
                } catch (error) {
                    console.error('좋아요 상태 로드 실패:', error);
                }
            }
        }

        // 페이지 로드 시 좋아요 상태 로드
        document.addEventListener('DOMContentLoaded', function() {
            loadLikeStatuses();
        });
    </script>
</body>
</html>
