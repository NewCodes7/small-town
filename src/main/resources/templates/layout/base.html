        /* YouTube NEW Badge - Speech Bubble Styles */
        .youtube-new-badge {
            position: absolute;
            top: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(34, 197, 94, 0.35);
            z-index: 1000;
            min-width: 140px;
            animation: badgePulse 2s ease-in-out infinite;
        }

        /* Speech bubble tail (pointing up to the nav link) */
        .youtube-new-badge::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 10px solid #22c55e;
            filter: drop-shadow(0 -2px 3px rgba(34, 197, 94, 0.15));
        }

        .youtube-new-badge .badge-close {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            transition: all 0.2s ease;
            color: white;
            font-size: 10px;
        }

        .youtube-new-badge .badge-close:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.1);
        }

        .youtube-new-badge .badge-close i {
            font-size: 9px;
        }

        .youtube-new-badge .badge-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-align: center;
        }

        .youtube-new-badge .badge-emoji {
            font-size: 20px;
            line-height: 1;
            animation: emojiFloat 2s ease-in-out infinite;
        }

        .youtube-new-badge .badge-text {
            line-height: 1.4;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        /* Badge pulse animation */
        @keyframes badgePulse {
            0%, 100% {
                box-shadow: 0 8px 24px rgba(34, 197, 94, 0.35);
            }
            50% {
                box-shadow: 0 10px 32px rgba(34, 197, 94, 0.5);
            }
        }

        /* Emoji float animation */
        @keyframes emojiFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        /* Badge slide in animation */
        @keyframes badgeSlideIn {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(-10px) scale(0.9);
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }

        .youtube-new-badge.badge-show {
            animation: badgeSlideIn 0.5s ease-out, badgePulse 2s ease-in-out 0.5s infinite;
        }

        /* Badge fade out animation */
        @keyframes badgeFadeOut {
            0% {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-10px) scale(0.9);
            }
        }

        .youtube-new-badge.badge-hide {
            animation: badgeFadeOut 0.3s ease-out forwards;
        }

        /* 모바일 대응 - 네비게이션이 항상 표시되므로 배지는 아래로 */
        @media (max-width: 768px) {
            .youtube-new-badge {
                top: calc(100% + 8px);
                left: 50%;
                transform: translateX(-50%);
                min-width: 110px;
                padding: 8px 12px;
            }

            /* Mobile: tail points up */
            .youtube-new-badge::before {
                top: -7px;
                left: 50%;
                transform: translateX(-50%);
                border-left: 8px solid transparent;
                border-right: 8px solid transparent;
                border-bottom: 8px solid #22c55e;
                border-top: 0;
            }

            .youtube-new-badge.badge-show {
                animation: badgeSlideIn 0.5s ease-out, badgePulse 2s ease-in-out 0.5s infinite;
            }

            .youtube-new-badge.badge-hide {
                animation: badgeFadeOut 0.3s ease-out forwards;
            }

            .youtube-new-badge .badge-emoji {
                font-size: 16px;
            }

            .youtube-new-badge .badge-text {
                font-size: 10px;
            }

            .youtube-new-badge .badge-close {
                width: 16px;
                height: 16px;
            }
        }

        @media (max-width: 576px) {
            .youtube-new-badge {
                min-width: 100px;
                padding: 6px 10px;
            }

            .youtube-new-badge .badge-emoji {

            }

            .youtube-new-badge .badge-text {
                font-size: 9px;
            }

            .youtube-new-badge .badge-close {
                width: 14px;
                height: 14px;
                top: 3px;
                right: 3px;
            }
        }
    </style>

    <script>
        // 페이지 로드 시 네비게이션 활성 상태 설정 및 NEW 배지 표시
        document.addEventListener('DOMContentLoaded', function() {
            setActiveNavigation();
            initYoutubeNewBadge();
        });

        // 현재 페이지에 해당하는 네비게이션 아이템 활성화
        function setActiveNavigation() {
            const currentPath = window.location.pathname;

            // 모든 네비게이션 링크에서 active 클래스 제거
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
            });

            // YouTube 페이지 확인 (/video로 시작하는 경로)
            if (currentPath.startsWith('/video')) {
                const youtubeLink = document.querySelector('[data-nav="youtube"]');
                if (youtubeLink) {
                    youtubeLink.classList.add('active');
                }
            }
            // 홈/블로그 페이지 (루트 경로)
            else if (currentPath === '/' || currentPath === '') {
                const blogLink = document.querySelector('[data-nav="blog"]');
                if (blogLink) {
                    blogLink.classList.add('active');
                }
            }
        }

        // YouTube NEW 배지 초기화
        function initYoutubeNewBadge() {
            const currentPath = window.location.pathname;
            const badge = document.getElementById('youtubeNewBadge');

            if (!badge) return;

            // video 페이지에서는 배지를 표시하지 않음
            if (currentPath.startsWith('/video')) {
                badge.style.display = 'none';
                return;
            }

            // localStorage에서 배지 닫힘 상태 확인
            const isBadgeDismissed = localStorage.getItem('youtubeNewBadgeDismissed') === 'true';

            if (!isBadgeDismissed) {
                // 배지를 표시하고 애니메이션 적용
                badge.style.display = 'flex';
                // 약간의 딜레이 후 애니메이션 시작 (DOM 렌더링 완료 후)
                setTimeout(() => {
                    badge.classList.add('badge-show');
                }, 100);
            }
        }

        // YouTube NEW 배지 닫기
        function dismissYoutubeNewBadge(event) {
            event.preventDefault();
            event.stopPropagation();

            const badge = document.getElementById('youtubeNewBadge');
            if (!badge) return;

            // 페이드아웃 애니메이션 적용
            badge.classList.remove('badge-show');
            badge.classList.add('badge-hide');

            // 애니메이션 완료 후 배지 숨기기
            setTimeout(() => {
                badge.style.display = 'none';

        async function logout() {
            try {
                await fetch('/api/auth/logout', {
                    method: 'POST',
                    credentials: 'include' // 쿠키 포함
                });
            } catch (error) {
                console.error('로그아웃 중 오류 발생:', error);
            } finally {
                window.location.href = '/';
            }
        }
        
        // 글로벌 피드백 모달 열기
        function openFeedbackModal() {
            const modalElement = document.getElementById('globalFeedbackModal');
            if (modalElement) {
                const modal = new bootstrap.Modal(modalElement);
                modal.show();
            }
        }
        
        // 글로벌 피드백 폼 처리
        document.getElementById('globalFeedbackForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const message = formData.get('message').trim();
            const type = formData.get('type');
            
            // 클라이언트 사이드 검증
            if (!type) {
                alert('피드백 유형을 선택해주세요.');
                document.getElementById('globalFeedbackType').focus();
                return;
            }
            
            if (!message) {
                alert('피드백 내용을 입력해주세요.');
                document.getElementById('globalFeedbackMessage').focus();
                return;
            }
            
            if (message.length < 10) {
                alert('피드백 내용은 10자 이상 입력해주세요.');
                document.getElementById('globalFeedbackMessage').focus();
                return;
            }
            
            const data = {
                name: formData.get('name') || '익명',
                email: formData.get('email') || '',
                type: type,
                message: message
            };
            
            try {
                const response = await fetch('/api/feedback', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    // 성공 시 모달 닫기 및 폼 리셋
                    this.reset();
                    const modal = bootstrap.Modal.getInstance(document.getElementById('globalFeedbackModal'));
                    modal.hide();
                    
                    // 성공 메시지 표시 (간단한 알림)
                    setTimeout(() => {
                        alert('피드백이 성공적으로 전송되었습니다. 소중한 의견 감사합니다!');
                    }, 300);
                } else {
                    // 서버에서 온 구체적인 오류 메시지 표시
                    alert(result.message || '피드백 전송 중 오류가 발생했습니다.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('네트워크 오류가 발생했습니다. 인터넷 연결을 확인하고 다시 시도해주세요.');
            }
        });
    </script>
