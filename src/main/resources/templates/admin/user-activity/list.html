<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>사용자 기록 조회</title>
    <style>
        .status-badge {
            padding: 0.25em 0.6em;
            border-radius: 0.25rem;
            font-size: 0.8em;
            font-weight: 600;
            color: #fff;
        }
        .status-active { background-color: #198754; }
        .status-banned { background-color: #dc3545; }
        .status-withdrawn { background-color: #6c757d; }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <h1 class="h3 mb-4 text-gray-800">사용자 기록 조회</h1>

        <!-- 회원 검색 -->
        <div class="card shadow mb-4">
            <div class="card-header py-3 d-flex justify-content-between align-items-center">
                <h6 class="m-0 font-weight-bold text-primary">회원 목록</h6>
                <small class="text-muted">최신 글 조회 시각 기준 내림차순 정렬</small>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/user-activity}" method="get" class="row g-3 align-items-center mb-4">
                    <div class="col-md-8">
                        <input type="text" name="search" class="form-control"
                               placeholder="이메일 또는 닉네임으로 검색"
                               th:value="${search}">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">검색</button>
                    </div>
                    <div class="col-md-2">
                        <a th:href="@{/admin/user-activity}" class="btn btn-secondary w-100">초기화</a>
                    </div>
                </form>

                <div class="table-responsive">
                    <table class="table table-bordered table-hover" width="100%" cellspacing="0">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>닉네임</th>
                            <th>이메일</th>
                            <th>상태</th>
                            <th>최신 글 조회 ▼</th>
                            <th>마지막 로그인</th>
                            <th>가입일</th>
                            <th>기록 조회</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users.content}">
                            <td th:text="${user.id}">1</td>
                            <td th:text="${user.nickname}">닉네임</td>
                            <td th:text="${user.email ?: '-'}">이메일</td>
                            <td>
                                <span class="status-badge"
                                      th:classappend="${user.status == 'ACTIVE'} ? 'status-active' : (${user.status == 'BANNED'} ? 'status-banned' : 'status-withdrawn')"
                                      th:text="${user.status}">ACTIVE</span>
                            </td>
                            <td th:text="${user.lastArticleViewAt != null ? #temporals.format(user.lastArticleViewAt, 'yyyy-MM-dd HH:mm') : '-'}">2024-01-01 00:00</td>
                            <td th:text="${user.lastLoginAt != null ? #temporals.format(user.lastLoginAt, 'yyyy-MM-dd HH:mm') : '-'}">2024-01-01 00:00</td>
                            <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01 00:00</td>
                            <td>
                                <a th:href="@{/admin/user-activity/{id}(id=${user.id})}"
                                   class="btn btn-sm btn-outline-primary">기록 보기</a>
                            </td>
                        </tr>
                        <tr th:if="${users.empty}">
                            <td colspan="8" class="text-center text-muted py-4">회원이 없습니다.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 페이지네이션 -->
                <nav th:if="${!users.empty && users.totalPages > 1}" aria-label="Page navigation">
                    <ul class="pagination justify-content-center mt-3">
                        <li class="page-item" th:classappend="${users.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/user-activity(page=${users.number - 1}, search=${search})}">이전</a>
                        </li>
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}"
                            th:classappend="${i == users.number} ? 'active'">
                            <a class="page-link"
                               th:href="@{/admin/user-activity(page=${i}, search=${search})}"
                               th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${users.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/user-activity(page=${users.number + 1}, search=${search})}">다음</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>

        <!-- 비로그인 IP 기록 조회 -->
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-warning">비로그인(IP 기반) 기록 조회</h6>
            </div>
            <div class="card-body">
                <form id="ipSearchForm" class="row g-3 align-items-center">
                    <div class="col-md-8">
                        <input type="text" id="ipInput" class="form-control"
                               placeholder="IP 주소 입력 (예: 192.168.1.1 또는 ::1)">
                    </div>
                    <div class="col-md-2">
                        <button type="button" onclick="goToIpDetail()" class="btn btn-warning w-100">조회</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="scripts">
    <script>
        function goToIpDetail() {
            const ip = document.getElementById('ipInput').value.trim();
            if (!ip) {
                alert('IP 주소를 입력해주세요.');
                return;
            }
            window.location.href = '/admin/user-activity/ip/' + encodeURIComponent(ip);
        }
        document.getElementById('ipInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') goToIpDetail();
        });
    </script>
</div>
</body>
</html>
