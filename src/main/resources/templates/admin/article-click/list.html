<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>아티클 유입경로</title>
    <style>
        .source-badge { display: inline-block; padding: 0.2em 0.55em; border-radius: 0.3rem;
                        font-size: 0.78em; font-weight: 600; background: #e7f5ff; color: #1971c2; }
        .stat-card .stat-value { font-size: 1.8rem; font-weight: 700; }
        .stat-card .stat-label { font-size: 0.85rem; color: #6c757d; }
        .ctx-cell { font-family: monospace; font-size: 0.82em; color: #555; }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <h1 class="h3 mb-4 text-gray-800">아티클 유입경로</h1>

        <!-- 통계 요약 -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card shadow stat-card text-center py-3">
                    <div class="stat-value text-primary" th:text="${totalCount}">0</div>
                    <div class="stat-label">전체 클릭 수</div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow stat-card text-center py-3">
                    <div class="stat-value text-success" th:text="${todayCount}">0</div>
                    <div class="stat-label">오늘 클릭 수</div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- 유입경로별 클릭 수 (7일) -->
            <div class="col-md-3">
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">최근 7일 유입경로별</h6>
                    </div>
                    <div class="card-body p-0">
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item d-flex justify-content-between align-items-center py-2"
                                th:each="row : ${sourceBreakdown}">
                                <a th:href="@{/admin/referrals(source=${row[0]})}"
                                   class="text-truncate me-2 text-decoration-none" style="max-width: 160px;"
                                   th:text="${row[0]}">SOURCE</a>
                                <span class="badge bg-primary rounded-pill" th:text="${row[1]}">0</span>
                            </li>
                            <li class="list-group-item text-muted text-center py-3"
                                th:if="${#lists.isEmpty(sourceBreakdown)}">데이터 없음</li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- 클릭 로그 테이블 -->
            <div class="col-md-9">
                <div class="card shadow mb-4">
                    <div class="card-header py-3 d-flex justify-content-between align-items-center">
                        <h6 class="m-0 font-weight-bold text-primary">유입경로 로그</h6>
                        <small class="text-muted">최신순 정렬</small>
                    </div>
                    <div class="card-body">
                        <!-- 필터 -->
                        <form th:action="@{/admin/referrals}" method="get" class="row g-2 mb-4">
                            <div class="col-md-8">
                                <select name="source" class="form-select">
                                    <option value="" th:selected="${source == null or source.isEmpty()}">전체 유입경로</option>
                                    <option th:each="s : ${allSources}"
                                            th:value="${s}"
                                            th:text="${s}"
                                            th:selected="${source != null and source == s.name()}">SOURCE</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <button type="submit" class="btn btn-primary w-100">필터</button>
                            </div>
                            <div class="col-md-2">
                                <a th:href="@{/admin/referrals}" class="btn btn-secondary w-100">초기화</a>
                            </div>
                        </form>

                        <div class="table-responsive">
                            <table class="table table-bordered table-hover table-sm" width="100%" cellspacing="0">
                                <thead class="table-light">
                                <tr>
                                    <th>시각</th>
                                    <th>유입경로</th>
                                    <th>글</th>
                                    <th>출발지</th>
                                    <th>사용자</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="log : ${logs.content}">
                                    <td class="text-nowrap small"
                                        th:text="${#temporals.format(log.createdAt, 'MM-dd HH:mm')}">00-00 00:00</td>
                                    <td>
                                        <a th:href="@{/admin/referrals(source=${log.source})}"
                                           class="text-decoration-none">
                                            <span class="source-badge" th:text="${log.source}">SOURCE</span>
                                        </a>
                                    </td>
                                    <td>
                                        <a th:if="${log.articleTitle != null}"
                                           th:href="@{'/articles/' + ${log.articleId}}"
                                           target="_blank"
                                           th:text="${#strings.abbreviate(log.articleTitle, 40)}"
                                           class="text-decoration-none small">제목</a>
                                        <span th:if="${log.articleTitle == null}"
                                              class="text-muted small"
                                              th:text="${'#' + log.articleId}">#0</span>
                                    </td>
                                    <td class="ctx-cell"
                                        th:text="${log.sourceContextId != null ? log.sourceContextId : '-'}">-</td>
                                    <td class="small">
                                        <span th:if="${log.userNickname != null}" th:text="${log.userNickname}">닉네임</span>
                                        <span th:if="${log.userNickname == null}" class="text-muted"
                                              th:text="${log.ipAddress}">IP</span>
                                    </td>
                                </tr>
                                <tr th:if="${logs.empty}">
                                    <td colspan="5" class="text-center text-muted py-4">데이터가 없습니다.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- 페이지네이션 -->
                        <nav th:if="${!logs.empty && logs.totalPages > 1}" aria-label="Page navigation">
                            <ul class="pagination justify-content-center mt-3">
                                <li class="page-item" th:classappend="${logs.first} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{/admin/referrals(page=${logs.number - 1}, size=${size}, source=${source})}">이전</a>
                                </li>
                                <li class="page-item"
                                    th:each="i : ${#numbers.sequence(pageStart, pageEnd)}"
                                    th:classappend="${i == logs.number} ? 'active'">
                                    <a class="page-link"
                                       th:href="@{/admin/referrals(page=${i}, size=${size}, source=${source})}"
                                       th:text="${i + 1}">1</a>
                                </li>
                                <li class="page-item" th:classappend="${logs.last} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{/admin/referrals(page=${logs.number + 1}, size=${size}, source=${source})}">다음</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
