<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>RAG 질의 기록</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/admin/rag-history.css}">
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <h1 class="h3 mb-4 text-gray-800">RAG 질의 기록</h1>

        <!-- 통계 요약 -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card shadow stat-card text-center py-3">
                    <div class="stat-value text-primary" th:text="${totalCount}">0</div>
                    <div class="stat-label">전체 질의 수</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow stat-card text-center py-3">
                    <div class="stat-value text-success" th:text="${todayCount}">0</div>
                    <div class="stat-label">오늘 질의 수</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow stat-card text-center py-3">
                    <div class="stat-value text-danger" th:text="${todayErrorCount}">0</div>
                    <div class="stat-label">오늘 오류 수</div>
                </div>
            </div>
        </div>

        <div class="card shadow mb-4">
            <div class="card-header py-3 d-flex justify-content-between align-items-center">
                <h6 class="m-0 font-weight-bold text-primary">질의 로그</h6>
                <small class="text-muted">최신순 정렬 · 행을 클릭하면 상세 정보를 볼 수 있습니다</small>
            </div>
            <div class="card-body">
                <!-- 검색 필터 -->
                <form th:action="@{/admin/rag/history}" method="get" class="row g-2 mb-4">
                    <div class="col-md-3">
                        <input type="text" name="keyword" class="form-control"
                               placeholder="질문 내용으로 검색" th:value="${keyword}">
                    </div>
                    <div class="col-md-2">
                        <select name="outcome" class="form-select">
                            <option value="">전체 상태</option>
                            <option th:each="o : ${outcomes}" th:value="${o}" th:text="${o}"
                                    th:selected="${o == outcome}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select name="model" class="form-select">
                            <option value="">전체 모델</option>
                            <option th:each="m : ${ragModels}" th:value="${m.id}" th:text="${m.label}"
                                    th:selected="${m.id == model}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select name="corporationId" class="form-select">
                            <option value="">전체 기업</option>
                            <option th:each="c : ${corporations}" th:value="${c.id}" th:text="${c.name}"
                                    th:selected="${c.id == corporationId}"></option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex gap-1">
                        <input type="date" name="dateFrom" class="form-control" th:value="${dateFrom}">
                        <input type="date" name="dateTo" class="form-control" th:value="${dateTo}">
                    </div>
                    <div class="col-md-1 d-flex gap-1">
                        <button type="submit" class="btn btn-primary w-100">검색</button>
                    </div>
                    <div class="col-12">
                        <a th:href="@{/admin/rag/history}" class="btn btn-sm btn-secondary">필터 초기화</a>
                    </div>
                </form>

                <div class="table-responsive">
                    <table class="table table-bordered table-hover table-sm" width="100%" cellspacing="0">
                        <thead class="table-light">
                        <tr>
                            <th>시각</th>
                            <th>질문</th>
                            <th>상태</th>
                            <th>모델</th>
                            <th>토큰</th>
                            <th>IP</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="log : ${logs.content}" class="rag-history-row" style="cursor:pointer;"
                            th:attr="data-log-id=${log.id}">
                            <td class="text-nowrap small"
                                th:text="${#temporals.format(log.createdAt, 'MM-dd HH:mm')}">00-00 00:00</td>
                            <td class="text-truncate" style="max-width: 360px;" th:text="${log.question}">질문</td>
                            <td class="text-center">
                                <span class="badge outcome-badge" th:classappend="'outcome-' + ${log.outcome}"
                                      th:text="${log.outcome}">ANSWERED</span>
                            </td>
                            <td class="small" th:text="${log.model}">model</td>
                            <td class="small text-end" th:text="${log.totalTokens != null ? log.totalTokens : '-'}">-</td>
                            <td class="small" th:text="${log.ipAddress}">IP</td>
                        </tr>
                        <tr th:if="${logs.empty}">
                            <td colspan="6" class="text-center text-muted py-4">데이터가 없습니다.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 페이지네이션 -->
                <nav th:if="${!logs.empty && logs.totalPages > 1}" aria-label="Page navigation">
                    <ul class="pagination justify-content-center mt-3">
                        <li class="page-item" th:classappend="${logs.first} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/admin/rag/history(page=${logs.number - 1}, keyword=${keyword}, outcome=${outcome}, model=${model}, corporationId=${corporationId}, dateFrom=${dateFrom}, dateTo=${dateTo})}">이전</a>
                        </li>
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, logs.totalPages - 1)}"
                            th:classappend="${i == logs.number} ? 'active'">
                            <a class="page-link"
                               th:href="@{/admin/rag/history(page=${i}, keyword=${keyword}, outcome=${outcome}, model=${model}, corporationId=${corporationId}, dateFrom=${dateFrom}, dateTo=${dateTo})}"
                               th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${logs.last} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/admin/rag/history(page=${logs.number + 1}, keyword=${keyword}, outcome=${outcome}, model=${model}, corporationId=${corporationId}, dateFrom=${dateFrom}, dateTo=${dateTo})}">다음</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- 상세 모달 -->
    <div class="modal fade" id="ragHistoryDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">RAG 질의 상세 <span id="rhDetailId" class="text-muted small"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="rhDetailLoading" class="text-center text-muted py-4">불러오는 중...</div>
                    <div id="rhDetailBody" class="d-none">
                        <dl class="row rh-meta">
                            <dt class="col-sm-3">시각</dt>
                            <dd class="col-sm-9" id="rhCreatedAt"></dd>
                            <dt class="col-sm-3">상태</dt>
                            <dd class="col-sm-9" id="rhOutcome"></dd>
                            <dt class="col-sm-3">모델</dt>
                            <dd class="col-sm-9" id="rhModel"></dd>
                            <dt class="col-sm-3">토큰(입력/출력/합)</dt>
                            <dd class="col-sm-9" id="rhTokens"></dd>
                            <dt class="col-sm-3">conversation_id</dt>
                            <dd class="col-sm-9" id="rhConversationId"></dd>
                            <dt class="col-sm-3">IP</dt>
                            <dd class="col-sm-9" id="rhIpAddress"></dd>
                            <dt class="col-sm-3">user_id</dt>
                            <dd class="col-sm-9" id="rhUserId"></dd>
                        </dl>
                        <hr>
                        <h6>질문</h6>
                        <p id="rhQuestion" class="rh-text-block"></p>
                        <h6>답변</h6>
                        <p id="rhAnswer" class="rh-text-block"></p>
                        <hr>
                        <h6>전처리 결과</h6>
                        <dl class="row rh-meta">
                            <dt class="col-sm-3">추출된 기업</dt>
                            <dd class="col-sm-9" id="rhExtractedCorporations"></dd>
                            <dt class="col-sm-3">추출된 키워드</dt>
                            <dd class="col-sm-9" id="rhExtractedKeywords"></dd>
                            <dt class="col-sm-3">벡터 쿼리</dt>
                            <dd class="col-sm-9" id="rhVectorQuery"></dd>
                            <dt class="col-sm-3">매칭된 기업 ID</dt>
                            <dd class="col-sm-9" id="rhMatchedCorporationIds"></dd>
                            <dt class="col-sm-3">검색된 글 수</dt>
                            <dd class="col-sm-9" id="rhArticleCount"></dd>
                        </dl>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="scripts">
    <script th:src="@{/js/admin/rag-history.js}"></script>
</div>
</body>
</html>
