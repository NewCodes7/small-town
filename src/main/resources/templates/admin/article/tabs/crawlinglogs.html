<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="content" class="card">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">
                <i class="fas fa-spider me-2"></i>크롤링 로그
                <span class="badge bg-light text-dark ms-2" th:if="${crawlingRuns != null}"
                      th:text="${crawlingRuns.totalElements} + '건'"></span>
            </h5>
        </div>
        <div class="card-body">
            <div class="alert alert-info mb-3">
                <i class="fas fa-info-circle me-2"></i>
                <strong>스케줄 실행 기록:</strong> 스케줄러 실행마다 성공/실패, 신규 글 수, 실패 메시지를 확인합니다.
            </div>

            <div class="row">
                <div class="col-lg-6">
                    <div class="table-responsive">
                        <table class="table table-hover table-sm">
                            <thead class="table-dark">
                                <tr>
                                    <th style="width: 8%;">ID</th>
                                    <th style="width: 18%;">잡</th>
                                    <th style="width: 14%;">상태</th>
                                    <th style="width: 15%;">성공</th>
                                    <th style="width: 15%;">실패</th>
                                    <th style="width: 15%;">신규</th>
                                    <th style="width: 15%;">시작</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="run : ${crawlingRuns.content}"
                                    class="crawling-run-row"
                                    th:data-run-id="${run.id}"
                                    style="cursor: pointer;">
                                    <td th:text="${run.id}"></td>
                                    <td>
                                        <span class="badge bg-secondary" th:text="${run.jobType}"></span>
                                    </td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${run.status.name() == 'SUCCESS'} ? 'bg-success' : (${run.status.name() == 'PARTIAL_SUCCESS'} ? 'bg-warning text-dark' : (${run.status.name() == 'RUNNING'} ? 'bg-info text-dark' : 'bg-danger'))"
                                              th:text="${run.status}"></span>
                                    </td>
                                    <td th:text="${run.successCount}"></td>
                                    <td th:text="${run.failureCount}"></td>
                                    <td th:text="${run.newItemsCount}"></td>
                                    <td>
                                        <span th:text="${#temporals.format(run.startedAt, 'yyyy-MM-dd HH:mm:ss')}"></span>
                                    </td>
                                </tr>
                                <tr th:if="${crawlingRuns == null || crawlingRuns.empty}">
                                    <td colspan="7" class="text-center text-muted py-4">
                                        <i class="fas fa-inbox fa-2x mb-2"></i>
                                        <p>크롤링 로그가 없습니다.</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <nav th:if="${crawlingRuns != null && crawlingRuns.totalPages > 1}" class="mt-3">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${crawlingRuns.first} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{/admin/articles(tab='crawlinglogs', page=${crawlingRuns.number - 1}, size=${crawlingRuns.size})}">
                                    <i class="fas fa-chevron-left"></i> 이전
                                </a>
                            </li>

                            <li class="page-item"
                                th:each="pageNum : ${#numbers.sequence(
                                    T(java.lang.Math).max(0, crawlingRuns.number - 4),
                                    T(java.lang.Math).min(crawlingRuns.totalPages - 1, crawlingRuns.number + 5)
                                )}"
                                th:classappend="${pageNum == crawlingRuns.number} ? 'active'">
                                <a class="page-link"
                                   th:href="@{/admin/articles(tab='crawlinglogs', page=${pageNum}, size=${crawlingRuns.size})}"
                                   th:text="${pageNum + 1}">1</a>
                            </li>

                            <li class="page-item" th:classappend="${crawlingRuns.last} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{/admin/articles(tab='crawlinglogs', page=${crawlingRuns.number + 1}, size=${crawlingRuns.size})}">
                                    다음 <i class="fas fa-chevron-right"></i>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>

                <div class="col-lg-6">
                    <div class="card border-secondary">
                        <div class="card-header bg-light">
                            <strong>실행 상세</strong>
                            <span class="text-muted ms-2" id="crawlingRunDetailTitle">실행을 선택하세요</span>
                        </div>
                        <div class="card-body">
                            <div id="crawlingRunSummary" class="mb-3 text-muted">선택된 실행의 요약을 표시합니다.</div>
                            <div class="table-responsive">
                                <table class="table table-sm">
                                    <thead>
                                        <tr>
                                            <th style="width: 10%;">ID</th>
                                            <th style="width: 25%;">글</th>
                                            <th style="width: 15%;">본문</th>
                                            <th style="width: 15%;">Term</th>
                                            <th style="width: 15%;">임베딩</th>
                                            <th style="width: 20%;">대표/카테고리</th>
                                        </tr>
                                    </thead>
                                    <tbody id="crawlingLogTableBody">
                                        <tr>
                                            <td colspan="6" class="text-center text-muted py-4">실행을 선택하면 상세 로그가 표시됩니다.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
