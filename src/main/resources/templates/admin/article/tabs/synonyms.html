<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="content" class="card">
                    <div class="card-body">
                        <div class="mb-3 d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">
                                <i class="fas fa-link me-2"></i>유의어 관리
                            </h5>
                            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addSynonymModal">
                                <i class="fas fa-plus me-2"></i>유의어 추가
                            </button>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead class="table-dark">
                                    <tr>
                                        <th style="width: 5%;">ID</th>
                                        <th style="width: 30%;">Term 1</th>
                                        <th style="width: 5%;">↔</th>
                                        <th style="width: 30%;">Term 2</th>
                                        <th style="width: 20%;">등록일</th>
                                        <th style="width: 10%;">액션</th>
                                    </tr>
                                </thead>
                                <tbody id="synonymTableBody">
                                    <tr>
                                        <td colspan="6" class="text-center text-muted">로딩 중...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

    </div>
</body>
</html>
