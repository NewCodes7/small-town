<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="content" class="card">
        <div class="card-body">
            <div class="mb-3">
                <button class="btn btn-success" id="extractContentBatchBtn">
                    <i class="fas fa-download me-2"></i>배치 본문 추출
                </button>
                <small class="text-muted ms-2">
                    <i class="fas fa-info-circle"></i> 본문이 없는 글들의 본문을 자동으로 추출합니다.
                </small>
            </div>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>제목</th>
                            <th>기업</th>
                            <th>카테고리</th>
                            <th>요약</th>
                            <th>발행일</th>
                            <th>조회수</th>
                            <th>좋아요</th>
                            <th>임베딩</th>
                            <th>액션</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="article : ${articles.content}">
                            <td th:text="${article.id}"></td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <img th:if="${article.thumbnailImage}" th:src="${article.thumbnailImage}"
                                         class="me-2" style="width: 40px; height: 40px; object-fit: cover; border-radius: 4px;" />
                                    <div>
                                        <a th:href="${article.link}" target="_blank"
                                           class="text-decoration-none fw-bold" th:text="${article.title}">
                                        </a>
                                        <div th:if="${article.translatedTitle}" class="mt-1">
                                            <button class="btn btn-sm btn-link text-decoration-none p-0 edit-translated-title-btn"
                                                    th:data-article-id="${article.id}"
                                                    th:data-current-translated-title="${article.translatedTitle}"
                                                    th:title="'번역된 제목 편집'"
                                                    style="color: inherit;">
                                                <small class="text-info" th:text="'🌐 ' + ${article.translatedTitle}"></small>
                                                <i class="fas fa-edit ms-1 text-muted" style="font-size: 0.7em;"></i>
                                            </button>
                                        </div>
                                        <br>
                                        <small class="text-muted" th:text="${article.link}"></small>
                                    </div>
                                </div>
                            </td>
                            <td th:text="${article.corporation.name}"></td>
                            <td>
                                <span class="badge bg-secondary category-badge"
                                      th:text="${article.category != null ? article.category.name : '미분류'}"
                                      th:data-article-id="${article.id}"
                                      style="cursor: pointer;">
                                </span>
                            </td>
                            <td>
                                <div th:if="${article.summaries != null && !article.summaries.empty}">
                                    <div th:each="summary, iterStat : ${article.summaries}"
                                         th:if="${iterStat.index < 2}" class="mb-1">
                                        <span th:if="${summary.contentType == 'h3'}"
                                              class="badge bg-info me-1">제목</span>
                                        <span th:if="${summary.contentType == 'li'}"
                                              class="badge bg-success me-1">항목</span>
                                        <small th:text="${summary.content}" class="text-muted"></small>
                                    </div>
                                    <small th:if="${article.summaries.size() > 2}"
                                           class="text-muted">...외 [[${article.summaries.size() - 2}]]개</small>
                                </div>
                                <span th:if="${article.summaries == null || article.summaries.empty}"
                                      class="text-muted">요약 없음</span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-link text-decoration-none p-0 edit-publish-date-btn"
                                        th:data-article-id="${article.id}"
                                        th:data-current-date="${#temporals.format(article.publishedAt, 'yyyy-MM-dd''T''HH:mm')}"
                                        th:title="'발행일 편집'"
                                        style="color: inherit;">
                                    <span th:text="${#temporals.format(article.publishedAt, 'yyyy-MM-dd HH:mm')}"></span>
                                    <i class="fas fa-edit ms-1 text-muted" style="font-size: 0.75em;"></i>
                                </button>
                            </td>
                            <td th:text="${article.viewCount ?: 0}"></td>
                            <td th:text="${article.likeCount ?: 0}"></td>
                            <td>
                                <div class="embedding-status-cell" th:data-article-id="${article.id}">
                                    <span class="badge bg-secondary">
                                        <i class="fas fa-spinner fa-spin me-1"></i>확인중
                                    </span>
                                </div>
                            </td>
                            <td>
                                <div class="btn-group" role="group">
                                    <button class="btn btn-sm btn-primary edit-article-btn"
                                            th:data-article-id="${article.id}">
                                        <i class="fas fa-edit"></i> 편집
                                    </button>
                                    <button class="btn btn-sm btn-info view-content-btn"
                                            th:data-article-id="${article.id}"
                                            th:data-article-title="${article.title}">
                                        <i class="fas fa-file-alt"></i> 본문
                                    </button>
                                    <button class="btn btn-sm btn-success edit-summaries-btn"
                                            th:data-article-id="${article.id}">
                                        <i class="fas fa-list"></i> 요약
                                    </button>
                                    <button class="btn btn-sm btn-warning view-embeddings-btn"
                                            th:data-article-id="${article.id}"
                                            th:data-article-title="${article.title}">
                                        <i class="fas fa-brain"></i> 임베딩
                                    </button>
                                    <button class="btn btn-sm btn-danger delete-article-btn"
                                            th:data-article-id="${article.id}"
                                            th:data-article-title="${article.title}">
                                        <i class="fas fa-trash"></i> 삭제
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${articles.empty}">
                            <td colspan="10" class="text-center text-muted">등록된 글이 없습니다.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 페이지네이션 -->
            <nav th:if="${articles.totalPages > 1}">
                <ul class="pagination justify-content-center">
                    <!-- 첫 페이지로 -->
                    <li class="page-item" th:classappend="${articles.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/articles(page=0, tab='articles', search=${search})}">
                            <i class="fas fa-angle-double-left"></i>
                        </a>
                    </li>

                    <!-- 이전 페이지 -->
                    <li class="page-item" th:classappend="${articles.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/articles(page=${articles.number - 1}, tab='articles', search=${search})}">
                            <i class="fas fa-angle-left"></i>
                        </a>
                    </li>

                    <!-- 페이지 번호들 (최대 5개만 표시) -->
                    <th:block th:with="
                        startPage=${articles.number > 2 ? articles.number - 2 : 0},
                        endPage=${articles.number + 2 < articles.totalPages - 1 ? articles.number + 2 : articles.totalPages - 1}
                    ">
                        <!-- 첫 페이지가 범위에 없으면 표시 -->
                        <li class="page-item" th:if="${startPage > 0}">
                            <a class="page-link" th:href="@{/admin/articles(page=0, tab='articles', search=${search})}">1</a>
                        </li>
                        <li class="page-item disabled" th:if="${startPage > 1}">
                            <span class="page-link">...</span>
                        </li>

                        <!-- 현재 페이지 주변의 페이지들 -->
                        <li class="page-item"
                            th:each="page : ${#numbers.sequence(startPage, endPage)}"
                            th:classappend="${page == articles.number} ? 'active'">
                            <a class="page-link"
                               th:href="@{/admin/articles(page=${page}, tab='articles', search=${search})}"
                               th:text="${page + 1}"></a>
                        </li>

                        <!-- 마지막 페이지가 범위에 없으면 표시 -->
                        <li class="page-item disabled" th:if="${endPage < articles.totalPages - 2}">
                            <span class="page-link">...</span>
                        </li>
                        <li class="page-item" th:if="${endPage < articles.totalPages - 1}">
                            <a class="page-link"
                               th:href="@{/admin/articles(page=${articles.totalPages - 1}, tab='articles', search=${search})}"
                               th:text="${articles.totalPages}"></a>
                        </li>
                    </th:block>

                    <!-- 다음 페이지 -->
                    <li class="page-item" th:classappend="${articles.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/articles(page=${articles.number + 1}, tab='articles', search=${search})}">
                            <i class="fas fa-angle-right"></i>
                        </a>
                    </li>

                    <!-- 마지막 페이지로 -->
                    <li class="page-item" th:classappend="${articles.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/articles(page=${articles.totalPages - 1}, tab='articles', search=${search})}">
                            <i class="fas fa-angle-double-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</body>
</html>
