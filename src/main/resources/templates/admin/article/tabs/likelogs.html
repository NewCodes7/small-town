<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="content" class="card">
        <div class="card-header bg-danger text-white">
            <h5 class="mb-0">
                <i class="fas fa-heart me-2"></i>좋아요 로그
                <span class="badge bg-light text-dark ms-2" th:if="${likeLogs != null}"
                      th:text="${likeLogs.totalElements} + '건'"></span>
            </h5>
        </div>
        <div class="card-body">
            <div class="alert alert-info mb-3">
                <i class="fas fa-info-circle me-2"></i>
                <strong>좋아요 로그:</strong> 사용자들의 좋아요 활동을 추적합니다.
                익명 사용자는 IP 주소로, 로그인 사용자는 이메일로 표시됩니다.
            </div>

            <div class="table-responsive">
                <table class="table table-hover table-sm">
                    <thead class="table-dark">
                        <tr>
                            <th style="width: 5%;">ID</th>
                            <th style="width: 12%;">사용자</th>
                            <th style="width: 15%;">IP 주소</th>
                            <th style="width: 8%;">Article ID</th>
                            <th style="width: 30%;">Article 제목</th>
                            <th style="width: 15%;">기업</th>
                            <th style="width: 15%;">좋아요 일시</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="likeLog : ${likeLogs.content}"
                            class="likelog-row"
                            th:data-likelog-id="${likeLog.id}"
                            style="cursor: pointer;">
                            <td th:text="${likeLog.id}"></td>
                            <td>
                                <span th:if="${likeLog.user != null}">
                                    <i class="fas fa-user text-primary me-1"></i>
                                    <strong th:text="${likeLog.user.email}"></strong>
                                    <br>
                                    <small class="text-muted" th:text="${likeLog.user.nickname}"></small>
                                </span>
                                <span th:if="${likeLog.user == null}" class="text-muted">
                                    <i class="fas fa-user-secret me-1"></i>익명
                                </span>
                            </td>
                            <td>
                                <code th:if="${likeLog.ipAddress != null}"
                                      th:text="${likeLog.ipAddress}"
                                      class="bg-light p-1 rounded"></code>
                                <span th:if="${likeLog.ipAddress == null}" class="text-muted">-</span>
                            </td>
                            <td>
                                <a th:href="@{/articles/{id}(id=${likeLog.article.id})}"
                                   target="_blank"
                                   class="badge bg-info text-decoration-none"
                                   th:text="${likeLog.article.id}">
                                </a>
                            </td>
                            <td>
                                <a th:href="@{/articles/{id}(id=${likeLog.article.id})}"
                                   target="_blank"
                                   class="text-decoration-none text-dark">
                                    <strong th:text="${likeLog.article.title}"></strong>
                                </a>
                                <div th:if="${likeLog.article.translatedTitle != null && likeLog.article.translatedTitle != likeLog.article.title}">
                                    <small class="text-muted" th:text="${likeLog.article.translatedTitle}"></small>
                                </div>
                            </td>
                            <td>
                                <span class="badge bg-secondary"
                                      th:text="${likeLog.article.corporation.name}"></span>
                            </td>
                            <td>
                                <span th:text="${#temporals.format(likeLog.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></span>
                                <br>
                                <small class="text-muted" th:text="${#temporals.format(likeLog.createdAt, 'E', #locale)}"></small>
                            </td>
                        </tr>
                        <tr th:if="${likeLogs == null || likeLogs.empty}">
                            <td colspan="7" class="text-center text-muted py-4">
                                <i class="fas fa-inbox fa-2x mb-2"></i>
                                <p>좋아요 로그가 없습니다.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 통계 정보 -->
            <div th:if="${likeLogs != null && !likeLogs.empty}" class="row mt-3">
                <div class="col-md-12">
                    <div class="card bg-light">
                        <div class="card-body">
                            <div class="row text-center">
                                <div class="col-md-3">
                                    <h6 class="text-muted mb-0">전체 좋아요</h6>
                                    <h4 class="text-danger mb-0">
                                        <i class="fas fa-heart"></i>
                                        <span th:text="${#numbers.formatInteger(likeLogs.totalElements, 0, 'COMMA')}"></span>
                                    </h4>
                                </div>
                                <div class="col-md-3">
                                    <h6 class="text-muted mb-0">현재 페이지</h6>
                                    <h4 class="text-primary mb-0">
                                        <span th:text="${likeLogs.number + 1}"></span>
                                        <small th:text="' / ' + ${likeLogs.totalPages}"></small>
                                    </h4>
                                </div>
                                <div class="col-md-3">
                                    <h6 class="text-muted mb-0">페이지당</h6>
                                    <h4 class="text-info mb-0" th:text="${likeLogs.size} + '건'"></h4>
                                </div>
                                <div class="col-md-3">
                                    <h6 class="text-muted mb-0">현재 표시</h6>
                                    <h4 class="text-success mb-0" th:text="${likeLogs.numberOfElements} + '건'"></h4>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 페이징 -->
            <nav th:if="${likeLogs != null && likeLogs.totalPages > 1}" class="mt-3">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${likeLogs.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/articles(tab='likelogs', page=${likeLogs.number - 1}, size=${likeLogs.size})}">
                            <i class="fas fa-chevron-left"></i> 이전
                        </a>
                    </li>

                    <!-- 페이지 번호 표시 (최대 10개) -->
                    <li class="page-item"
                        th:each="pageNum : ${#numbers.sequence(
                            T(java.lang.Math).max(0, likeLogs.number - 4),
                            T(java.lang.Math).min(likeLogs.totalPages - 1, likeLogs.number + 5)
                        )}"
                        th:classappend="${pageNum == likeLogs.number} ? 'active'">
                        <a class="page-link"
                           th:href="@{/admin/articles(tab='likelogs', page=${pageNum}, size=${likeLogs.size})}"
                           th:text="${pageNum + 1}">1</a>
                    </li>

                    <li class="page-item" th:classappend="${likeLogs.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/articles(tab='likelogs', page=${likeLogs.number + 1}, size=${likeLogs.size})}">
                            다음 <i class="fas fa-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <script th:inline="javascript">
        // 클릭 시 article 페이지로 이동
        document.querySelectorAll('.likelog-row').forEach(row => {
            row.addEventListener('click', function(e) {
                // 링크 클릭은 이미 처리되므로 무시
                if (e.target.tagName === 'A') return;

                const articleLink = this.querySelector('td:nth-child(5) a');
                if (articleLink) {
                    window.open(articleLink.href, '_blank');
                }
            });
        });
    </script>
</body>
</html>
