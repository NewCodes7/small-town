<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="content" class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead class="table-dark">
                                    <tr>
                                        <th style="width: 5%;">ID</th>
                                        <th style="width: 15%;">이메일</th>
                                        <th style="width: 10%;">닉네임</th>
                                        <th style="width: 8%;">역할</th>
                                        <th style="width: 10%;">가입 방법</th>
                                        <th style="width: 8%;">상태</th>
                                        <th style="width: 12%;">가입일</th>
                                        <th style="width: 12%;">최근 로그인</th>
                                        <th style="width: 10%;">프로필 이미지</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="user : ${users.content}"
                                        class="user-row"
                                        th:data-user-id="${user.id}"
                                        style="cursor: pointer;">
                                        <td th:text="${user.id}"></td>
                                        <td>
                                            <strong th:text="${user.email}"></strong>
                                        </td>
                                        <td th:text="${user.nickname}"></td>
                                        <td>
                                            <span class="badge"
                                                  th:classappend="${user.role.name == 'ADMIN'} ? 'bg-danger' : 'bg-info'"
                                                  th:text="${user.role.name}">
                                            </span>
                                        </td>
                                        <td>
                                            <span class="badge bg-secondary"
                                                  th:text="${user.provider != null ? user.provider.name : 'LOCAL'}">
                                            </span>
                                        </td>
                                        <td>
                                            <span class="badge"
                                                  th:classappend="${user.status.name() == 'ACTIVE'} ? 'bg-success' : (${user.status.name() == 'BANNED'} ? 'bg-danger' : 'bg-warning')"
                                                  th:text="${user.status.value}">
                                            </span>
                                        </td>
                                        <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                                        <td th:text="${user.lastLoginAt != null ? #temporals.format(user.lastLoginAt, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                                        <td>
                                            <img th:if="${user.profileImageUrl != null}"
                                                 th:src="${user.profileImageUrl}"
                                                 alt="프로필"
                                                 style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
                                            <span th:if="${user.profileImageUrl == null}" class="text-muted">-</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- 페이징 -->
                        <nav th:if="${users != null && users.totalPages > 1}">
                            <ul class="pagination justify-content-center">
                                <li class="page-item" th:classappend="${users.first} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/articles(tab='users', page=${users.number - 1}, size=${users.size})}">이전</a>
                                </li>
                                <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, users.totalPages - 1)}"
                                    th:classappend="${pageNum == users.number} ? 'active'">
                                    <a class="page-link" th:href="@{/admin/articles(tab='users', page=${pageNum}, size=${users.size})}" th:text="${pageNum + 1}">1</a>
                                </li>
                                <li class="page-item" th:classappend="${users.last} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/articles(tab='users', page=${users.number + 1}, size=${users.size})}">다음</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>

    </div>
</body>
</html>
