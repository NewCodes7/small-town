<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글 관리 - Small Town Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 사이드바 -->
            <div class="col-md-2 bg-dark p-3">
                <h4 class="text-white mb-4">Small Town Admin</h4>
                <nav class="nav flex-column">
                    <a class="nav-link text-light" href="/admin/corporations">
                        <i class="fas fa-building me-2"></i>기업 관리
                    </a>
                    <a class="nav-link text-warning" href="/admin/articles">
                        <i class="fas fa-newspaper me-2"></i>글 관리
                    </a>
                    <a class="nav-link text-light" href="/admin/feedback">
                        <i class="fas fa-comments me-2"></i>피드백 관리
                    </a>
                </nav>
            </div>

            <!-- 메인 컨텐츠 -->
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>콘텐츠 관리</h2>
                    <div class="btn-group">
                        <button class="btn btn-primary" id="extractTermsBtn">
                            <i class="fas fa-tags me-2"></i>Term 추출
                        </button>
                        <button class="btn btn-info" id="analyzeArticlesBtn">
                            <i class="fas fa-brain me-2"></i>전체 AI 분석
                        </button>
                        <button class="btn btn-warning" id="translateTitlesBtn">
                            <i class="fas fa-language me-2"></i>전체 제목 번역
                        </button>
                        <button class="btn btn-success" id="startEmbeddingBatchBtn">
                            <i class="fas fa-vector-square me-2"></i>임베딩 배치 시작
                        </button>
                        <button class="btn btn-secondary" id="generateTermEmbeddingsBtn">
                            <i class="fas fa-microchip me-2"></i>Term 임베딩 생성
                        </button>
                        <button class="btn btn-dark" id="generateSummaryBatchBtn">
                            <i class="fas fa-file-alt me-2"></i>요약 배치 생성
                        </button>
                        <button class="btn btn-purple" id="generateTitleBatchBtn" style="background-color: #6f42c1; color: white;">
                            <i class="fas fa-magic me-2"></i>제목 배치 생성
                        </button>
                    </div>
                </div>

                <!-- 탭 네비게이션 -->
                <ul class="nav nav-tabs mb-4">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${currentTab == 'articles'} ? 'active'"
                           th:href="@{/admin/articles(tab='articles')}">
                            <i class="fas fa-newspaper me-2"></i>블로그 글
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${currentTab == 'videos'} ? 'active'"
                           th:href="@{/admin/articles(tab='videos')}">
                            <i class="fas fa-video me-2"></i>유튜브 영상
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${currentTab == 'corporations'} ? 'active'"
                           th:href="@{/admin/articles(tab='corporations')}">
                            <i class="fas fa-building me-2"></i>기업 조회수
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${currentTab == 'terms'} ? 'active'"
                           th:href="@{/admin/articles(tab='terms')}">
                            <i class="fas fa-tags me-2"></i>Term 분석
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${currentTab == 'stats'} ? 'active'"
                           th:href="@{/admin/articles(tab='stats')}">
                            <i class="fas fa-chart-bar me-2"></i>Term 통계
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${currentTab == 'synonyms'} ? 'active'"
                           th:href="@{/admin/articles(tab='synonyms')}">
                            <i class="fas fa-link me-2"></i>유의어 관리
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${currentTab == 'searchlogs'} ? 'active'"
                           th:href="@{/admin/articles(tab='searchlogs')}">
                            <i class="fas fa-search me-2"></i>검색 로그
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${currentTab == 'users'} ? 'active'"
                           th:href="@{/admin/articles(tab='users')}">
                            <i class="fas fa-users me-2"></i>회원 관리
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${currentTab == 'likelogs'} ? 'active'"
                           th:href="@{/admin/articles(tab='likelogs')}">
                            <i class="fas fa-heart me-2"></i>좋아요 로그
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${currentTab == 'keywords'} ? 'active'"
                           th:href="@{/admin/articles(tab='keywords')}">
                            <i class="fas fa-filter me-2"></i>키워드 관리
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${currentTab == 'themes'} ? 'active'"
                           th:href="@{/admin/articles(tab='themes')}">
                            <i class="fas fa-bookmark me-2"></i>테마 조회수
                        </a>
                    </li>
                </ul>

                <!-- 검색 폼 -->
                <div class="row mb-4">
                    <div class="col-md-6">
                        <form method="get" class="d-flex">
                            <input type="hidden" name="tab" th:value="${currentTab}" />
                            <input type="text" class="form-control me-2" name="search"
                                   th:value="${search}" placeholder="제목으로 검색...">
                            <button class="btn btn-outline-primary" type="submit">
                                <i class="fas fa-search"></i>
                            </button>
                            <a th:href="@{/admin/articles(tab=${currentTab})}" class="btn btn-outline-secondary ms-2">전체</a>
                        </form>
                    </div>
                </div>

                <!-- 성공/에러 메시지 -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- 블로그 글 목록 테이블 -->

                <!-- Articles 탭 -->
                <div th:if="${currentTab == 'articles'}">
                    <div th:replace="~{admin/article/tabs/articles::content}"></div>
                </div>

                <!-- Videos 탭 -->
                <div th:if="${currentTab == 'videos'}">
                    <div th:replace="~{admin/article/tabs/videos::content}"></div>
                </div>

                <!-- Corporations 탭 -->
                <div th:if="${currentTab == 'corporations'}">
                    <div th:replace="~{admin/article/tabs/corporations::content}"></div>
                </div>

                <!-- Terms 탭 -->
                <div th:if="${currentTab == 'terms'}">
                    <div th:replace="~{admin/article/tabs/terms::content}"></div>
                </div>

                <!-- Stats 탭 -->
                <div th:if="${currentTab == 'stats'}">
                    <div th:replace="~{admin/article/tabs/stats::content}"></div>
                </div>

                <!-- Synonyms 탭 -->
                <div th:if="${currentTab == 'synonyms'}">
                    <div th:replace="~{admin/article/tabs/synonyms::content}"></div>
                </div>

                <!-- Search Logs 탭 -->
                <div th:if="${currentTab == 'searchlogs'}">
                    <div th:replace="~{admin/article/tabs/searchlogs::content}"></div>
                </div>

                <!-- Users 탭 -->
                <div th:if="${currentTab == 'users'}">
                    <div th:replace="~{admin/article/tabs/users::content}"></div>
                </div>

                <!-- Like Logs 탭 -->
                <div th:if="${currentTab == 'likelogs'}">
                    <div th:replace="~{admin/article/tabs/likelogs::content}"></div>
                </div>

                <!-- Keywords 탭 -->
                <div th:if="${currentTab == 'keywords'}">
                    <div th:replace="~{admin/article/tabs/keywords::content}"></div>
                </div>

                <!-- Themes 탭 -->
                <div th:if="${currentTab == 'themes'}">
                    <div th:replace="~{admin/article/tabs/themes::content}"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 모달들 -->
    <div th:replace="~{admin/article/modals/all-modals}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Admin Article List Modules (역할별로 분리된 JS 파일들) -->
    <script th:src="@{/js/admin/articleList/utils.js}"></script>
    <script th:src="@{/js/admin/articleList/articles.js}"></script>
    <script th:src="@{/js/admin/articleList/videos.js}"></script>
    <script th:src="@{/js/admin/articleList/terms.js}"></script>
    <script th:src="@{/js/admin/articleList/synonyms.js}"></script>
    <script th:src="@{/js/admin/articleList/embeddings.js}"></script>
    <script th:src="@{/js/admin/articleList/keywords.js}"></script>
    <script th:src="@{/js/admin/articleList/users.js}"></script>
    <script th:src="@{/js/admin/articleList/main.js}"></script>
</body>
</html>
