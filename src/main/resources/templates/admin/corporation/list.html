<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<section layout:fragment="content">
    <div class="container mt-4">
        <!-- Header Section -->
        <div class="hero-section text-center mb-5">
            <h1 class="hero-title">
                <i class="fas fa-building me-3" style="color: var(--primary-green);"></i>
                기업 관리
            </h1>
            <p class="hero-subtitle">기술 블로그를 운영하는 기업들을 관리하고 추가할 수 있어요</p>
        </div>
        
        <!-- 성공/에러 메시지 -->
        <div th:if="${successMessage}" class="alert alert-success" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <span th:text="${errorMessage}"></span>
        </div>
        
        <!-- 검색 및 등록 버튼 -->
        <div class="card mb-4" style="border-radius: 20px; background: var(--white);">
            <div class="card-body p-4">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <form th:action="@{/admin/corporations}" method="get" class="d-flex">
                            <div class="input-group">
                                <span class="input-group-text" style="background: var(--secondary-green); border: 2px solid var(--border-light); color: var(--primary-green-dark);">
                                    <i class="fas fa-search"></i>
                                </span>
                                <input type="text" name="search" th:value="${search}" class="form-control" placeholder="기업명을 검색해보세요" style="border-left: none;">
                                <button type="submit" class="btn btn-secondary">검색</button>
                            </div>
                        </form>
                    </div>
                    <div class="col-md-4 text-end">
                        <div class="dropdown d-inline-block me-2">
                            <button type="button" class="btn btn-info dropdown-toggle" data-bs-toggle="dropdown">
                                <i class="fas fa-chart-line me-2"></i>GA 동기화
                            </button>
                            <ul class="dropdown-menu">
                                <li>
                                    <button type="button" class="dropdown-item" id="sync-ga-all-btn">
                                        <i class="fas fa-history me-2"></i>전체 기간 동기화 (최초 1회)
                                    </button>
                                </li>
                                <li>
                                    <button type="button" class="dropdown-item" id="sync-ga-btn">
                                        <i class="fas fa-calendar-day me-2"></i>기간 지정 동기화
                                    </button>
                                </li>
                            </ul>
                        </div>
                        <button type="button" class="btn btn-warning me-2" id="remove-medium-duplicates-btn">
                            <i class="fas fa-clone me-2"></i>Medium 중복 삭제
                        </button>
                        <button type="button" class="btn btn-success me-2" id="crawl-all-btn">
                            <i class="fas fa-sync-alt me-2"></i>전체 크롤링
                        </button>
                        <a th:href="@{/admin/corporations/new}" class="btn btn-primary">
                            <i class="fas fa-plus me-2"></i>기업 등록
                        </a>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 기업 목록 -->
        <div class="row g-5" th:if="${!corporations.content.isEmpty()}">
            <div class="col-lg-6 col-xl-4" th:each="corp : ${corporations.content}">
                <div class="card h-100 corporation-card">
                    <div class="card-body p-4">
                        <!-- Company Header -->
                        <div class="d-flex align-items-center mb-4">
                            <div class="company-avatar me-3">
                                <img th:if="${corp.effectiveLogoUrl}" th:src="${corp.effectiveLogoUrl}" alt="logo" style="width: 44px; height: 44px; object-fit: contain; border-radius: 10px;">
                                <i th:unless="${corp.effectiveLogoUrl}" class="fas fa-building fa-lg" style="color: var(--primary-green);"></i>
                            </div>
                            <div class="flex-grow-1">
                                <div class="d-flex align-items-center gap-2 mb-1">
                                    <h5 class="mb-0 fw-bold" style="color: var(--text-dark);" th:text="${corp.name}">Company Name</h5>
                                    <span th:if="${corp.mediumBlog}" class="badge" style="background: #00ab6c; color: white; font-size: 10px; padding: 3px 6px;">
                                        <i class="fab fa-medium me-1"></i>Medium
                                    </span>
                                </div>
                                <small class="text-muted">
                                    <i class="fas fa-calendar me-1"></i>
                                    <span th:text="${#temporals.format(corp.createdAt, 'yyyy-MM-dd')}">2024-01-01</span>
                                </small>
                            </div>
                            <div class="dropdown">
                                <button class="btn btn-sm" style="background: none; border: none; color: var(--text-light);" data-bs-toggle="dropdown">
                                    <i class="fas fa-ellipsis-v"></i>
                                </button>
                                <ul class="dropdown-menu">
                                    <li><a class="dropdown-item" th:href="@{'/admin/corporations/' + ${corp.id} + '/edit'(page=${corporations.number}, search=${search})}">
                                        <i class="fas fa-edit me-2"></i>수정
                                    </a></li>
                                    <li><hr class="dropdown-divider"></li>
                                    <li>
                                        <button type="button" class="dropdown-item text-primary crawl-btn"
                                                th:data-corp-id="${corp.id}"
                                                th:data-corp-name="${corp.name}">
                                            <i class="fas fa-sync-alt me-2"></i>전체 페이지 크롤링
                                        </button>
                                    </li>
                                    <li><hr class="dropdown-divider"></li>
                                    <li>
                                        <form th:action="@{'/admin/corporations/' + ${corp.id} + '/delete'}" method="post" style="margin: 0;">
                                            <button type="submit" class="dropdown-item text-danger"
                                                    onclick="return confirm('정말 삭제하시겠습니까?')">
                                                <i class="fas fa-trash me-2"></i>삭제
                                            </button>
                                        </form>
                                    </li>
                                </ul>
                            </div>
                        </div>
                        
                        <!-- Industries -->
                        <div class="mb-3" th:if="${!corp.industries.isEmpty()}">
                            <span class="badge tag-badge me-1 mb-1"
                                  th:each="industry : ${corp.industries}"
                                  th:text="${industry}">Industry</span>
                        </div>

                        <!-- Full Crawl Status -->
                        <div class="mb-3" style="padding: 12px; border-radius: 12px; background: var(--secondary-green);">
                            <div class="d-flex align-items-center justify-content-between mb-2">
                                <div class="d-flex align-items-center">
                                    <i class="fas fa-robot me-2" style="color: var(--primary-green);"></i>
                                    <small class="fw-bold" style="color: var(--text-dark);">전체 크롤링 상태</small>
                                </div>
                                <button th:if="${corp.lastFullCrawledAt != null}"
                                        type="button" class="btn btn-sm reset-crawl-btn"
                                        style="padding: 2px 8px; font-size: 11px; background: #f3f4f6; color: #6b7280; border: 1px solid #d1d5db; border-radius: 6px;"
                                        th:data-corp-id="${corp.id}"
                                        th:data-corp-name="${corp.name}">
                                    <i class="fas fa-undo me-1"></i>리셋
                                </button>
                            </div>
                            <div th:if="${corp.lastFullCrawledAt != null}">
                                <div class="d-flex justify-content-between align-items-center">
                                    <small class="text-muted">
                                        <i class="fas fa-clock me-1"></i>
                                        <span th:text="${#temporals.format(corp.lastFullCrawledAt, 'yyyy-MM-dd HH:mm')}">2024-01-01 12:00</span>
                                    </small>
                                    <span th:if="${corp.lastFullCrawlStatus == 'SUCCESS'}"
                                          class="badge" style="background: #10b981; color: white;">
                                        <i class="fas fa-check-circle me-1"></i>성공
                                    </span>
                                    <span th:if="${corp.lastFullCrawlStatus == 'FAILURE'}"
                                          class="badge bg-danger">
                                        <i class="fas fa-exclamation-circle me-1"></i>실패
                                    </span>
                                </div>
                            </div>
                            <div th:unless="${corp.lastFullCrawledAt != null}">
                                <small class="text-muted">
                                    <i class="fas fa-info-circle me-1"></i>아직 전체 크롤링을 진행하지 않았습니다
                                </small>
                            </div>
                        </div>

                        <!-- Links -->
                        <div class="d-flex gap-2 mt-auto">
                            <a th:if="${corp.blogLink}" th:href="${corp.blogLink}" target="_blank" 
                               class="btn btn-sm flex-fill" 
                               style="background: var(--secondary-green); color: var(--primary-green-dark); font-weight: 600; border-radius: 12px;">
                                <i class="fas fa-blog me-1"></i>블로그
                            </a>
                            <a th:if="${corp.homeLink}" th:href="${corp.homeLink}" target="_blank" 
                               class="btn btn-sm btn-secondary flex-fill">
                                <i class="fas fa-home me-1"></i>홈페이지
                            </a>
                            <a th:if="${corp.crewLink}" th:href="${corp.crewLink}" target="_blank" 
                               class="btn btn-sm btn-secondary flex-fill">
                                <i class="fas fa-users me-1"></i>채용
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Empty State -->
        <div th:if="${corporations.content.isEmpty()}" class="text-center py-5">
            <div class="hero-section">
                <i class="fas fa-building fa-4x mb-4" style="color: var(--primary-green); opacity: 0.5;"></i>
                <h4 class="mb-3" style="color: var(--text-dark); font-weight: 700;">등록된 기업이 없어요</h4>
                <p class="text-muted mb-4">처음 기업을 등록해보세요!</p>
                <a th:href="@{/admin/corporations/new}" class="btn btn-primary">
                    <i class="fas fa-plus me-2"></i>첫 번째 기업 등록하기
                </a>
            </div>
        </div>
        
        <!-- 페이징 -->
        <nav th:if="${corporations.totalPages > 1}" class="mt-5">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${corporations.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/corporations(page=0, search=${search})}">
                        <i class="fas fa-angles-left me-1"></i>처음
                    </a>
                </li>
                <li class="page-item" th:classappend="${!corporations.hasPrevious()} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/corporations(page=${corporations.number - 1}, search=${search})}">
                        <i class="fas fa-chevron-left me-1"></i>이전
                    </a>
                </li>
                <li class="page-item" 
                    th:each="i : ${#numbers.sequence(T(java.lang.Math).max(0, corporations.number - 2), T(java.lang.Math).min(corporations.totalPages - 1, corporations.number + 2))}" 
                    th:classappend="${i == corporations.number} ? 'active'">
                    <a class="page-link" th:href="@{/admin/corporations(page=${i}, search=${search})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${!corporations.hasNext()} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/corporations(page=${corporations.number + 1}, search=${search})}">
                        다음<i class="fas fa-chevron-right ms-1"></i>
                    </a>
                </li>
                <li class="page-item" th:classappend="${corporations.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/corporations(page=${corporations.totalPages - 1}, search=${search})}">
                        마지막<i class="fas fa-angles-right ms-1"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <!-- JavaScript for crawling and GA sync -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Medium 중복 삭제 버튼 이벤트 리스너
            const removeDuplicatesBtn = document.getElementById('remove-medium-duplicates-btn');
            if (removeDuplicatesBtn) {
                removeDuplicatesBtn.addEventListener('click', function() {
                    if (!confirm('Medium 기반 기업들의 중복 글을 검사하고 삭제하시겠습니까?\n\n제목 또는 링크가 같은 글 중 하나를 삭제합니다.\n(썸네일 없는 글 우선, 조회수 적은 글 우선 삭제)')) {
                        return;
                    }

                    const originalContent = this.innerHTML;
                    this.disabled = true;
                    this.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>검사 중...';

                    fetch('/admin/corporations/medium/remove-duplicates', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    })
                    .then(response => response.json())
                    .then(data => {
                        this.disabled = false;
                        this.innerHTML = originalContent;

                        if (data.success) {
                            let message = `중복 글 삭제 완료!\n\n검사 기업: ${data.corporationsChecked}개\n삭제된 글: ${data.deletedCount}개`;
                            if (data.deletedArticles && data.deletedArticles.length > 0) {
                                message += '\n\n삭제된 글 목록:';
                                data.deletedArticles.slice(0, 10).forEach(article => {
                                    message += `\n- [${article.corporationName}] ${article.title.substring(0, 30)}...`;
                                });
                                if (data.deletedArticles.length > 10) {
                                    message += `\n... 외 ${data.deletedArticles.length - 10}개`;
                                }
                            }
                            alert(message);
                            if (data.deletedCount > 0) {
                                window.location.reload();
                            }
                        } else {
                            alert(`중복 삭제 실패\n\n${data.message}`);
                        }
                    })
                    .catch(error => {
                        this.disabled = false;
                        this.innerHTML = originalContent;
                        alert(`중복 삭제 실패\n\n오류: ${error.message}`);
                    });
                });
            }

            // GA 전체 기간 동기화 버튼 이벤트 리스너
            const syncGaAllBtn = document.getElementById('sync-ga-all-btn');
            if (syncGaAllBtn) {
                syncGaAllBtn.addEventListener('click', function() {
                    if (!confirm('전체 기간(약 14개월) 조회수를 동기화하시겠습니까?\n\n이 작업은 최초 1회만 실행하면 됩니다.\n이후에는 매일 자동으로 동기화됩니다.')) {
                        return;
                    }

                    const originalContent = this.innerHTML;
                    this.disabled = true;
                    this.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>동기화 중...';

                    fetch('/admin/analytics/sync-views-all', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    })
                    .then(response => response.json())
                    .then(data => {
                        this.disabled = false;
                        this.innerHTML = originalContent;

                        if (data.success) {
                            alert(`GA 전체 기간 조회수 동기화 완료!\n\n동기화된 기업: ${data.syncedCorporations}개`);
                            window.location.reload();
                        } else {
                            alert(`동기화 실패\n\n${data.message}`);
                        }
                    })
                    .catch(error => {
                        this.disabled = false;
                        this.innerHTML = originalContent;
                        alert(`동기화 실패\n\n오류: ${error.message}`);
                    });
                });
            }

            // GA 기간 지정 동기화 버튼 이벤트 리스너
            const syncGaBtn = document.getElementById('sync-ga-btn');
            if (syncGaBtn) {
                syncGaBtn.addEventListener('click', function() {
                    const days = prompt('몇 일간의 조회수를 동기화할까요?', '30');
                    if (days === null) return;

                    const daysNum = parseInt(days);
                    if (isNaN(daysNum) || daysNum <= 0) {
                        alert('올바른 숫자를 입력해주세요.');
                        return;
                    }

                    const originalContent = this.innerHTML;
                    this.disabled = true;
                    this.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>동기화 중...';

                    fetch(`/admin/analytics/sync-views?days=${daysNum}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    })
                    .then(response => response.json())
                    .then(data => {
                        this.disabled = false;
                        this.innerHTML = originalContent;

                        if (data.success) {
                            alert(`GA 조회수 동기화 완료!\n\n동기화된 기업: ${data.syncedCorporations}개\n기간: ${data.days}일`);
                            window.location.reload();
                        } else {
                            alert(`동기화 실패\n\n${data.message}`);
                        }
                    })
                    .catch(error => {
                        this.disabled = false;
                        this.innerHTML = originalContent;
                        alert(`동기화 실패\n\n오류: ${error.message}`);
                    });
                });
            }

            // 개별 기업 크롤링 버튼 이벤트 리스너
            document.querySelectorAll('.crawl-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const corpId = this.getAttribute('data-corp-id');
                    const corpName = this.getAttribute('data-corp-name');

                    if (!confirm(`"${corpName}" 기업의 모든 페이지를 크롤링하시겠습니까?\n\n설정된 페이지네이션 규칙에 따라 전체 페이지를 크롤링합니다.`)) {
                        return;
                    }

                    const originalContent = this.innerHTML;
                    this.disabled = true;
                    this.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>크롤링 중...';

                    fetch(`/admin/crawling/corporation/${corpId}/crawl-all`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    })
                    .then(response => response.json())
                    .then(data => {
                        this.disabled = false;
                        this.innerHTML = originalContent;

                        if (data.success) {
                            alert(`크롤링 완료!\n\n신규 글: ${data.newArticles}개`);
                            window.location.reload();
                        } else {
                            alert(`크롤링 실패\n\n오류: ${data.errorMessage || '알 수 없는 오류'}`);
                        }
                    })
                    .catch(error => {
                        this.disabled = false;
                        this.innerHTML = originalContent;
                        alert(`크롤링 실패\n\n오류: ${error.message}`);
                    });
                });
            });

            // 전체 크롤링 상태 리셋 버튼 이벤트 리스너
            document.querySelectorAll('.reset-crawl-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const corpId = this.getAttribute('data-corp-id');
                    const corpName = this.getAttribute('data-corp-name');

                    if (!confirm(`"${corpName}" 기업의 전체 크롤링 상태를 리셋하시겠습니까?\n\n리셋하면 다음 스케줄된 전체 크롤링 시 다시 크롤링됩니다.`)) {
                        return;
                    }

                    const originalContent = this.innerHTML;
                    this.disabled = true;
                    this.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

                    fetch(`/admin/corporations/${corpId}/reset-full-crawl`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    })
                    .then(response => response.json())
                    .then(data => {
                        this.disabled = false;
                        this.innerHTML = originalContent;

                        if (data.success) {
                            alert(`리셋 완료!\n\n${data.message}`);
                            window.location.reload();
                        } else {
                            alert(`리셋 실패\n\n오류: ${data.message || '알 수 없는 오류'}`);
                        }
                    })
                    .catch(error => {
                        this.disabled = false;
                        this.innerHTML = originalContent;
                        alert(`리셋 실패\n\n오류: ${error.message}`);
                    });
                });
            });
        });
    </script>
</section>
</html>
