<!DOCTYPE html>
<html lang="ko"
        xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/base}">
<head>
    <title>기술 블로그 모음 - NewCodes | 국내외 IT 기업 블로그 한곳에서</title>
    <th:block layout:fragment="meta" th:remove="tag">
        <meta name="description" content="국내외 IT 기업의 최신 기술 블로그를 한곳에서 만나보세요. NewCodes는 네이버, 카카오, 토스 등 기업 기술 블로그 모음 서비스입니다.">
        <meta name="keywords" content="기술 블로그 모음, 기업 기술 블로그, 개발자 블로그, IT 블로그, 기술 아티클, 개발자, NewCodes">
        <meta name="robots" content="index, follow">
    </th:block>
    <!-- 소셜 공유 설정 -->
    <meta property="og:image" content="https://d1g8228yawhpnq.cloudfront.net/newcodes.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="기술 블로그 모음 - NewCodes | 국내외 IT 기업 블로그" />
    <meta property="og:description" content="모든 기술 블로그를 한 곳에서 만나보세요!" />
    
    <link rel="stylesheet" type="text/css" th:href="@{/css/home.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/new-home.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/default-thumbnail.css}">
    <script th:src="@{/js/searchUtils.js}"></script>
    <!-- 구조화 데이터 (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "NewCodes",
      "alternateName": "기술 블로그 모음 - NewCodes",
      "description": "국내외 IT 기업의 최신 기술 블로그를 한곳에서 만나보세요. 네이버, 카카오, 토스 등 기업 기술 블로그 모음 서비스입니다.",
      "url": "https://newcodes.net",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://newcodes.net/articles?keyword={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "기술 블로그 모음",
      "description": "네이버, 카카오, 토스, 우아한형제들, 라인 등 국내외 IT 기업의 기술 블로그를 한곳에서 모아보는 서비스입니다.",
      "url": "https://newcodes.net",
      "provider": {
        "@type": "Organization",
        "name": "NewCodes",
        "url": "https://newcodes.net"
      }
    }
    </script>
</head>
<body>
    <div layout:fragment="content">
        <div class="new-home-container">

            <!-- Search Section -->
            <section class="hero-search-section">
                <h1 class="hero-main-title">기술 블로그 모음</h1>
                <p class="hero-subtitle">국내외 IT 기업의 최신 기술 블로그를 한곳에서</p>
                <form id="searchForm" action="/articles" method="get" class="hero-search-form">
                    <div class="hero-search-container">
                        <i class="fas fa-search hero-search-icon"></i>
                        <input type="text"
                               id="searchInput"
                               name="keyword"
                               class="hero-search-input"
                               placeholder="궁금한 기술, 회사, 주제를 검색해보세요!"
                               autocomplete="off">
                        <button type="submit" class="hero-search-submit">
                            검색
                            <i class="fas fa-arrow-right"></i>
                        </button>
                        <!-- 자동완성 드롭다운 -->
                        <div id="autocompleteDropdown" class="autocomplete-dropdown"></div>
                    </div>
                </form>
                <!-- 추천 검색어 -->
                <div class="suggested-keywords">
                    <span class="suggested-keywords-label">추천 검색어</span>
                    <button th:each="kw : ${suggestedKeywords}" type="button" class="keyword-chip"
                            th:attr="data-kw=${kw}" th:text="${kw}"
                            onclick="searchKeyword(this.getAttribute('data-kw'))"></button>
                </div>
                <div sec:authorize="hasRole('ADMIN')" class="suggested-keywords-admin-row">
                    <button type="button" class="keyword-edit-btn" id="openKeywordModal" title="추천 검색어 편집">
                        <i class="fas fa-pencil-alt"></i> 추천 검색어 편집
                    </button>
                </div>

                <!-- 관리자 전용: 추천 검색어 편집 모달 -->
                <div sec:authorize="hasRole('ADMIN')" id="keywordEditModal" class="keyword-modal-overlay" style="display:none">
                    <div class="keyword-modal">
                        <div class="keyword-modal-header">
                            <h3>추천 검색어 편집</h3>
                            <button type="button" class="keyword-modal-close" id="closeKeywordModal">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <p class="keyword-modal-hint">한 줄에 하나씩 입력 (최대 8개)</p>
                        <textarea id="keywordTextarea" rows="8" placeholder="예: MSA 전환 경험&#10;React 성능 최적화"></textarea>
                        <div class="keyword-modal-actions">
                            <button type="button" id="cancelKeywordEdit" class="keyword-btn-cancel">취소</button>
                            <button type="button" id="saveKeywordEdit" class="keyword-btn-save">저장</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Mobile Swipe Hint -->
            <div class="mobile-swipe-hint">
                <i class="fas fa-arrows-alt-h"></i>
                <span>카드를 좌우로 슬라이드하여 더 많은 글을 볼 수 있어요!</span>
            </div>

            <!-- 이번 주 인기글 Section -->
            <section class="content-section popular-section" th:if="${popularArticles != null and !popularArticles.isEmpty()}">
                <div class="section-header">
                    <h2 class="section-title">
                        <span class="section-icon popular-icon">
                            <i class="fas fa-fire"></i>
                        </span>
                        <span class="popular-title-toggle">
                            <span class="popular-toggle-indicator" aria-hidden="true"></span>
                            <button type="button" id="popularWeeklyBtn" class="popular-period-word active" data-period="weekly">이번 주</button>
                            <span class="popular-period-sep">/</span>
                            <button type="button" id="popularMonthlyBtn" class="popular-period-word" data-period="monthly">이번 달</button>
                        </span>
                        <span>인기글</span>
                    </h2>
                </div>

                <div class="popular-carousel-wrapper">
                    <button class="popular-nav-btn popular-prev" aria-label="이전">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <div class="popular-carousel">
                        <div class="popular-track">
                        <div th:each="article, iterStat : ${popularArticles}"
                             class="popular-card"
                             th:attr="data-detail-url=${article.detailUrl}, data-article-id=${article.id}, data-source='POPULAR_HOME'">
                            <span class="popular-rank" th:classappend="${iterStat.index < 3 ? ' top-rank' : ''}"
                                  th:text="${iterStat.index + 1}">1</span>
                            <div th:if="${article.thumbnailImage != null && !article.thumbnailImage.isEmpty()}"
                                 class="popular-card-thumbnail">
                                <img th:src="${article.thumbnailImage}"
                                     alt=""
                                     loading="lazy"
                                     onerror="handleThumbnailError(this)"
                                     class="popular-card-thumbnail-image">
                            </div>
                            <div th:unless="${article.thumbnailImage != null && !article.thumbnailImage.isEmpty()}"
                                 class="popular-card-thumbnail default-thumbnail">
                                <div class="default-thumbnail-content">
                                    <i class="fas fa-code"></i>
                                    <div class="thumbnail-pattern"></div>
                                </div>
                            </div>
                            <div class="popular-card-content">
                                <div class="popular-card-company">
                                    <a th:href="@{/corporations/{id}(id=${article.corporation.id})}"
                                       class="popular-card-company-link">
                                        <img th:if="${article.corporation.effectiveLogoUrl != null}"
                                             th:src="${article.corporation.effectiveLogoUrl}"
                                             th:alt="${article.corporation.name}"
                                             loading="lazy"
                                             class="popular-card-company-logo">
                                        <span class="popular-card-company-name" th:text="${article.corporation.name}">Corporation</span>
                                    </a>
                                </div>
                                <h3 class="popular-card-title">
                                    <a class="popular-card-title-link"
                                       th:href="${article.link}"
                                       target="_blank"
                                       rel="noopener noreferrer"
                                       th:text="${article.translatedTitle != null ? article.translatedTitle : article.title}"
                                       onclick="event.stopPropagation(); recordArticleView(this.closest('[data-article-id]').getAttribute('data-article-id'))">Article Title</a>
                                </h3>
                                <div class="popular-card-meta">
                                    <span class="popular-card-date">
                                        <i class="far fa-clock"></i>
                                        <span class="relative-time"
                                              th:attr="data-date=${article.publishedAt}"
                                              th:text="${article.publishedAt}">날짜</span>
                                    </span>
                                    <button class="like-button"
                                            th:attr="data-article-id=${article.id},
                                                    data-liked=${article.isLiked != null and article.isLiked}"
                                            onclick="event.stopPropagation(); toggleArticleLike(this, event)">
                                        <i class="far fa-heart like-icon"></i>
                                        <span class="like-count" th:text="${article.likeCount}">0</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    </div>
                    <button class="popular-nav-btn popular-next" aria-label="다음">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </section>

            <!-- Latest Blog Articles Section -->
            <section class="content-section">
                <div class="section-header">
                    <h2 class="section-title">
                        <span class="section-icon">
                            <i class="fas fa-newspaper"></i>
                        </span>
                        최신 기술 블로그
                    </h2>
                    <a href="/articles" class="section-more">
                        전체보기
                        <i class="fas fa-arrow-right"></i>
                    </a>
                </div>

                <div class="blog-grid" id="blogGrid">
                    <!-- Blog Cards - Dynamic -->
                    <div th:each="article : ${articles}"
                         class="blog-card"
                         th:attr="data-detail-url=${article.detailUrl}, data-link=${article.link}, data-article-id=${article.id}, data-source='LATEST_HOME'"
                         onclick="window.location.href=this.getAttribute('data-detail-url')"
                         style="cursor: pointer;">
                        <div th:if="${article.thumbnailImage != null && !article.thumbnailImage.isEmpty()}"
                             class="blog-card-thumbnail"
                             th:style="'background-image: url(' + ${article.thumbnailImage} + '); background-size: cover; background-position: center;'">
                        </div>
                        <div th:unless="${article.thumbnailImage != null && !article.thumbnailImage.isEmpty()}"
                             class="blog-card-thumbnail default-thumbnail">
                            <div class="default-thumbnail-content">
                                <i class="fas fa-code"></i>
                                <div class="thumbnail-pattern"></div>
                            </div>
                        </div>
                        <div class="blog-card-content">
                            <div class="blog-card-company">
                                <a th:href="@{/corporations/{id}(id=${article.corporation.id})}"
                                   class="blog-card-company-link"
                                   onclick="event.stopPropagation()">
                                    <img th:if="${article.corporation.effectiveLogoUrl != null}"
                                         th:src="${article.corporation.effectiveLogoUrl}"
                                         th:alt="${article.corporation.name}"
                                         class="blog-card-company-logo">
                                    <span class="blog-card-company-name" th:text="${article.corporation.name}">Corporation</span>
                                </a>
                            </div>
                            <h3 class="blog-card-title">
                                <a class="blog-card-title-link"
                                   th:href="${article.link}"
                                   target="_blank"
                                   rel="noopener noreferrer"
                                   th:text="${article.translatedTitle != null ? article.translatedTitle : article.title}"
                                   onclick="event.stopPropagation(); recordArticleView(this.closest('[data-article-id]').getAttribute('data-article-id'))">Article Title</a>
                            </h3>
                            <div class="blog-card-meta">
                                <span class="blog-card-date">
                                    <i class="far fa-clock"></i>
                                    <span class="relative-time"
                                          th:attr="data-date=${article.publishedAt}"
                                          th:title="${article.publishedAt}"
                                          th:text="${article.publishedAt}">날짜</span>
                                </span>
                                <button class="like-button"
                                        th:attr="data-article-id=${article.id},
                                                data-liked=${article.isLiked != null and article.isLiked}"
                                        onclick="event.stopPropagation(); toggleArticleLike(this, event)">
                                    <i class="far fa-heart like-icon"></i>
                                    <span class="like-count" th:text="${article.likeCount}">0</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="blog-pagination">
                    <button class="blog-nav-btn blog-prev" aria-label="이전" disabled>
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <span class="blog-page-number" id="blogPageNumber">1</span>
                    <button class="blog-nav-btn blog-next" aria-label="다음" th:disabled="${!hasMoreLatestArticles}">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>

                <!-- Mobile View All Button -->
                <div class="mobile-view-all">
                    <a href="/" class="mobile-view-all-btn">
                        <span>블로그 전체보기</span>
                        <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            </section>

            <!-- Theme Collections Section -->
            <section class="content-section">
                <div class="section-header">
                    <h2 class="section-title">
                        <span class="section-icon">
                            <i class="fas fa-bookmark"></i>
                        </span>
                        테마별 추천 글
                    </h2>
                    <a th:href="@{/themes}" class="section-more">
                        전체보기
                        <i class="fas fa-arrow-right"></i>
                    </a>
                </div>

                <div class="theme-grid">
                    <!-- Theme Collections - Dynamic -->
                    <a th:each="theme : ${themes}"
                       th:href="@{/themes/{id}(id=${theme.id})}"
                       class="theme-collection">
                        <div th:if="${theme.thumbnailUrl != null && !theme.thumbnailUrl.isEmpty()}"
                             class="theme-thumbnail"
                             th:style="'background-image: url(' + ${theme.thumbnailUrl} + '); background-size: cover; background-position: center;'">
                        </div>
                        <div th:unless="${theme.thumbnailUrl != null && !theme.thumbnailUrl.isEmpty()}"
                             class="theme-thumbnail default-thumbnail">
                            <div class="default-thumbnail-content">
                                <i class="fas fa-bookmark"></i>
                                <div class="thumbnail-pattern"></div>
                            </div>
                        </div>
                        <div class="theme-content">
                            <h3 class="theme-title" th:text="${theme.name}">Theme Title</h3>
                            <p class="theme-description" th:text="${theme.description}">Theme description</p>
                            <div class="theme-meta">
                                <div class="theme-count">
                                    <i class="fas fa-bookmark"></i>
                                    <span th:text="${theme.totalContentCount + '개 컨텐츠'}">0개 컨텐츠</span>
                                </div>
                                <div class="theme-cta">
                                    <span>자세히 보기</span>
                                    <i class="fas fa-arrow-right"></i>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>

                <!-- Mobile View All Button -->
                <div class="mobile-view-all">
                    <a th:href="@{/themes}" class="mobile-view-all-btn">
                        <span>테마 전체보기</span>
                        <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            </section>
        </div>
    </div>

    <div layout:fragment="scripts">
        <script th:src="@{/js/searchAutocomplete.js}"></script>
        <script th:src="@{/js/new-home.js(v='1.0.3')}"></script>
    </div>
</body>
</html>
