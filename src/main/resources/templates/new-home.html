<!DOCTYPE html>
<html lang="ko"
        xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>NewCodes - 모든 기술블로그를 한 곳에서</title>
    <th:block layout:fragment="meta" th:remove="tag">
        <meta name="description" content="NewCodes에서 최신 기술 블로그와 IT 소식을 만나보세요. 개발자를 위한 다양한 아티클을 매일 업데이트합니다.">
        <meta name="keywords" content="홈, 최신 기술, IT 뉴스, 개발자 커뮤니티, 기술 아티클, NewCodes">
        <meta name="robots" content="index, follow">
    </th:block>
    <!-- 소셜 공유 설정 -->
    <meta property="og:image" content="https://d1g8228yawhpnq.cloudfront.net/newcodes.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NewCodes" />
    <meta property="og:description" content="모든 기술 블로그를 한 곳에서 만나보세요!" />
    
    <link rel="stylesheet" type="text/css" th:href="@{/css/home.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/new-home.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/default-thumbnail.css}">
    <script th:src="@{/js/searchUtils.js}"></script>
</head>
<body>
    <div layout:fragment="content">
        <div class="new-home-container">

            <!-- Search Section -->
            <section class="hero-search-section">
                <form id="searchForm" action="/articles" method="get" class="hero-search-form">
                    <div class="hero-search-container">
                        <i class="fas fa-search hero-search-icon"></i>
                        <input type="text"
                               id="searchInput"
                               name="keyword"
                               class="hero-search-input"
                               placeholder="궁금한 기술, 회사, 주제를 검색해보세요!"
                               autocomplete="off">
                        <button type="submit" class="hero-search-submit">
                            검색
                            <i class="fas fa-arrow-right"></i>
                        </button>
                        <!-- 자동완성 드롭다운 -->
                        <div id="autocompleteDropdown" class="autocomplete-dropdown"></div>
                    </div>
                </form>
            </section>

            <!-- 이번 주 인기글 Section -->
            <section class="content-section popular-section" th:if="${popularArticles != null and !popularArticles.isEmpty()}">
                <div class="section-header">
                    <h2 class="section-title">
                        <span class="section-icon popular-icon">
                            <i class="fas fa-fire"></i>
                        </span>
                        이번 주 인기글
                    </h2>
                </div>

                <div class="popular-carousel-wrapper">
                    <button class="popular-nav-btn popular-prev" aria-label="이전">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <div class="popular-carousel">
                        <div class="popular-track">
                        <div th:each="article, iterStat : ${popularArticles}"
                             class="popular-card"
                             th:attr="data-detail-url=${article.detailUrl}">
                            <span class="popular-rank" th:classappend="${iterStat.index < 3 ? ' top-rank' : ''}"
                                  th:text="${iterStat.index + 1}">1</span>
                            <div th:if="${article.thumbnailImage != null && !article.thumbnailImage.isEmpty()}"
                                 class="popular-card-thumbnail">
                                <img th:src="${article.thumbnailImage}"
                                     alt=""
                                     loading="lazy"
                                     class="popular-card-thumbnail-image">
                            </div>
                            <div th:unless="${article.thumbnailImage != null && !article.thumbnailImage.isEmpty()}"
                                 class="popular-card-thumbnail default-thumbnail">
                                <div class="default-thumbnail-content">
                                    <i class="fas fa-code"></i>
                                    <div class="thumbnail-pattern"></div>
                                </div>
                            </div>
                            <div class="popular-card-content">
                                <div class="popular-card-company">
                                    <a th:href="@{/corporations/{id}(id=${article.corporation.id})}"
                                       class="popular-card-company-link">
                                        <img th:if="${article.corporation.effectiveLogoUrl != null}"
                                             th:src="${article.corporation.effectiveLogoUrl}"
                                             th:alt="${article.corporation.name}"
                                             loading="lazy"
                                             class="popular-card-company-logo">
                                        <span class="popular-card-company-name" th:text="${article.corporation.name}">Corporation</span>
                                    </a>
                                </div>
                                <h3 class="popular-card-title" th:text="${article.translatedTitle != null ? article.translatedTitle : article.title}">Article Title</h3>
                                <div class="popular-card-meta">
                                    <span class="popular-card-date">
                                        <i class="far fa-clock"></i>
                                        <span class="relative-time"
                                              th:attr="data-date=${article.publishedAt}"
                                              th:text="${article.publishedAt}">날짜</span>
                                    </span>
                                    <button class="like-button"
                                            th:attr="data-article-id=${article.id},
                                                    data-liked=${article.isLiked != null and article.isLiked}"
                                            onclick="event.stopPropagation(); toggleArticleLike(this, event)">
                                        <i class="far fa-heart like-icon"></i>
                                        <span class="like-count" th:text="${article.likeCount}">0</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    </div>
                    <button class="popular-nav-btn popular-next" aria-label="다음">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </section>

            <!-- Hacker News 인기글 Section -->
            <section class="content-section hn-section" th:if="${hackerNewsItems != null and !hackerNewsItems.isEmpty()}">
                <div class="section-header">
                    <h2 class="section-title">
                        <span class="section-icon hn-icon">
                            <i class="fab fa-hacker-news"></i>
                        </span>
                        Hacker News 인기글
                    </h2>
                    <a href="https://news.ycombinator.com" target="_blank" class="section-more">
                        HN 바로가기
                        <i class="fas fa-external-link-alt"></i>
                    </a>
                </div>

                <div class="hn-card-grid">
                    <div th:each="hnItem, iterStat : ${hackerNewsItems}"
                         class="hn-card"
                         th:attr="data-detail-url=${hnItem.detailUrl}"
                         onclick="window.location.href=this.getAttribute('data-detail-url')"
                         style="cursor: pointer;">
                        <span class="hn-rank" th:classappend="${iterStat.index < 3 ? ' top-rank' : ''}"
                              th:text="${iterStat.index + 1}">1</span>
                        <!-- 썸네일 자리에 번역된 제목 표시 -->
                        <div class="hn-card-thumbnail">
                            <div class="hn-card-thumbnail-text">
                                <span th:text="${hnItem.translatedTitle != null ? hnItem.translatedTitle : hnItem.title}">Title</span>
                            </div>
                            <a th:if="${hnItem.url != null}" th:href="${hnItem.url}" target="_blank" class="hn-card-external"
                               onclick="event.stopPropagation()">
                                <i class="fas fa-external-link-alt"></i>
                            </a>
                        </div>
                        <div class="hn-card-content">
                            <h3 class="hn-card-title" lang="en" th:text="${hnItem.title}">Original Title</h3>
                            <div class="hn-card-meta">
                                <span class="hn-card-score">
                                    <i class="fas fa-arrow-up"></i>
                                    <span th:text="${hnItem.score}">0</span>
                                </span>
                                <span class="hn-card-comments">
                                    <i class="fas fa-comment"></i>
                                    <span th:text="${hnItem.commentCount}">0</span>
                                </span>
                                <span class="hn-card-author">
                                    <i class="fas fa-user"></i>
                                    <span th:text="${hnItem.author}">author</span>
                                </span>
                                <span class="hn-card-date">
                                    <i class="far fa-clock"></i>
                                    <span class="relative-time"
                                          th:attr="data-date=${hnItem.hnCreatedAt}"
                                          th:text="${hnItem.hnCreatedAt}">날짜</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Latest Blog Articles Section -->
            <section class="content-section">
                <div class="section-header">
                    <h2 class="section-title">
                        <span class="section-icon">
                            <i class="fas fa-newspaper"></i>
                        </span>
                        최신 기술 블로그
                    </h2>
                    <a href="/articles" class="section-more">
                        전체보기
                        <i class="fas fa-arrow-right"></i>
                    </a>
                </div>

                <div class="blog-grid">
                    <!-- Blog Cards - Dynamic -->
                    <div th:each="article : ${articles}"
                         class="blog-card"
                         th:attr="data-detail-url=${article.detailUrl}"
                         onclick="window.location.href=this.getAttribute('data-detail-url')"
                         style="cursor: pointer;">
                        <div th:if="${article.thumbnailImage != null && !article.thumbnailImage.isEmpty()}"
                             class="blog-card-thumbnail"
                             th:style="'background-image: url(' + ${article.thumbnailImage} + '); background-size: cover; background-position: center;'">
                        </div>
                        <div th:unless="${article.thumbnailImage != null && !article.thumbnailImage.isEmpty()}"
                             class="blog-card-thumbnail default-thumbnail">
                            <div class="default-thumbnail-content">
                                <i class="fas fa-code"></i>
                                <div class="thumbnail-pattern"></div>
                            </div>
                        </div>
                        <div class="blog-card-content">
                            <div class="blog-card-company">
                                <a th:href="@{/corporations/{id}(id=${article.corporation.id})}"
                                   class="blog-card-company-link"
                                   onclick="event.stopPropagation()">
                                    <img th:if="${article.corporation.effectiveLogoUrl != null}"
                                         th:src="${article.corporation.effectiveLogoUrl}"
                                         th:alt="${article.corporation.name}"
                                         class="blog-card-company-logo">
                                    <span class="blog-card-company-name" th:text="${article.corporation.name}">Corporation</span>
                                </a>
                            </div>
                            <h3 class="blog-card-title" th:text="${article.translatedTitle != null ? article.translatedTitle : article.title}">Article Title</h3>
                            <div class="blog-card-meta">
                                <span class="blog-card-date">
                                    <i class="far fa-clock"></i>
                                    <span class="relative-time"
                                          th:attr="data-date=${article.publishedAt}"
                                          th:title="${article.publishedAt}"
                                          th:text="${article.publishedAt}">날짜</span>
                                </span>
                                <button class="like-button"
                                        th:attr="data-article-id=${article.id},
                                                data-liked=${article.isLiked != null and article.isLiked}"
                                        onclick="event.stopPropagation(); toggleArticleLike(this, event)">
                                    <i class="far fa-heart like-icon"></i>
                                    <span class="like-count" th:text="${article.likeCount}">0</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Mobile View All Button -->
                <div class="mobile-view-all">
                    <a href="/" class="mobile-view-all-btn">
                        <span>블로그 전체보기</span>
                        <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            </section>

            <!-- Latest Videos Section -->
            <section class="content-section">
                <div class="section-header">
                    <h2 class="section-title">
                        <span class="section-icon">
                            <i class="fab fa-youtube"></i>
                        </span>
                        최신 기업 영상 
                    </h2>
                    <a href="/video" class="section-more">
                        전체보기
                        <i class="fas fa-arrow-right"></i>
                    </a>
                </div>

                <div class="video-grid">
                    <!-- Video Cards - Dynamic -->
                    <div th:each="video : ${videos}"
                         class="video-card"
                         th:attr="data-video-id=${video.videoId}, data-video-title=${video.translatedTitle != null ? video.translatedTitle : video.title}, data-article-id=${video.id}"
                         onclick="openVideoModal(this)"
                         style="cursor: pointer;">
                        <div th:if="${video.thumbnailUrl != null && !video.thumbnailUrl.isEmpty()}"
                             class="video-card-thumbnail"
                             th:style="'background-image: url(' + ${video.thumbnailUrl} + '); background-size: cover; background-position: center;'">
                            <div class="video-play-icon">
                                <i class="fas fa-play"></i>
                            </div>
                        </div>
                        <div th:unless="${video.thumbnailUrl != null && !video.thumbnailUrl.isEmpty()}"
                             class="video-card-thumbnail default-thumbnail">
                            <div class="default-thumbnail-content">
                                <i class="fab fa-youtube"></i>
                                <div class="thumbnail-pattern"></div>
                            </div>
                            <div class="video-play-icon">
                                <i class="fas fa-play"></i>
                            </div>
                        </div>
                        <div class="video-card-content">
                            <div class="video-card-channel">
                                <a th:href="@{/corporations/{id}(id=${video.corporation.id})}"
                                   class="video-card-channel-link"
                                   onclick="event.stopPropagation()">
                                    <img th:if="${video.corporation.effectiveLogoUrl != null}"
                                         th:src="${video.corporation.effectiveLogoUrl}"
                                         th:alt="${video.corporation.name}"
                                         class="video-card-channel-logo">
                                    <span class="video-card-channel-name" th:text="${video.corporation.name}">Channel Name</span>
                                </a>
                            </div>
                            <h3 class="video-card-title" th:text="${video.translatedTitle != null ? video.translatedTitle : video.title}">Video Title</h3>
                            <div class="video-card-meta">
                                <span class="video-card-date">
                                    <i class="far fa-clock"></i>
                                    <span class="relative-time"
                                          th:attr="data-date=${video.publishedAt}"
                                          th:title="${video.publishedAt}"
                                          th:text="${video.publishedAt}">날짜</span>
                                </span>
                                <button class="like-button"
                                        th:attr="data-video-id=${video.id},
                                                data-liked=${video.isLiked != null and video.isLiked}"
                                        onclick="event.stopPropagation(); toggleVideoLike(this, event)">
                                    <i class="far fa-heart like-icon"></i>
                                    <span class="like-count" th:text="${video.likeCount}">0</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Mobile View All Button -->
                <div class="mobile-view-all">
                    <a href="/video" class="mobile-view-all-btn">
                        <span>영상 전체보기</span>
                        <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            </section>

            <!-- Theme Collections Section -->
            <section class="content-section">
                <div class="section-header">
                    <h2 class="section-title">
                        <span class="section-icon">
                            <i class="fas fa-bookmark"></i>
                        </span>
                        테마별 추천 글
                    </h2>
                    <a href="#" class="section-more">
                        전체보기
                        <i class="fas fa-arrow-right"></i>
                    </a>
                </div>

                <div class="theme-grid">
                    <!-- Theme Collections - Dynamic -->
                    <a th:each="theme : ${themes}"
                       th:href="@{/themes/{id}(id=${theme.id})}"
                       class="theme-collection">
                        <div th:if="${theme.thumbnailUrl != null && !theme.thumbnailUrl.isEmpty()}"
                             class="theme-thumbnail"
                             th:style="'background-image: url(' + ${theme.thumbnailUrl} + '); background-size: cover; background-position: center;'">
                        </div>
                        <div th:unless="${theme.thumbnailUrl != null && !theme.thumbnailUrl.isEmpty()}"
                             class="theme-thumbnail default-thumbnail">
                            <div class="default-thumbnail-content">
                                <i class="fas fa-bookmark"></i>
                                <div class="thumbnail-pattern"></div>
                            </div>
                        </div>
                        <div class="theme-content">
                            <h3 class="theme-title" th:text="${theme.name}">Theme Title</h3>
                            <p class="theme-description" th:text="${theme.description}">Theme description</p>
                            <div class="theme-meta">
                                <div class="theme-count">
                                    <i class="fas fa-bookmark"></i>
                                    <span th:text="${theme.totalContentCount + '개 컨텐츠'}">0개 컨텐츠</span>
                                </div>
                                <div class="theme-cta">
                                    <span>자세히 보기</span>
                                    <i class="fas fa-arrow-right"></i>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>

                <!-- Mobile View All Button -->
                <div class="mobile-view-all">
                    <a href="#" class="mobile-view-all-btn">
                        <span>테마 전체보기</span>
                        <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            </section>
        </div>

        <!-- Video Modal -->
        <div id="videoModal" class="video-modal" onclick="closeVideoModal(event)">
            <div class="video-modal-content">
                <button class="video-modal-close" onclick="closeVideoModal(event)">&times;</button>
                <iframe id="modalVideoPlayer"
                        src=""
                        title="YouTube video player"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin"
                        allowfullscreen>
                </iframe>
            </div>
        </div>
    </div>

    <div layout:fragment="scripts">
        <script th:src="@{/js/searchAutocomplete.js}"></script>
        <script th:src="@{/js/new-home.js(v='1.0.1')}"></script>
    </div>
</body>
</html>
