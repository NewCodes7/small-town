<!DOCTYPE html>
<html lang="ko"
        xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>AI에게 물어보기 - NewCodes</title>
    <th:block layout:fragment="meta" th:remove="tag">
        <meta name="description" content="국내외 IT 기업의 기술 활용 사례를 AI에게 물어보세요.">
        <meta name="robots" content="noindex, follow">
    </th:block>
    <link rel="stylesheet" type="text/css" th:href="@{/css/ask.css}">
</head>
<body>
<div layout:fragment="content">
    <div class="ask-container">
        <h1 class="ask-title">AI에게 물어보기</h1>
        <p class="ask-subtitle">국내외 IT 기업의 기술 활용 사례를 자연어로 질문해보세요.</p>

        <div id="askMessages" class="ask-messages"></div>

        <form id="askForm" class="ask-form">
            <input type="text" id="askInput" class="ask-input" placeholder="예: 토스는 MSA 전환을 어떻게 진행했어?" autocomplete="off" maxlength="500" />
            <button type="submit" id="askSubmit" class="ask-submit">보내기</button>
        </form>

        <div id="askToast" class="ask-toast" style="display:none;"></div>
    </div>
</div>
<div layout:fragment="scripts">
    <script th:src="@{/js/ask.js}"></script>
</div>
</body>
</html>
