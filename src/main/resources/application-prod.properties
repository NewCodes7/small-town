# ==== 운영환경 설정 ====
server.port=8080
# 포트 재사용 활성화 (OOM 재시작 시 포트 충돌 방지)
server.address=0.0.0.0
server.tomcat.connection-timeout=20000
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ==== DB 연결 설정 ====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Thymeleaf 운영 설정
spring.thymeleaf.cache=true

# JPA 운영 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ==== HikariCP Connection Pool 설정 ====
# DB_POOL_SIZE로 오버라이드 가능 — 풀 크기 실험(load-test 재배포 없이 재기동만으로 값 변경) 목적.
# 기본값 5는 DB 호스트 vCPU 2개 기준 HikariCP 권장 공식(cores*2+spindle)과 일치하는 값이라
# 임의로 올리기보다 ramp 부하테스트로 DB 서버(CPU/디스크 I/O) 포화 지점을 먼저 실측할 것
# (load-test/results/2026-08-06-search-ramp-limit-finder.md 참고).
# minimum-idle을 maximum-pool-size와 동일하게 둬 고정 크기 풀 유지(HikariCP 권장 관례).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=3000
# 커넥션 누수 감지: 30초 이상 점유 시 WARN 로그 출력
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# HNSW 탐색 범위 설정 (기본값 40 → 250으로 증가, candidateLimit=200보다 크게 설정하여 recall 향상)
# statement_timeout: 쿼리 기본 타임아웃 5초. 배치 쿼리(REFRESH MATERIALIZED VIEW 등)는 BatchQueryService로 개별 비활성화
spring.datasource.hikari.connection-init-sql=SET hnsw.ef_search=250; SET statement_timeout='5000'; SET max_parallel_workers_per_gather=${DB_MAX_PARALLEL_WORKERS:0};
# 유효성 검사 타임아웃 (3초)
spring.datasource.hikari.validation-timeout=3000

# Prepared Statement 캐싱 (PostgreSQL)
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=256
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=5
# 소켓 타임아웃 (600초) - REFRESH MATERIALIZED VIEW 등 배치 쿼리 수용
spring.datasource.hikari.data-source-properties.socketTimeout=600
spring.datasource.hikari.data-source-properties.loginTimeout=10

# tomcat 연결 제한 (virtual threads 활성화로 threads.max/min-spare는 미적용)
server.tomcat.accept-count=50
server.tomcat.max-connections=300

# Logging Levels - 운영환경 최적화
logging.level.root=WARN
logging.level.com.newcodes7.small_town=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# Logging Patterns
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# 스케줄링 설정
spring.task.scheduling.pool.size=10

# 크롤링 설정
crawler.enabled=true
# 블로그 크롤링: 매일 새벽 4시 (매 정각으로 되돌리려면 0 0 * * * ?)
crawler.schedule.blog.cron=0 0 4 * * ?
# YouTube 크롤링: 매일 새벽 4시 30분 (AI 분석은 크롤링 시 자동 실행)
crawler.schedule.youtube.cron=0 30 4 * * ?
crawler.timeout.seconds=60
crawler.retry.max-attempts=5
crawler.concurrent.max-threads=10
crawler.schedule.analysis.cron=0 0 5 * * ?

# 웹드라이버 설정 - 운영 최적화
webdriver.chrome.headless=true
webdriver.chrome.window-size=1920,1080
webdriver.chrome.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
webdriver.chrome.timeout=60

# JWT 설정
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=86400000
app.jwt.refresh-token-expiration=604800000

# 에러 페이지 설정 - 운영 최적화
server.error.include-stacktrace=never
server.error.include-exception=false

# OAuth2 설정 
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email
spring.security.oauth2.client.registration.github.redirect-uri=${GITHUB_REDIRECT_URI}

# AWS S3 운영환경 설정
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.region.static=${AWS_REGION:ap-northeast-2}
cloud.aws.stack.auto=false
s3.bucket.name=${S3_BUCKET_NAME}
cloudfront.domain=${CLOUDFRONT_DOMAIN}

# S3 업로드 기능 활성화
s3.upload.enabled=${S3_UPLOAD_ENABLED:true}

# 모든 actuator 엔드포인트 노출
management.endpoints.web.exposure.include=*
management.metrics.enable.all=true
management.endpoint.prometheus.enabled=true

# HTTP 요청에 대한 histogram 활성화 (bucket 생성)
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# SLO (Service Level Objective) 버킷 정의
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,400ms,800ms,1s,2s

# health 엔드포인트 상세정보 표시
management.endpoint.health.show-details=always

# ==== 분산 트레이싱 (Tempo) ====
# 요청 단위 구간별(함수/DB/외부API) 응답시간 워터폴 — Grafana Explore > Tempo에서 확인
management.opentelemetry.tracing.export.otlp.endpoint=http://tempo:4318/v1/traces
# 소규모 트래픽이라 100% 샘플링으로 시작 (트래픽 증가 시 TRACING_SAMPLING으로 조정)
management.tracing.sampling.probability=${TRACING_SAMPLING:1.0}

# Prometheus exemplar 비활성화 — Tracer 빈이 있으면 Boot 4가 모든 Prometheus 메트릭에 자동으로
# exemplar를 붙이는데, percentile-histogram이 꺼진 Timer(예: HikariCP hikaricp_connections_acquire_seconds_count)는
# _bucket 라인이 없어 exemplar를 붙일 수 없어 새 Prometheus Java client가 스크랩 응답 전체를 reject함
# ("metric name ... does not support exemplars") — 사실상 모든 Prometheus 메트릭이 no data로 보이는 원인이었음.
# 현재 대시보드에서 exemplar(트레이스 바로가기) 기능을 쓰는 곳이 없어 끄는 데 부작용 없음.
management.tracing.exemplars.include=none

# openai 관련 설정 
openai.api-key=${OPENAI_API_KEY}
openai.org-id=${OPENAI_ORG_ID}
openai.project-id=${OPENAI_MY_PROJECT_ID}
openai.webhook-secret=${OPENAI_WEBHOOK_SECRET}

# Gemini AI 요약 설정
gemini.api-key=${GEMINI_API_KEY}
gemini.model=gemini-3.5-flash
gemini.summary.model=gemini-3.5-flash

# 번역 API 설정
deepl.api-key=${DEEPL_API_KEY:}
google.translate.api-key=${GOOGLE_TRANSLATE_API_KEY:}
