# ==== 운영환경 설정 ====
server.port=8080

# ==== DB 연결 설정 ====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Thymeleaf 운영 설정
spring.thymeleaf.cache=true

# JPA 운영 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Logging Levels - 운영환경 최적화
logging.level.root=WARN
logging.level.com.newcodes7.small_town=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# Logging Patterns
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# 스케줄링 설정
spring.task.scheduling.pool.size=10

# 크롤링 설정
crawler.enabled=true
crawler.schedule.cron=0 * * * * ?
crawler.timeout.seconds=60
crawler.retry.max-attempts=5
crawler.concurrent.max-threads=10

# 웹드라이버 설정 - 운영 최적화
webdriver.chrome.headless=true
webdriver.chrome.window-size=1920,1080
webdriver.chrome.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
webdriver.chrome.timeout=60

# JWT 설정 - 환경변수 사용
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=86400000
app.jwt.refresh-token-expiration=604800000

# 에러 페이지 설정 - 운영 최적화
server.error.include-stacktrace=never
server.error.include-exception=false

# OAuth2 설정 - 환경변수 사용 (기본값으로 비활성화)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/oauth2/callback/google}

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:dummy}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:dummy}
spring.security.oauth2.client.registration.github.scope=user:email
spring.security.oauth2.client.registration.github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:8080/oauth2/callback/github}

# AWS S3 운영환경 설정
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.region.static=${AWS_REGION:ap-northeast-2}
cloud.aws.stack.auto=false
s3.bucket.name=${S3_BUCKET_NAME}
cloudfront.domain=${CLOUDFRONT_DOMAIN}

# S3 업로드 기능 활성화
s3.upload.enabled=${S3_UPLOAD_ENABLED:true}

# 모든 actuator 엔드포인트 노출
management.endpoints.web.exposure.include=*
management.metrics.enable.all=true

# health 엔드포인트 상세정보 표시
management.endpoint.health.show-details=always