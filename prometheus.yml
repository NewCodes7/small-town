global:
  scrape_interval: 15s  # 메트릭을 15초마다 수집

scrape_configs:
  - job_name: 'backend'
    static_configs:
      - targets: ['newcodes-backend-green:8080']
        labels:
          server: 'green'
      - targets: ['newcodes-backend-blue:8080']
        labels:
          server: 'blue'
    metrics_path: '/actuator/prometheus'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
      
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres_exporter:9187']

  - job_name: 'db-node'
    static_configs:
      - targets: ['10.0.32.222:9100']