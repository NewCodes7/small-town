global:
  scrape_interval: 15s  # 메트릭을 15초마다 수집

scrape_configs:
  - job_name: 'backend'
    static_configs:
      - targets:
        - '172.19.0.4:8080'
        - '172.19.0.3:8080'
    metrics_path: '/actuator/prometheus'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']