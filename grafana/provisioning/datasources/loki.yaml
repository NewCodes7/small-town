apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    version: 1
    editable: true
    jsonData:
      maxLines: 1000
      # 로그의 [traceId,spanId] 패턴(logback FILE_LOG_PATTERN)을 잡아 Tempo 트레이스로 링크
      derivedFields:
        - name: TraceID
          matcherRegex: '\[(\w{32}),\w{16}\]'
          url: '$${__value.raw}'
          datasourceUid: tempo
