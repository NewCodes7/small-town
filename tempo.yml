# Grafana Tempo — 분산 트레이스 저장소
# 앱(OTLP HTTP 4318) → Tempo → Grafana(query 3200) 로 연결된다.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 168h  # 트레이스 보관 7일
