services:
  newcodes-backend-blue:
    image: ghcr.io/newcodes7/small-town:latest
    container_name: newcodes-backend-blue
    restart: unless-stopped
    logging: &backend-logging
      driver: json-file
      options:
        max-size: "20m"   # 파일 appender가 이미 ./logs/에 저장하므로 작게 설정
        max-file: "3"
    environment: &backend-env
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      # HikariCP 풀 크기 실험용 — 운영 .env에서 값 바꾸고 재기동만 하면 됨(코드 재배포 불필요).
      # 미지정 시 5(기존값)로 폴백 — application-prod.properties의 ${DB_POOL_SIZE:5}와 동일 기본값.
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      # BM25 쿼리당 병렬 워커 수(EXPLAIN ANALYZE로 leader+worker 2개=프로세스 3개 확인됨,
      # docs/operations/DB_LOAD_REDUCTION.md 참고) — 0=비활성화. DB_POOL_SIZE와 동일한 실험 패턴.
      # 변인 격리 실험(merge+workers=2, testid 20260807-233530) 완료 후 최적값 0으로 원복.
      # (load-test/results/2026-08-06-search-ramp-limit-finder.md 참고)
      - DB_MAX_PARALLEL_WORKERS=${DB_MAX_PARALLEL_WORKERS:-0}
      - JWT_SECRET=${JWT_SECRET}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      # 미지정 시 빈 문자열이 주입돼 Spring 기본값을 덮어쓰므로 compose에서도 기본값 지정
      - BEDROCK_REGION=${BEDROCK_REGION:-ap-northeast-2}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SERVER_SSL_ENABLED=false  # Nginx에서 SSL 처리
      - ADMIN_URL=http://admin-server:9090
      - ADMIN_NAME=${ADMIN_NAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ROLES=${ROLES}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_ORG_ID=${OPENAI_ORG_ID}
      - OPENAI_MY_PROJECT_ID=${OPENAI_MY_PROJECT_ID}
      - OPENAI_WEBHOOK_SECRET=${OPENAI_WEBHOOK_SECRET}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - DEEPL_API_KEY=${DEEPL_API_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI}
      - CLOVA_API_KEY=${CLOVA_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY}
      # Gmail SMTP: Grafana 알림과 동일한 계정/앱 비밀번호 재사용
      - MAIL_USERNAME=${MY_EMAIL}
      - MAIL_PASSWORD=${MY_EMAIL_PASSWORD}
      - FEEDBACK_NOTIFICATION_EMAIL=${FEEDBACK_NOTIFICATION_EMAIL}
      # RAG 부하테스트 mock (load-test/README.md) — enabled는 테스트 창에만 true로. endpoint 기본값은
      # compose 서비스 llm-mock(profiles: loadtest) — 빈 문자열 주입 트랩 방지 위해 기본값 필수
      - RAG_CHAT_LOADTEST_ENABLED=${RAG_CHAT_LOADTEST_ENABLED:-false}
      - RAG_LOADTEST_BEDROCK_ENDPOINT=${RAG_LOADTEST_BEDROCK_ENDPOINT:-http://llm-mock:9099}
      - CLOVA_LOADTEST_ENDPOINT=${CLOVA_LOADTEST_ENDPOINT:-http://llm-mock:9099/v1/api-tools/embedding/v2}
      # 검색 부하테스트 전용 엔드포인트(/api/search/articles/loadtest) — 캐시 미스 모드용.
      # 임베딩은 위 CLOVA_LOADTEST_ENDPOINT(mock)로 나가고 search_query_embedding/search_log는 안 쓴다.
      # RAG 부하테스트 게이트와 같은 이유로 상시 true — 반복 테스트마다 .env 수정+재배포를 하지 않기 위함.
      # 실질 방어선은 nginx의 X-LoadTest-Token(loadtest_token.conf)이다 (load-test/README.md "접근 통제" 참고).
      - SEARCH_LOADTEST_ENABLED=${SEARCH_LOADTEST_ENABLED:-true}
      # cross-scoring Vector 보충의 Stage 1 후보 재활용 (기본 true).
      # false로 두면 종전처럼 전부 DB로 보충 — 같은 빌드에서 core-s/req A/B를 재기 위한 스위치다
      # (docs/operations/PGSS_SEARCH_COST.md 항목 A). 여기 없으면 .env에 넣어도 컨테이너에 안 들어간다.
      - SEARCH_HYBRID_REUSE_STAGE1_CANDIDATES=${SEARCH_HYBRID_REUSE_STAGE1_CANDIDATES:-true}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./logs/blue:/app/logs
    networks:
      - app-network
    # 169.254.169.253: VPC가 항상 제공하는 Route53 Resolver — 호스트가 systemd-resolved(127.0.0.53)를 쓰면
    # Docker가 컨테이너에 자동으로 공용 DNS를 넣어버려 loadtest.local 같은 프라이빗 DNS를 못 풀게 되는 문제 방지
    dns:
      - 169.254.169.253
    init: true

  newcodes-backend-green:
    image: ghcr.io/newcodes7/small-town:latest
    container_name: newcodes-backend-green
    restart: unless-stopped
    logging: *backend-logging
    environment: *backend-env
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./logs/green:/app/logs
    networks:
      - app-network
    dns:
      - 169.254.169.253
    profiles:
      - green
    init: true

  # 부하테스트용 LLM API mock (Bedrock Converse/ConverseStream + Clova Embedding) — load-test/mock/
  # 평시 미기동(profiles: loadtest). 기동: docker compose --profile loadtest up -d llm-mock
  llm-mock:
    build:
      context: ./load-test/mock
    container_name: llm-mock
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    # 지연/장애 주입 env는 필요 시 여기에 추가 (MOCK_TTFT_MEDIAN_MS 등 — load-test/README.md)
    expose:
      - "9099"   # 호스트 포트 미공개 — app-network 내부(backend)에서만 접근
    healthcheck:
      # JRE 이미지에 curl/wget이 없어 bash /dev/tcp로 포트 오픈만 확인
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9099"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - app-network
    profiles:
      - loadtest

  prometheus:
    image: prom/prometheus:v2.37.4
    container_name: prometheus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    # command 오버라이드 시 이미지 기본 인자가 사라지므로 config/storage 경로 재명시.
    # --web.enable-remote-write-receiver: k6 부하테스트 결과 수신용 (load-test/README.md)
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    restart: always
    networks:
      - app-network
    expose:
      - "9090"
    # 인터넷에 직접 노출하지 않는다 — Fargate k6는 nginx의 /loadtest-prom/ 프록시(X-LoadTest-Token
    # 게이트, load-test/README.md)로 접근한다. 로컬에서 9090 직접 붙어야 하면 필요할 때만 임시로 열 것.
    extra_hosts:
      - "db-node-exporter:${DB_NODE_IP}"

  tempo:
    image: grafana/tempo:2.10.7
    container_name: tempo
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    restart: always
    networks:
      - app-network
    expose:
      - "4318"  # OTLP HTTP (앱 → Tempo)
      - "3200"  # 쿼리 API (Grafana → Tempo)

  grafana:
    # 11.6 LTS: Tempo TraceQL 검색 UI 지원 (8.3.3에서 업그레이드 — 배포 전 grafana-data 볼륨 백업 필수)
    image: grafana/grafana:11.6.9
    container_name: grafana
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - GF_PASSWORD=${ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://newcodes.net/admin/monitor/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=${MY_EMAIL}
      - GF_SMTP_PASSWORD=${MY_EMAIL_PASSWORD}
      - GF_SMTP_SKIP_VERIFY=false
      - GF_SMTP_FROM_ADDRESS=${MY_EMAIL}
      - GF_SMTP_FROM_NAME=Grafana Alerts
      - GF_SMTP_STARTTLS_POLICY=
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_ALERTING_ENABLED=false
    restart: always
    networks:
      - app-network
    expose:
      - "3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  loki:
    image: grafana/loki:2.9.3
    container_name: loki
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app-network
    restart: always

  promtail:
    image: grafana/promtail:2.9.3
    container_name: promtail
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./logs:/logs:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - app-network
    restart: always
    depends_on:
      - loki

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATA_SOURCE_NAME: "${POSTGRES_EXPORTER_DSN}"
    networks:
      - app-network
    expose:
      - "9187"  

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: newcodes-nginx
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 부하테스트 bypass 시크릿(gitignore 대상) — 없으면 nginx가 이 경로를 디렉터리로 만들어버려 기동 실패함.
      # 처음 docker compose up 하기 전에 반드시: cp nginx/loadtest_token.conf.example nginx/loadtest_token.conf
      - ./nginx/loadtest_token.conf:/etc/nginx/conf.d/loadtest_token.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - nginx-cache:/var/cache/nginx  # 캐시 디렉토리 볼륨
    depends_on:
      newcodes-backend-blue:
        condition: service_healthy
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    restart: unless-stopped  # 정책 누락 시 컨테이너가 한 번 멈추면(재부팅/OOM 등) 자동갱신 루프가 영영 안 돌아 인증서 만료로 이어짐(2026-08-08 장애)
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx

networks:
  app-network:
    driver: bridge

volumes:
  nginx-cache:
  grafana-data:
  tempo-data:
