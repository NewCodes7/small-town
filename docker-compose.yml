services:
  newcodes-backend-blue:
    image: ghcr.io/newcodes7/small-town:latest
    container_name: newcodes-backend-blue
    restart: unless-stopped
    environment: &backend-env
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SERVER_SSL_ENABLED=false  # Nginx에서 SSL 처리
      - ADMIN_URL=http://admin-server:9090
      - ADMIN_NAME=${ADMIN_NAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ROLES=${ROLES}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_ORG_ID=${OPENAI_ORG_ID}
      - OPENAI_MY_PROJECT_ID=${OPENAI_MY_PROJECT_ID}
      - OPENAI_WEBHOOK_SECRET=${OPENAI_WEBHOOK_SECRET}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - DEEPL_API_KEY=${DEEPL_API_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI}
      - GA_PROPERTY_ID=${GA_PROPERTY_ID}
      - GA_CREDENTIALS_PATH=/app/credentials/ga-credentials.json
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./logs/blue:/app/logs
      - ./credentials/ga-credentials.json:/app/credentials/ga-credentials.json:ro
    networks:
      - app-network
    init: true

  newcodes-backend-green:
    image: ghcr.io/newcodes7/small-town:latest
    container_name: newcodes-backend-green
    restart: unless-stopped
    environment: *backend-env
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./logs/green:/app/logs
      - ./credentials/ga-credentials.json:/app/credentials/ga-credentials.json:ro
    networks:
      - app-network
    profiles:
      - green
    init: true

  prometheus:
    image: prom/prometheus:v2.37.4
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml  
    restart: always

  grafana:
    image: grafana/grafana:8.3.3
    container_name: grafana
    environment:
      - GF_PASSWORD=${ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://newcodes.net/admin/monitor/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=${MY_EMAIL}
      - GF_SMTP_PASSWORD=${MY_EMAIL_PASSWORD}
      - GF_SMTP_SKIP_VERIFY=false
      - GF_SMTP_FROM_ADDRESS=${MY_EMAIL}
      - GF_SMTP_FROM_NAME=Grafana Alerts
      - GF_SMTP_STARTTLS_POLICY=
    restart: always

  loki:
    image: grafana/loki:2.9.3
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app-network
    restart: always

  promtail:
    image: grafana/promtail:2.9.3
    container_name: promtail
    volumes:
      - ./logs:/logs:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - app-network
    restart: always
    depends_on:
      - loki

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: newcodes-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - nginx-cache:/var/cache/nginx  # 캐시 디렉토리 볼륨
    depends_on:
      newcodes-backend-blue:
        condition: service_healthy
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx

networks:
  app-network:
    driver: bridge

volumes:
  nginx-cache:
