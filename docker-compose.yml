version: '3.8'

services:
  backend:
    build: .
    container_name: newcodes-backend
    restart: unless-stopped  
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SERVER_SSL_ENABLED=false  # Nginx에서 SSL 처리
      - ADMIN_URL=http://admin-server:9090
      - ADMIN_NAME=${ADMIN_NAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ROLES=${ROLES}
    expose:
      - "8080"  # 외부 노출 없이 내부 네트워크만
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # admin-server:
  #   build: ./admin-server
  #   container_name: admin-server
  #   ports:
  #     - "9090:9090"
  #   environment:
  #     - ADMIN_NAME=${ADMIN_NAME}
  #     - ADMIN_PASSWORD=${ADMIN_PASSWORD}
  #     - ROLES=${ROLES}

    prometheus:
      image: prom/prometheus:v2.37.4
      container_name: prometheus
      ports:
        - "9090:9090"
      volumes:
        - ./prometheus.yml:/etc/prometheus/prometheus.yml  
      restart: always

  grafana:
    image: grafana/grafana:8.3.3
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      - prometheus
    restart: always

  nginx:
    image: nginx:alpine 
    container_name: newcodes-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot --deploy-hook \"sudo docker exec newcodes-nginx nginx -s reload\"; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx