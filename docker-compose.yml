services:
  newcodes-backend-blue:
    image: ghcr.io/newcodes7/small-town:latest
    container_name: newcodes-backend-blue
    restart: unless-stopped
    logging: &backend-logging
      driver: json-file
      options:
        max-size: "20m"   # 파일 appender가 이미 ./logs/에 저장하므로 작게 설정
        max-file: "3"
    environment: &backend-env
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      # 미지정 시 빈 문자열이 주입돼 Spring 기본값을 덮어쓰므로 compose에서도 기본값 지정
      - BEDROCK_REGION=${BEDROCK_REGION:-ap-northeast-2}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SERVER_SSL_ENABLED=false  # Nginx에서 SSL 처리
      - ADMIN_URL=http://admin-server:9090
      - ADMIN_NAME=${ADMIN_NAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ROLES=${ROLES}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_ORG_ID=${OPENAI_ORG_ID}
      - OPENAI_MY_PROJECT_ID=${OPENAI_MY_PROJECT_ID}
      - OPENAI_WEBHOOK_SECRET=${OPENAI_WEBHOOK_SECRET}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - DEEPL_API_KEY=${DEEPL_API_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI}
      - CLOVA_API_KEY=${CLOVA_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY}
      # Gmail SMTP: Grafana 알림과 동일한 계정/앱 비밀번호 재사용
      - MAIL_USERNAME=${MY_EMAIL}
      - MAIL_PASSWORD=${MY_EMAIL_PASSWORD}
      - FEEDBACK_NOTIFICATION_EMAIL=${FEEDBACK_NOTIFICATION_EMAIL}
      # RAG 부하테스트 mock (load-test/README.md) — enabled는 테스트 창에만 true로. endpoint 기본값은
      # compose 서비스 llm-mock(profiles: loadtest) — 빈 문자열 주입 트랩 방지 위해 기본값 필수
      - RAG_CHAT_LOADTEST_ENABLED=${RAG_CHAT_LOADTEST_ENABLED:-false}
      - RAG_LOADTEST_BEDROCK_ENDPOINT=${RAG_LOADTEST_BEDROCK_ENDPOINT:-http://llm-mock:9099}
      - CLOVA_LOADTEST_ENDPOINT=${CLOVA_LOADTEST_ENDPOINT:-http://llm-mock:9099/v1/api-tools/embedding/v2}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./logs/blue:/app/logs
    networks:
      - app-network
    init: true

  newcodes-backend-green:
    image: ghcr.io/newcodes7/small-town:latest
    container_name: newcodes-backend-green
    restart: unless-stopped
    logging: *backend-logging
    environment: *backend-env
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./logs/green:/app/logs
    networks:
      - app-network
    profiles:
      - green
    init: true

  # 부하테스트용 LLM API mock (Bedrock Converse/ConverseStream + Clova Embedding) — load-test/mock/
  # 평시 미기동(profiles: loadtest). 기동: docker compose --profile loadtest up -d llm-mock
  llm-mock:
    build:
      context: ./load-test/mock
    container_name: llm-mock
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    # 지연/장애 주입 env는 필요 시 여기에 추가 (MOCK_TTFT_MEDIAN_MS 등 — load-test/README.md)
    expose:
      - "9099"   # 호스트 포트 미공개 — app-network 내부(backend)에서만 접근
    healthcheck:
      # JRE 이미지에 curl/wget이 없어 bash /dev/tcp로 포트 오픈만 확인
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9099"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - app-network
    profiles:
      - loadtest

  prometheus:
    image: prom/prometheus:v2.37.4
    container_name: prometheus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    # command 오버라이드 시 이미지 기본 인자가 사라지므로 config/storage 경로 재명시.
    # --web.enable-remote-write-receiver: k6 부하테스트 결과 수신용 (load-test/README.md)
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    restart: always
    networks:
      - app-network
    expose:
      - "9090"
    # 부하테스트 기간에만 개방: Fargate k6가 remote-write로 접근하는 경로.
    # 반드시 보안그룹/방화벽에서 소스 IP를 부하테스트 NAT EIP로만 제한할 것 (load-test/README.md)
    ports:
      - "9090:9090"
    extra_hosts:
      - "db-node-exporter:${DB_NODE_IP}"

  tempo:
    image: grafana/tempo:2.10.7
    container_name: tempo
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    restart: always
    networks:
      - app-network
    expose:
      - "4318"  # OTLP HTTP (앱 → Tempo)
      - "3200"  # 쿼리 API (Grafana → Tempo)

  grafana:
    # 11.6 LTS: Tempo TraceQL 검색 UI 지원 (8.3.3에서 업그레이드 — 배포 전 grafana-data 볼륨 백업 필수)
    image: grafana/grafana:11.6.9
    container_name: grafana
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - GF_PASSWORD=${ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://newcodes.net/admin/monitor/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=${MY_EMAIL}
      - GF_SMTP_PASSWORD=${MY_EMAIL_PASSWORD}
      - GF_SMTP_SKIP_VERIFY=false
      - GF_SMTP_FROM_ADDRESS=${MY_EMAIL}
      - GF_SMTP_FROM_NAME=Grafana Alerts
      - GF_SMTP_STARTTLS_POLICY=
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_ALERTING_ENABLED=false
    restart: always
    networks:
      - app-network
    expose:
      - "3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  loki:
    image: grafana/loki:2.9.3
    container_name: loki
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app-network
    restart: always

  promtail:
    image: grafana/promtail:2.9.3
    container_name: promtail
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./logs:/logs:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - app-network
    restart: always
    depends_on:
      - loki

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATA_SOURCE_NAME: "${POSTGRES_EXPORTER_DSN}"
    networks:
      - app-network
    expose:
      - "9187"  

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: newcodes-nginx
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - nginx-cache:/var/cache/nginx  # 캐시 디렉토리 볼륨
    depends_on:
      newcodes-backend-blue:
        condition: service_healthy
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx

networks:
  app-network:
    driver: bridge

volumes:
  nginx-cache:
  grafana-data:
  tempo-data:
